/* ---------- Calendar (.ics): application deadline and expiry, with reminders. Dates only, no amounts. ---------- */
function icsEsc(t){ return String(t).replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\r?\n/g,'\\n'); }
function icsFold(line){
  const enc=new TextEncoder(); if(enc.encode(line).length<=74) return line;
  const out=[]; let cur='', n=0;
  for(const ch of Array.from(line)){ const b=enc.encode(ch).length; if(n+b>(out.length?73:74)){ out.push(cur); cur=''; n=0; } cur+=ch; n+=b; }
  out.push(cur); return out.join('\r\n ');
}
function icsEvents(op){
  const exp=opExpiry(op); if(!exp || (OPINFO[op]||{}).app) return [];
  const i=OPINFO[op]||{}, name=opName(op), aoc=i.aoc?` (${i.aoc})`:'', slug=op.toLowerCase().replace(/[^a-z0-9]+/g,'-').slice(0,40), due=addDays(exp,-150);
  return [
    {uid:`aoc-apply-${slug}-${exp}@caat-ops-ct`,date:due,
     title:L(`AOC renewal application due · ${name}${aoc}`,`ครบกำหนดยื่นคำขอต่ออายุใบรับรอง · ${name}${aoc}`),
     desc:L(`Last day to apply for AOC renewal (150 days before expiry on ${dfmt(exp,true)}).`,`วันสุดท้ายของการยื่นคำขอต่ออายุใบรับรอง (ไม่น้อยกว่า 150 วันก่อนวันหมดอายุ ${dfmt(exp,true)})`),
     alarms:[30,7,1]},
    {uid:`aoc-expiry-${slug}-${exp}@caat-ops-ct`,date:exp,
     title:L(`AOC expires · ${name}${aoc}`,`ใบรับรองหมดอายุ · ${name}${aoc}`),
     desc:L(`AOC valid until ${dfmt(exp,true)}. A new AOC can be issued from ${dfmt(addDays(exp,-45),true)}.`,`ใบรับรองใช้ได้ถึง ${dfmt(exp,true)} ออกฉบับใหม่ได้ตั้งแต่ ${dfmt(addDays(exp,-45),true)}`),
     alarms:[45]}];
}
function icsText(evs){
  const stamp=new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d+Z$/,'Z'), L2=[];
  L2.push('BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//CAAT OPS CT//AOC Fee Calculator//EN','CALSCALE:GREGORIAN','METHOD:PUBLISH','X-WR-CALNAME:'+icsEsc(L('AOC renewals','การต่ออายุใบรับรอง')));
  evs.forEach(e=>{
    L2.push('BEGIN:VEVENT','UID:'+e.uid,'DTSTAMP:'+stamp,'DTSTART;VALUE=DATE:'+e.date.replace(/-/g,''),'DTEND;VALUE=DATE:'+addDays(e.date,1).replace(/-/g,''),
      'SUMMARY:'+icsEsc(e.title),'DESCRIPTION:'+icsEsc(e.desc),'TRANSP:TRANSPARENT');
    e.alarms.forEach(d=>L2.push('BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+icsEsc(e.title),`TRIGGER:-P${d-1}DT15H`,'END:VALARM'));   // 09:00, d days before
    L2.push('END:VEVENT');
  });
  L2.push('END:VCALENDAR');
  return L2.map(icsFold).join('\r\n')+'\r\n';
}
function saveIcs(evs,name){
  const t0=localISO(); evs=evs.filter(e=>e.date>=t0);
  if(!evs.length){ toast(L('No upcoming dates to add','ไม่มีกำหนดการที่จะถึงให้เพิ่ม')); return; }
  const url=URL.createObjectURL(new Blob([icsText(evs)],{type:'text/calendar;charset=utf-8'}));
  const a=document.createElement('a'); a.href=url; a.download=name+'.ics'; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),4000);

/* ---------- Saved edits: each operator's entries are kept on this device ---------- */
const EDIT_KEY='aoc.opEdits';
function dataSig(op){ const t=JSON.stringify([FLEET[op]||null,OPINFO[op]||null]); let h=0; for(let k=0;k<t.length;k++){ h=(h*31+t.charCodeAt(k))|0; } return (h>>>0).toString(36); }

/* Saving merges with what is already stored: only operators touched in this tab are written or removed,
   so a second open copy of the app cannot overwrite another copy's edits. */
const touched=new Set();
function readStore(){ let d=null; try{ d=JSON.parse(load(EDIT_KEY)||'null'); }catch(e){} return (d&&d.v===1&&d.ops&&typeof d.ops==='object')?d:{v:1,cur:'',ops:{}}; }
function persistNow(){
  clearTimeout(persistT); if(RESETTING) return;
  try{
    if(S.operator) touched.add(S.operator);
    const d=readStore();
    touched.forEach(op=>{
      const snap = op===S.operator ? (hasEdits()?snapOp():null) : (S.opCache[op]||null);
      if(snap) d.ops[op]={snap,sig:dataSig(op)}; else delete d.ops[op];

    store(EDIT_KEY,JSON.stringify(d));
  }catch(e){}

/* Saved data is checked before use; anything malformed is dropped rather than loaded. */
function cleanSnap(op,s){
  if(!s||typeof s!=='object'||!Array.isArray(s.types)||!s.types.length) return null;
  const okT=t=>t&&typeof t==='object'&&typeof t.id==='string'&&['AEROPLANE','HELICOPTER','BALLOON'].includes(t.cat);
  if(!s.types.every(okT)) return null;
  const i=OPINFO[op]||{}, d=clone(OP_DEF);
  const out={types:s.types,
    expiry:(typeof s.expiry==='string'&&/^(\d{4}-\d{2}-\d{2})?$/.test(s.expiry))?s.expiry:(i.until||''),
    expiryAuto:!!s.expiryAuto, tx:s.tx==='initial'?'initial':'renewal', txAuto:!!s.txAuto,
    changesAdded:Array.isArray(s.changesAdded)?s.changesAdded.filter(x=>x&&typeof x==='object'&&typeof x.mode==='string'&&x.p&&typeof x.p==='object'):[],
    change:(s.change&&typeof s.change==='object')?Object.assign(d.change,s.change):d.change,
    insp:(s.insp&&typeof s.insp==='object'&&Array.isArray(s.insp.acts))?Object.assign(d.insp,s.insp,{gov:Object.assign(d.insp.gov,(s.insp.gov&&typeof s.insp.gov==='object')?s.insp.gov:{})}):d.insp,
    na:{change:(s.na&&typeof s.na.change==='boolean')?s.na.change:d.na.change, insp:(s.na&&typeof s.na.insp==='boolean')?s.na.insp:d.na.insp},
    loadedSig:typeof s.loadedSig==='string'?s.loadedSig:null, fleetFrom:typeof s.fleetFrom==='string'?s.fleetFrom:null};
  if(!(s.insp&&typeof s.insp.showOp==='boolean')) out.insp.showOp=!!((toNum(out.insp.opTravel)||0)+(toNum(out.insp.opHotel)||0));   // older saved edits without the switch
  else out.insp.showOp=s.insp.showOp;

}
function restoreEdits(){
  const d=readStore(), all=OPERATORS.concat(S.customOps);
  let max=0;
  Object.entries(d.ops).forEach(([op,o])=>{ if(!all.includes(op)||!o) return; const snap=cleanSnap(op,o.snap); if(!snap) return;
    S.opCache[op]=snap; if(o.sig!==dataSig(op)) S.staleOps[op]=true;
    snap.types.forEach(t=>{ const m=/^t(\d+)$/.exec(t.id); if(m) max=Math.max(max,+m[1]); });
    snap.insp.acts.forEach(a=>{ const m=/^t(\d+)$/.exec((a&&a.id)||''); if(m) max=Math.max(max,+m[1]); }); });
  uid=Math.max(uid,max);
  if(d.cur && all.includes(d.cur)){
    if(S.opCache[d.cur]){ S.operator=d.cur; Object.assign(S,clone(S.opCache[d.cur])); }
    else switchOperator(d.cur);

}

const PDF_LIB='https://cdn.jsdelivr.net/npm/html2pdf.js@0.10.2/dist/html2pdf.bundle.min.js';
let pdfLibP=null;
function loadPdfLib(){
  if(window.html2pdf) return Promise.resolve();
  if(!pdfLibP) pdfLibP=new Promise((res,rej)=>{ const sc=document.createElement('script'); sc.src=PDF_LIB; sc.async=true;
    sc.onload=()=>window.html2pdf?res():rej(new Error('lib')); sc.onerror=()=>{ pdfLibP=null; sc.remove(); rej(new Error('net')); }; document.head.appendChild(sc); });
  return pdfLibP;
}
/* html2canvas only wraps at spaces, so long Thai runs were drawn on one line. Mark Thai word boundaries with
   zero-width spaces (Intl.Segmenter) so the captured lines match the browser layout. */
function pdfSource(){
  const host=document.createElement('div'); host.className='rp-x'; host.innerHTML=reportHTML();
  let seg=null; try{ seg=new Intl.Segmenter('th',{granularity:'word'}); }catch(e){}
  if(seg){
    const w=document.createTreeWalker(host,NodeFilter.SHOW_TEXT), nodes=[]; while(w.nextNode()) nodes.push(w.currentNode);
    nodes.forEach(n=>{ if(/[\u0E00-\u0E7F]/.test(n.nodeValue)) n.nodeValue=Array.from(seg.segment(n.nodeValue),x=>x.segment).join('\u200B'); });
  }
  return host;
}
async function makePdf(){
  await loadPdfLib();
  try{ if(document.fonts&&document.fonts.ready) await document.fonts.ready; }catch(e){}
  const y=window.scrollY; window.scrollTo(0,0);
  try{ return await window.html2pdf().set({
    margin:[12,13,14,13], filename:fileStem()+'.pdf',
    image:{type:'jpeg',quality:0.96},
    html2canvas:{scale:2,backgroundColor:'#ffffff',logging:false,scrollX:0,scrollY:0},
    jsPDF:{unit:'mm',format:'a4',orientation:'portrait',compress:true},
    pagebreak:{mode:['css','legacy'],avoid:['tr','.rp-blk','.rp-sign','.rp-tot','.rp-kpis','.rp-s h3','.rp-h','li']}
  }).from(pdfSource(),'element').outputPdf('blob'); }
  finally{ window.scrollTo(0,y); }
}

  const d=new Date(), stamp=`${localISO()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
  const ua=String(navigator.userAgent||''), dev=(/iPhone|iPad/.test(ua)?'iOS':/Android/.test(ua)?'Android':/Windows/.test(ua)?'Windows':/Mac/.test(ua)?'Mac':'Other')+' / '+(/Edg\//.test(ua)?'Edge':/Chrome\//.test(ua)?'Chrome':/Firefox\//.test(ua)?'Firefox':/Safari\//.test(ua)?'Safari':'Other');
  const subject=L('AOC Fee Calculator: error report','แจ้งข้อผิดพลาด AOC Fee Calculator');
  const body=[L('Please describe the error (what you did, what you expected, what you saw):','โปรดระบุข้อผิดพลาด (สิ่งที่ทำ ผลที่คาดหวัง และผลที่ปรากฏ):'),'','','',

    `Language: ${LANG}`,`Date: ${stamp}`,`Device: ${dev}`].join('\r\n');

/* Report error: on iPhone, iPad and Android try the Outlook app first (ms-outlook://compose).
   If Outlook does not open within 1.5 s (not installed), fall back to the default mail app. Computers use the normal mail link. */
function outlookHref(mail){ return `ms-outlook://compose?to=${encodeURIComponent(REPORT_TO)}&${mail.split('?')[1]||''}`; }   // same encoded subject and body as the mail link
function isMobileOS(){ const ua=String(navigator.userAgent||''); return /iPhone|iPad|iPod|Android/.test(ua) || (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1); }
function reportError(){
  const mail=reportHref();
  if(!isMobileOS()){ location.href=mail; return; }
  let left=false; const onHide=()=>{ if(document.visibilityState==='hidden') left=true; };
  document.addEventListener('visibilitychange',onHide); window.addEventListener('pagehide',onHide);
  setTimeout(()=>{ document.removeEventListener('visibilitychange',onHide); window.removeEventListener('pagehide',onHide);
    if(!left && document.visibilityState==='visible'){ toast(L('Outlook not found: opening your mail app','ไม่พบแอป Outlook จึงเปิดแอปอีเมลของอุปกรณ์แทน')); location.href=mail; } },1500);
  location.href=outlookHref(mail);
}

function doCSV(){
  if(!S.healthy){ toast(L('Calculator locked: self-test failed','ระบบถูกระงับ: การทดสอบไม่ผ่าน')); return; }
  const s=buildSummary(), c=s.cert;
  const rows=[[L('AOC Fee Estimate','ประมาณการค่าธรรมเนียมใบรับรองผู้ดำเนินการเดินอากาศ'),RULESET.version],[L('Air operator','ผู้ดำเนินการเดินอากาศ'),S.operator?opName(S.operator):L('Not specified','ไม่ได้ระบุ')],[L('AOC No.','ใบรับรองเลขที่'),(OPINFO[S.operator]||{}).aoc||'–'],[L('Transaction','ประเภทคำขอ'),AOCTX()],[L('Status','สถานะ'),statusText(s.status)],[L('Date','วันที่'),today()],[],
    [L('Section','หมวด'),L('Item','รายการ'),L('Basis','หลักเกณฑ์'),L('Reference','บทบัญญัติ'),BAHT()]];
  if(c.total!=null) c.lines.forEach(l=>rows.push([L('AOC fees','ค่าธรรมเนียม'),l.label,l.basis,l.ref,Math.round(l.amount*100)/100]));
  CHS().forEach(x=>x.lines.forEach(l=>rows.push([L('Change','การเปลี่ยนแปลง'),x.title,l.basis,l.ref,Math.round(l.amount*100)/100])));
  s.ins.acts.forEach(x=>{ if(!x.r.error) rows.push([L('Inspection','การตรวจสอบ'),`${x.i+1}. ${KIND_L(x.a.kind)}`,`${x.r.days} x ${x.r.persons} x ${x.r.rate}`,'ระเบียบ 5/1 ข้อ 5, ภาคผนวก ก',x.r.amount]); });
  if(s.gov) rows.push([L('Inspection','การตรวจสอบ'),L('Government flat rates','อัตราเหมาจ่ายหน่วยงานของรัฐ'),'','ข้อ 9, ภาคผนวก จ',s.gov]);
  if(s.ins.op) rows.push([L('Operator-provided','ผู้ขอจัดหาเอง'),L('Travel and accommodation','ค่าพาหนะและที่พัก'),L('Paid directly','ชำระโดยตรง'),'ข้อ 7–8',s.ins.op]);
  rows.push([],[L('Total','รวม'),L('Estimated payments to CAAT','ยอดชำระให้ กพท. โดยประมาณ'),'','',s.caat]);
  if(s.ins.op) rows.push([L('Total','รวม'),L('Total financial commitment','ภาระค่าใช้จ่ายรวม'),'','',s.commit]);
  s.points.forEach(p=>rows.push([L('Point to verify','ประเด็นที่ต้องตรวจสอบ'),p]));
  const cell=v=>{ const t=String(v??''); return (typeof v==='string' && /^[=+\-@\t\r]/.test(t)) ? "'"+t : t; };   // stop spreadsheets reading text as a formula
  const csv='﻿'+rows.map(r=>r.map(v=>`"${cell(v).replace(/"/g,'""')}"`).join(',')).join('\r\n');
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'})); a.download=fileStem()+'.csv'; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),4000); toast(L('CSV downloaded','ดาวน์โหลด CSV แล้ว'));
}
function doCopy(){
  if(!S.healthy){ toast(L('Calculator locked: self-test failed','ระบบถูกระงับ: การทดสอบไม่ผ่าน')); return; }
  const s=buildSummary(), c=s.cert;
  const Ln=[`${L('AOC fee estimate','ประมาณการค่าธรรมเนียม')} · ${S.operator?opName(S.operator):L('Air operator not specified','ไม่ได้ระบุผู้ดำเนินการเดินอากาศ')}`,`${AOCTX()} · ${today()} · ${statusText(s.status)}`];
  if(initWarnText()) Ln.push(`⚠ ${initWarnText()}`);
  if(c.total!=null){ Ln.push('',`${L('AOC fees','ค่าธรรมเนียม')}: ${fmt(c.total)}`); c.lines.forEach(l=>Ln.push(`  ${l.label}: ${fmt(l.amount)} (${l.ref})`)); }
  if(CHS().length){ Ln.push('',`${L('Changes','การเปลี่ยนแปลง')}: ${fmt(s.chg)}`); CHS().forEach(x=>Ln.push(`  ${x.title}: ${fmt(x.total)}`)); }
  if(s.ins.acts.length||s.gov) Ln.push('',`${L('Section 5/1 expenses','ค่าใช้จ่ายตามมาตรา 5/1')}: ${fmt(s.ins.E+s.gov)}`);
  Ln.push('',`${L('Estimated payments to CAAT','ยอดชำระให้ กพท. โดยประมาณ')}: ${fmt(s.caat)} ${BAHT()}`);
  if(s.ins.op) Ln.push(`${L('Operator-provided','ผู้ขอจัดหาเอง')}: ${fmt(s.ins.op)} · ${L('Total commitment','ภาระค่าใช้จ่ายรวม')}: ${fmt(s.commit)} ${BAHT()}`);
  Ln.push('',L(`Rule set ${RULESET.version}. Estimate only, not an invoice.`,`ชุดอัตรา ${RULESET.version} เป็นการประมาณการ มิใช่ใบแจ้งหนี้`));
  const txt=Ln.join('\n');
  (navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>toast(L('Summary copied','คัดลอกสรุปแล้ว'))).catch(()=>toast(L('Copy not available on this browser','เบราว์เซอร์นี้ไม่รองรับการคัดลอก')));
}

/* ---------- Events ---------- */
const findT=id=>S.types.find(t=>t.id===id), findA=id=>S.insp.acts.find(a=>a.id===id);
const bool=v=> v==='true'?true:v==='false'?false:v;
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]'); if(!el) return;
  const act=el.dataset.act, id=el.dataset.id, v=bool(el.dataset.val);
  const t=id?findT(id):null, a=id?findA(id):null, c=S.change;
  switch(act){
    case 'tab': S.tab=v; renderAll(); window.scrollTo({top:0,behavior:'smooth'}); return;
    case 'lang': S.lang=v==='th'?'th':'en'; setLang(S.lang); store('aoc.lang',S.lang); renderAll(); return;
    case 'sumMode': S.sumMode=v==='simple'?'simple':'detailed'; store('aoc.sumMode',S.sumMode); break;
    case 'tx': if(v==='initial' && S.tx!=='initial' && certifiedInfo(S.operator)){ confirmInitial(()=>{ S.tx='initial'; S.txAuto=false; persistSoon(); rerenderKeepScroll(); }); return; }
      S.tx=v; S.txAuto=false; break;
    case 'tcat': t.cat=v; t.area=v==='BALLOON'?'NA':''; t.legacyConfirm=null; break;
    case 'splitType': { const i=S.types.findIndex(x=>x.id===id); const parts=t.models.map(mid=>{ const a=acById(mid); return {id:nid(),ac:mid,models:[mid],name:mid,cat:acCat(a),heavy:acHeavy(a),area:t.area,mtow:'',showMtow:false,count:1,legacyConfirm:null,src:t.src,chk:t.chk}; }); S.types.splice(i,1,...parts); toast(L(`Split into ${parts.length} types`,`แยกเป็น ${parts.length} แบบ`)); break; }
    case 'useRef': { const a=acById(t.ac); if(a&&a.m){ t.showMtow=true; t.mtow=String(a.m); t.legacyConfirm=null; } break; }
    case 'theavy': t.heavy=v; break;
    case 'tarea': t.area=v; break;
    case 'tlegacy': t.legacyConfirm=v; break;
    case 'showMtow': t.showMtow=true; break;
    case 'hideMtow': t.showMtow=false; t.mtow=''; t.legacyConfirm=null; break;
    case 'tcount': t.count=Math.max(1,t.count+Number(el.dataset.val)); break;
    case 'addType': { const f=S.types[0]; S.types.push({id:nid(),ac:'',name:'',cat:f?f.cat:'AEROPLANE',heavy:f?f.heavy:true,area:f&&f.cat==='BALLOON'?'NA':'',mtow:'',count:1,showMtow:false,legacyConfirm:null}); break; }
    case 'delType': S.types=S.types.filter(x=>x.id!==id); break;
    case 'cmode': c.mode=v; if(v==='expand'&&RANK[c.to]<=RANK[c.from]){ c.from='DOM'; c.to=AREAS_FOR[c.cat][1]; } break;
    case 'ccat': c.cat=v; c.area=AREAS_FOR[v][0]; c.from='DOM'; c.to=AREAS_FOR[v][1]; break;
    case 'cheavy': c.heavy=v; break;
    case 'carea': c.area=v; break;
    case 'cfrom': c.from=v; if(RANK[c.to]<=RANK[v]){ const nx=AREAS_FOR[c.cat].find(x=>RANK[x]>RANK[v]); if(nx) c.to=nx; } break;
    case 'cto': c.to=v; break;
    case 'ccol': c.col=v; break;
    case 'cprorate': c.prorate=v; break;
    case 'cocc': c.occasions=Math.max(1,c.occasions+Number(el.dataset.val)); break;
    case 'creason': c.reason=v; break;
    case 'iapp': S.insp.applicant=v; break;
    case 'iinc': S.insp.includeCert=v; break;
    case 'iop': S.insp.showOp=v===true; break;
    case 'addAct': S.insp.acts.push(newAct()); break;
    case 'delAct': S.insp.acts=S.insp.acts.filter(x=>x.id!==id); break;
    case 'akind': a.kind=v; break;
    case 'adays': a.workDays=Math.max(1,a.workDays+Number(el.dataset.val)); break;
    case 'apers': a.persons=Math.max(0,a.persons+Number(el.dataset.val)); break;
    case 'aexcl': a.excluded=Math.max(0,a.excluded+Number(el.dataset.val)); break;
    case 'basis': S.settings.areaExpansionBasis=v; store('aoc.basis',v); toast(L('Area-expansion basis saved on this device','บันทึกอัตราอ้างอิงในอุปกรณ์นี้แล้ว')); break;
    case 'addChange': { const r=calcChange(c.mode,c,S.settings); if(r.status==='INCOMPLETE'){ toast(L('Complete the change details first','กรุณากรอกรายละเอียดให้ครบก่อน')); return; }
      S.changesAdded.push({id:nid(),mode:c.mode,p:JSON.parse(JSON.stringify(c)),basis:S.settings.areaExpansionBasis}); toast(L('Added to Summary','เพิ่มในหน้าสรุปแล้ว')); break; }
    case 'delChange': S.changesAdded=S.changesAdded.filter(x=>x.id!==id); break;
    case 'goSum': S.tab='sum'; renderAll(); window.scrollTo({top:0,behavior:'smooth'}); return;
    case 'opSave': saveOperator(); return;
    case 'loadFleet': { const go=()=>{ loadFleet(S.operator); renderOpbar(); rerenderKeepScroll(); persistSoon(); };
      if(typesPristine()){ go(); return; }
      askSheet(L('Replace your aircraft types?','แทนที่แบบอากาศยานที่กรอกไว้หรือไม่'),L('The aircraft types you entered for this operator will be replaced with the Ops Spec list.','แบบอากาศยานที่กรอกไว้ของผู้ดำเนินการรายนี้จะถูกแทนที่ด้วยรายการจากข้อกำหนดการปฏิบัติการ'),L('Replace with Ops Spec list','แทนที่ด้วยรายการจากข้อกำหนดการปฏิบัติการ'),go); return; }
    case 'opCancel': S.addingOp=false; S.opDraft=''; renderOpbar(); return;
    case 'opRemove': { const gone=S.operator; delete S.opCache[gone]; touched.add(gone); } S.customOps=S.customOps.filter(o=>o!==S.operator); store('aoc.customOps',JSON.stringify(S.customOps)); S.operator=''; freshOp(''); persistSoon(); toast(L('Removed from list','ลบออกจากรายการแล้ว')); renderOpbar(); if(S.tab==='sum') renderPage(); return;
    case 'print': needAck('print',doPrint); return;
    case 'preview': openPreview(); return;
    case 'pvClose': closePreview(); return;
    case 'pvPrint': closePreview(); needAck('print',doPrint); return;
    case 'printNow': doPrint(); return;
    case 'send': needAck('send',openSend); return;
    case 'pipeF': S.pipeF=v; renderPage(); return;
    case 'opcOpen': { const box=document.querySelector('.opcombo'); if(box&&box.querySelector('.opc-pan')) opcClose(); else opcOpen(); return; }
    case 'revTip': { const t=document.getElementById('rcTip'); if(t){ t.textContent=el.dataset.tip; t.classList.add('on'); } document.querySelectorAll('.rc-seg.sel').forEach(x=>x.classList.remove('sel')); el.classList.add('sel'); return; }
    case 'revBasis': S.revBasis=v==='cal'?'cal':'fy'; store('aoc.revBasis',S.revBasis); renderPage(); return;
    case 'report': reportError(); return;
    case 'ver': S.tab='settings'; renderAll(); window.scrollTo(0,0); return;
    case 'icsOne': icsOne(el.dataset.op); return;
    case 'pipeOpen': { const op=el.dataset.op; if(op!==S.operator) switchOperator(op); S.tab='cert'; renderAll(); window.scrollTo({top:0,behavior:'smooth'}); return; }
    case 'resetOp': { const op=el.dataset.op;
      askSheet(L(`Use the built-in data for ${opName(op)}?`,`ใช้ข้อมูลในระบบสำหรับ ${opName(op)} หรือไม่`),L('Your saved entries for this operator will be removed and replaced by the built-in data.','ข้อมูลที่บันทึกไว้ของผู้ดำเนินการรายนี้จะถูกลบและแทนที่ด้วยข้อมูลในระบบ'),L('Use built-in data','ใช้ข้อมูลในระบบ'),
        ()=>{ resetOp(op); renderAll(); toast(L('Built-in data restored for this operator','ใช้ข้อมูลในระบบสำหรับผู้ดำเนินการรายนี้แล้ว')); }); return; }
    case 'resetApp': confirmReset(); return;
    case 'ackYes': { const f=ackNext; closeAck(); if(f) f(); return; }
    case 'ackNo': closeAck(); return;
    case 'na': S.na[v]=el.dataset.on==='1'; renderAll();
      toast(S.na[v]?L('Marked Not Applicable: left out of the Summary and reports','กำหนดเป็นไม่เกี่ยวข้อง: ไม่แสดงในหน้าสรุปและรายงาน'):L('Included in the Summary and reports again','นำกลับมารวมในหน้าสรุปและรายงานแล้ว')); return;
    case 'sendClose': closeSend(); return;
    case 'sendRetry': openSend(); return;
    case 'sendShare': doShare(); return;
    case 'sendDl': doDownload(); return;
    case 'sendMail': doMailDraft(); return;
    case 'csv': needAck('csv',doCSV); return;
    case 'copy': needAck('copy',doCopy); return;
    default: return;
  }
  rerenderKeepScroll();
});
document.addEventListener('input',e=>{
  persistSoon();
  const el=e.target; const b=el.dataset.bind; if(!b) return;
  const id=el.dataset.id, val=el.value, c=S.change;
  if(b==='name'){ findT(id).name=val; renderSide(); return; }
  if(b==='mtow'){ const t=findT(id); t.mtow=val; if(!classify(t).boundary) t.legacyConfirm=null; refreshTypeCards(); renderSide(); return; }
  if(b==='expiry'){ S.expiry=val; S.expiryAuto=false; renderTimeline(); return; }
  if(b==='cM'){ c.M=Number(val); const t=document.querySelector('[data-bind="cMtxt"]'); if(t) t.value=val; el.style.setProperty('--p',(c.M/(toNum(c.T)||60)*100)+'%'); renderSide(); return; }
  if(b==='cMtxt'){ c.M=val; const r=document.querySelector('[data-bind="cM"]'); const n=toNum(val); if(r&&n!=null&&!isNaN(n)){ r.value=n; r.style.setProperty('--p',(n/(toNum(c.T)||60)*100)+'%'); } renderSide(); return; }
  if(b==='cT'){ c.T=val; const r=document.querySelector('[data-bind="cM"]'); const T=toNum(val); if(r&&T>0){ r.max=T; r.style.setProperty('--p',Math.min(100,(toNum(c.M)||0)/T*100)+'%'); } const em=document.querySelector('[data-bind="cMtxt"]'); if(em&&em.nextElementSibling&&T>0) em.nextElementSibling.textContent='/ '+T; renderSide(); return; }
  if(b==='country'){ findA(id).country=val; updateAct(id); return; }
  if(b==='start'||b==='end'){ findA(id)[b]=val; updateAct(id); return; }
  if(b==='opDraft'){ S.opDraft=val; return; }
  if(b==='mailTo'){ if(S.send) S.send.to=val; store('aoc.mailTo',val.trim()); return; }
  if(b==='opTravel'||b==='opHotel'){ S.insp[b]=val; renderSide(); return; }
  if(b==='gnights'){ S.insp.gov.nights=val; renderSide(); return; }
  if(b==='gflights'){ S.insp.gov.flights=val; renderSide(); return; }
  if(b==='gveh'){ S.insp.gov.vehicleDays=val; renderSide(); return; }
});
document.addEventListener('change',e=>{
  persistSoon();
  const b=e.target.dataset.bind;
  if(b==='acsel'){
    const t=findT(e.target.dataset.id), v=e.target.value;
    if(v==='OTHER'){ t.ac='OTHER'; t.name=''; t.models=[]; }
    else if(!v){ t.ac=''; t.name=''; }
    else { const a=acById(v); t.ac=v; t.name=a.id; t.models=[v]; t.chk=false; const cat=acCat(a); if(t.cat!==cat){ t.cat=cat; t.area=''; }
      if(t.area && !AREAS_FOR[t.cat].includes(t.area)) t.area='';
      t.heavy=acHeavy(a); t.showMtow=false; t.mtow=''; t.legacyConfirm=null; }
    rerenderKeepScroll(); return;
  }
  if(b==='opsel'){
    const v=e.target.value;
    if(v==='__add'){ S.addingOp=true; S.opDraft=''; renderOpbar(); const i=document.querySelector('[data-bind="opDraft"]'); if(i) i.focus(); return; }
    switchOperator(v);
    renderAll(); return;
  }
});
document.addEventListener('keydown',e=>{
  if(e.target.dataset&&e.target.dataset.bind==='opDraft'){ if(e.key==='Enter'){ e.preventDefault(); saveOperator(); } else if(e.key==='Escape'){ S.addingOp=false; renderOpbar(); } }
});
function updateAct(id){ const a=findA(id); const el=document.getElementById('calc-'+id); if(el) el.innerHTML=actCalcText(calcActivity(a)); renderSide(); }
document.getElementById('mini').addEventListener('click',()=>{ const r=document.getElementById('side'); if(r) r.scrollIntoView({behavior:'smooth',block:'start'}); });

/* ---------- Init: render first, then self-test (tests run in English, then the chosen language is restored) ---------- */
function init(){
  setLang('en'); S.tests=runTests(); setLang(S.lang);
  const badAc=AC_TYPES.filter(a=>a.m && ((a.g[0]==='A'?a.m>5700:a.m>3192)!==acHeavy(a))).map(a=>a.id);
  const dupAc=AC_TYPES.map(a=>a.id).filter((x,i,arr)=>arr.indexOf(x)!==i);
  S.tests.push({id:'AC-01',desc:'Aircraft list: reference MTOW agrees with weight class',expected:[],got:badAc,pass:badAc.length===0});
  const badFleet=[]; Object.entries(FLEET).forEach(([op,gs])=>{ if(!OPERATORS.includes(op)) badFleet.push(op); gs.forEach(g=>g.m.forEach(id=>{ if(!acById(id)) badFleet.push(op+':'+id); })); });
  S.tests.push({id:'AC-03',desc:'Fleet list: every operator and aircraft code is known',expected:[],got:badFleet,pass:badFleet.length===0});
  S.tests.push({id:'AC-02',desc:'Aircraft list: no duplicate designators',expected:[],got:dupAc,pass:dupAc.length===0});
  { const tgOp='Thai Airways International Public Company Limited';
    const due=addDays('2027-05-07',-150);
    S.tests.push({id:'PL-01',desc:'Pipeline: application deadline = expiry − 150 days',expected:'2026-12-08',got:due,pass:due==='2026-12-08'});
    const fee=calcCertificate(fleetCards(tgOp),'renewal',RULESET).total;
    S.tests.push({id:'PL-02',desc:'Pipeline: Thai Airways renewal from the Ops Spec list',expected:22105000,got:fee,pass:fee===22105000});
    const txt=icsText([{uid:'x@y',date:'2027-01-02',title:'ครบกำหนดยื่นคำขอต่ออายุใบรับรอง · บริษัท การบินไทย จำกัด (มหาชน) (AOC.0003), test; a\\b',desc:'d',alarms:[30]}]);
    const enc=new TextEncoder(), long=txt.split('\r\n').filter(l=>enc.encode(l).length>75);
    const okIcs=long.length===0 && txt.includes('DTSTART;VALUE=DATE:20270102') && txt.includes('DTEND;VALUE=DATE:20270103') && txt.includes('TRIGGER:-P29DT15H') && txt.includes('\\;') && txt.endsWith('END:VCALENDAR\r\n');
    S.tests.push({id:'PL-03',desc:'Calendar file: dates, reminders, escaping and line folding',expected:true,got:okIcs,pass:okIcs}); }
  S.healthy=S.tests.every(t=>t.pass);
  restoreEdits();
  /* Install/offline support was withdrawn: remove any offline worker left from a trial version. */
  try{ if('serviceWorker' in navigator) navigator.serviceWorker.getRegistrations().then(rs=>rs.forEach(r=>{ const w=r.active||r.waiting||r.installing; if(w&&/aoc-sw\.js/.test(w.scriptURL)) r.unregister(); })).catch(()=>{}); }catch(e){}
  document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='hidden') persistNow(); });
  window.addEventListener('pagehide',persistNow);
  renderAll();
}
init();
