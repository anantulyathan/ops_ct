    const wl=weightLabels(t.cat);
    h+=`<div class="type ${isP?'principal':''}" data-tid="${t.id}">
      <div class="type-h"><span class="num">${i+1}</span>
        ${acSelectHTML(t)}
        <span class="pslot">${pillHTML(res,i)}</span>
        ${S.types.length>1?`<button type="button" class="icon-btn" data-act="delType" data-id="${t.id}" aria-label="${esc(L('Remove type','ลบแบบอากาศยาน'))}">${ICON.x}</button>`:''}
      </div>
      ${t.ac==='OTHER'?`<div class="field" style="margin-top:10px"><input data-bind="name" data-id="${t.id}" value="${esc(t.name)}" placeholder="${esc(L('Type name or ICAO designator','ชื่อแบบหรือรหัส ICAO ของอากาศยาน'))}" aria-label="${esc(L('Type name','ชื่อแบบอากาศยาน'))}"></div>`:''}
      <div class="acslot">${acAutoHTML(t)}</div>
      <div class="lbl">${L('Category','ประเภทอากาศยาน')}</div>${catsHTML(t.cat,'tcat',t.id)}`;
    if(t.cat!=='BALLOON'){
      h+=`<div class="lbl">${L('Maximum take-off weight','น้ำหนักวิ่งขึ้นสูงสุด')} <small>${L('per Aircraft Flight Manual','ตามที่ระบุไว้ในคู่มือประกอบการบิน')}</small></div>
        ${t.showMtow
          ? `<div class="field"><input inputmode="decimal" data-bind="mtow" data-id="${t.id}" value="${esc(t.mtow)}" placeholder="${esc(L('e.g. 78000','เช่น 78000'))}"><em>${L('kg','กก.')}</em></div>
             <button type="button" class="more" data-act="hideMtow" data-id="${t.id}">${L('Use weight class instead','เลือกช่วงน้ำหนักแทน')}</button>`
          : `${seg([[false,wl[0]],[true,wl[1]]],t.heavy,'theavy',t.id,'',true)}<button type="button" class="more" data-act="showMtow" data-id="${t.id}">${L('Enter or correct the exact MTOW','ระบุหรือแก้ไขน้ำหนักวิ่งขึ้นสูงสุด')}</button>`}`;

      h+=`<div class="lbl">${L('Area of Operation','พื้นที่ปฏิบัติการ')} <small>${L('as approved in the Ops Specs','ตามข้อกำหนดการปฏิบัติการที่ได้รับอนุมัติ')}</small></div>${routeHTML(t.cat,t.area,'tarea',t.id)}`;
    }
    h+=`<div class="lbl">${L('Aircraft of this type','จำนวนอากาศยานในแบบนี้')} <small>${L('for your record only, never multiplies the fee','เพื่อการบันทึกเท่านั้น ไม่นำไปคูณค่าธรรมเนียม')}</small></div>
      <div class="stepper"><button type="button" data-act="tcount" data-id="${t.id}" data-val="-1">−</button><span>${t.count}</span><button type="button" data-act="tcount" data-id="${t.id}" data-val="1">+</button></div>`;
    h+=`<div class="fslot">${feeHTML(feeOf(i))}</div></div>`;

  h+=`<button type="button" class="add-btn" data-act="addType">${ICON.plus} ${L('Add another aircraft type','เพิ่มแบบอากาศยาน')}</button></div>`;
  if(S.tx==='renewal'){
    h+=`<div class="card"><div class="eyebrow">${L('Optional','ไม่บังคับ')}</div><h2>${L('Renewal timeline','กำหนดเวลาการต่ออายุ')}</h2><p class="sub">${L('RCAAT No. 26 ข้อ 12 · calendar days','ข้อบังคับของ กพท. ฉบับที่ 26 ข้อ 12 · นับตามวันปฏิทิน')}</p>
      <div class="field" style="max-width:300px"><em>${L('AOC expiry','วันหมดอายุใบรับรอง')}</em><input type="date" data-bind="expiry" value="${esc(S.expiry)}"></div><div id="tl"></div></div>`;
  }
  document.getElementById('page-cert').innerHTML=h;
  renderTimeline();
}
function renderTimeline(){
  const el=document.getElementById('tl'); if(!el) return;
  if(!S.expiry){ el.innerHTML=''; return; }
  const now=new Date().toISOString().slice(0,10), late=now>addDays(S.expiry,-150), gone=now>S.expiry;
  const lateNote = gone ? note('warn',L('This AOC has already expired. A renewal is no longer possible on these dates; check whether a first issue applies.','ใบรับรองนี้หมดอายุแล้ว ไม่สามารถต่ออายุตามกำหนดเวลานี้ได้ กรุณาตรวจสอบว่าต้องดำเนินการขอออกใบรับรองใหม่หรือไม่'))
    : late ? note('warn',L(`The 150-day application date (${dfmt(addDays(S.expiry,-150))}) has already passed.`,`พ้นกำหนดยื่นคำขอล่วงหน้า 150 วัน (${dfmt(addDays(S.expiry,-150))}) แล้ว`)) : '';
  el.innerHTML=(S.expiryAuto?`<div class="fleetline muted" style="margin:6px 0">${ICON.info}<span>${L('Expiry prefilled from the AOC register. Edit it if it has changed.','วันหมดอายุดึงจากทะเบียนใบรับรอง แก้ไขได้หากมีการเปลี่ยนแปลง')}</span></div>`:'')+lateNote+`<div class="tl"><div class="hl"><small>${L('Apply no later than','ยื่นคำขอภายใน')}</small><b>${dfmt(addDays(S.expiry,-150))}</b><small>${L('150 days before expiry','ไม่น้อยกว่า 150 วันก่อนหมดอายุ')}</small></div>
    <div><small>${L('New AOC can be issued from','ออกใบรับรองฉบับใหม่ได้ตั้งแต่')}</small><b>${dfmt(addDays(S.expiry,-45))}</b><small>${L('up to 45 days before expiry','ไม่เกิน 45 วันก่อนหมดอายุ')}</small></div>
    <div><small>${L('Current AOC expires','ใบรับรองฉบับเดิมหมดอายุ')}</small><b>${dfmt(S.expiry)}</b><small>${L('continuity from old certificate','มีผลต่อเนื่องจากฉบับเดิม')}</small></div></div>`
    +(S.operator?`<button type="button" class="btn btn-s tl-cal" data-act="icsOne" data-op="${esc(S.operator)}">${ICON.calAdd} ${L('Add deadlines to calendar','เพิ่มกำหนดการลงปฏิทิน')}</button>`:'');
}

function actCalcText(r){
  if(r.error) return `<span>${esc(r.error)}</span>`;
  const hrs=r.hours!=null?` · ${fmt(r.hours)} ${L('h elapsed','ชั่วโมง')}`:'';
  return `<span>${r.days} ${L(r.days===1?'day':'days','วัน')} × ${r.persons} × ${fmt(r.rate)}${hrs}</span><b>฿ ${fmt(r.amount)}</b>`;
}

function resultCard(o){
  const {title,sub,total,status,lines,errors,warnings,notes,bar,sumLabel}=o;
  let h=`<div class="result" id="result"><div class="result-top"><div class="k"><span>${esc(title)}</span>${statusPill(status)}</div>
    <div class="total"><small>฿</small>${total!=null?fmt(total):'—'}</div><div class="cap">${esc(sub||'')}</div>`;
  if(bar&&total){ h+=`<div class="bar">${bar.map(b=>`<i style="width:${b.v/total*100}%;background:${b.c}"></i>`).join('')}</div><div class="legend">${bar.map(b=>`<span><i style="background:${b.c}"></i>${esc(b.k)}</span>`).join('')}</div>`; }
  h+=`</div>`;
  if(lines&&lines.length){ h+=`<div class="lines">${lines.map(lineHTML).join('')}${total!=null?`<div class="line sum"><div class="t">${esc(sumLabel||L('Total','รวม'))}</div><div class="a">${fmt(total)}</div></div>`:''}</div>`; }
  else if(!(errors&&errors.length)&&!(notes&&notes.length)) h+=`<div class="empty">${L('Make your selections to see the breakdown.','เลือกข้อมูลเพื่อแสดงรายละเอียดการคำนวณ')}</div>`;
  h+=`<div class="notes">${(errors||[]).map(e=>note('err',e)).join('')}${(warnings||[]).map(e=>note('warn',e)).join('')}${(notes||[]).map(e=>note('info',e)).join('')}</div>`;

function inspS(){ return S.na.insp?{acts:[],E:0,gov:null,op:0,warnings:[],applicant:S.insp.applicant}:inspData(); }
function inspData(){
  const I=S.insp, warnings=[]; let E=0, maxP=0;
  const acts=I.acts.map((a,i)=>({a,i,r:calcActivity(a)}));
  acts.forEach(x=>{ maxP=Math.max(maxP,x.r.persons);
    if(x.r.error){ warnings.push(`${L('Inspection','การตรวจสอบ')} ${x.i+1}: ${x.r.error}${endS()}`); return; }
    if(x.r.flag) warnings.push(L(`Inspection ${x.i+1}: a trip of 12 hours or less counts as 0 days under Appendix A note 3. Refer for confirmation.`,`การตรวจสอบ ${x.i+1}: การเดินทางไม่เกิน 12 ชั่วโมงนับเป็น 0 วันตามหมายเหตุ 3 ภาคผนวก ก กรุณาส่งพิจารณายืนยัน`));
    E+=x.r.amount; });
  const gov = I.applicant==='GOV' ? calcGov(I.gov,maxP) : null;
  if(gov&&gov.overTen) warnings.push(L('Government vehicle flat rate covers up to 10 staff only.','อัตราเหมาจ่ายค่ายานพาหนะครอบคลุมเจ้าหน้าที่ไม่เกิน 10 คน'));
  const op = I.applicant==='COM' ? (toNum(I.opTravel)||0)+(toNum(I.opHotel)||0) : 0;
  return {acts,E,gov,op,warnings,applicant:I.applicant};
}
function buildSummary(){
  const cert=calcCertificate(S.types,S.tx), ins=inspS();
  const fees=cert.total!=null?cert.total:0;
  const chg=CHS().reduce((s,c)=>s+c.total,0);
  const gov=ins.gov?ins.gov.total:0;
  const caat=fees+chg+ins.E+gov, commit=caat+ins.op;
  const st=[cert.status,...CHS().map(c=>c.status)];
  if(ins.acts.length||ins.op) st.push('ESTIMATED');
  const status = cert.total==null ? (st.includes('VERIFICATION_REQUIRED')?'VERIFICATION_REQUIRED':'INCOMPLETE')
    : st.includes('VERIFICATION_REQUIRED')?'VERIFICATION_REQUIRED' : st.includes('ESTIMATED')?'ESTIMATED':'CALCULATED';
  const points=[];
  if(!S.operator) points.push(L('No air operator selected.','ยังไม่ได้เลือกผู้ดำเนินการเดินอากาศ'));
  points.push(...(cert.errors||[]),...(cert.warnings||[]),...(cert.notes||[]));
  CHS().forEach(c=>(c.warnings||[]).concat(c.notes||[]).forEach(n=>points.push(`${c.title}: ${n}`)));
  points.push(...ins.warnings);
  if(ins.acts.length) points.push(L('Inspection expenses are payable within 7 days of CAAT’s notice (ระเบียบ 5/1 ข้อ 10).','ผู้ขอต้องชำระค่าใช้จ่ายในการตรวจสอบภายใน 7 วันนับแต่วันที่ได้รับแจ้งจาก กพท. (ระเบียบ 5/1 ข้อ 10)'));
  return {cert,ins,fees,chg,gov,caat,commit,status,points:[...new Set(points)]};
}
function typeRows(c){
  return S.types.map((t,i)=>{
    const l=(c.lines||[]).find(x=>x.typeIdx===i);
    const m=toNum(t.mtow);
    const cls=t.cat==='BALLOON'?'—':(m?`${fmt(m)} ${L('kg','กก.')}`:(weightLabels(t.cat)[t.heavy?1:0]));
    const ac=acById(t.ac);
    const full=(t.models&&t.models.length>1)?t.models.map(id=>(acById(id)||{n:id}).n).join(' + '):(ac?ac.n:'');
    return {i, name:(t.name||'').trim()||L(`Type ${i+1}`,`แบบที่ ${i+1}`), full, cat:CATNAME()[t.cat], cls, area:areaL(t.area)||'', line:l, count:t.count};
  });
}
/* Fee composition blocks for Simple mode (screen and print). */
function compBlocks(s){
  const c=s.cert, B=[];
  if(c.total!=null){
    const pl=c.lines.find(l=>l.kind==='P'), cl=c.lines.find(l=>l.kind==='C'), al=c.lines.filter(l=>l.kind==='A');
    const pr=typeRows(c).find(r=>r.line&&r.line.kind==='C');
    B.push({k:'P',color:'#9fb3c8',title:L('Application fee','ค่าธรรมเนียมการยื่นคำขอ'),amount:pl.amount,sub:`${catL(c.category)} · ${txL(S.tx)}`,ref:pl.ref});
    B.push({k:'C',color:'#2a9d8f',title:L('Main certificate fee','ค่าใบรับรองผู้ดำเนินการเดินอากาศ'),amount:cl.amount,sub:`${pr?pr.name:''} · ${areaL(c.principalArea)}`,ref:cl.ref});
    if(al.length){
      const names=typeRows(c).filter(r=>r.line&&r.line.kind==='A').map(r=>`${r.name} (${r.area}) ${fmt(r.line.amount)}`).join(' · ');
      B.push({k:'A',color:'#2563a8',title:L(`Additional aircraft types · ${al.length}`,`ค่าเพิ่มแบบอากาศยาน · ${al.length} แบบ`),amount:c.sumA,sub:names,ref:`ประกาศ กพท. 2561 ข้อ 3(1)(${SEC[c.category]})3) · ${S.tx==='renewal'?'การต่ออายุ':'การออกครั้งแรก'}`});
    }
  }
  CHS().forEach(x=>B.push({k:'X',color:'#5f8f6f',title:x.title,amount:x.total,sub:x.lines[0]?x.lines[0].basis:'',ref:x.lines[0]?x.lines[0].ref:''}));
  if(s.ins.acts.length) B.push({k:'E',color:'#6c9bd2',title:L('Inspection expenses (Section 5/1)','ค่าใช้จ่ายในการตรวจสอบ (มาตรา 5/1)'),amount:s.ins.E,
    sub:s.ins.acts.filter(x=>!x.r.error).map(x=>`${KIND_L(x.a.kind)}${x.a.kind==='OVERSEAS'?' '+countryName(x.a.country):''}: ${x.r.days}×${x.r.persons}×${fmt(x.r.rate)}`).join(' · '),
    ref:'ระเบียบ กพท. ว่าด้วยค่าใช้จ่ายตามมาตรา 5/1 (ฉบับที่ 5) 2565 ข้อ 5, ภาคผนวก ก'});
  if(s.gov) B.push({k:'G',color:'#8aa4c4',title:L('Government flat rates','อัตราเหมาจ่ายหน่วยงานของรัฐ'),amount:s.gov,sub:L(`Accommodation ${fmt(s.ins.gov.acc)} · air ${fmt(s.ins.gov.air)} · vehicle ${fmt(s.ins.gov.veh)}`,`ที่พัก ${fmt(s.ins.gov.acc)} · บัตรโดยสาร ${fmt(s.ins.gov.air)} · ยานพาหนะ ${fmt(s.ins.gov.veh)}`),ref:'ระเบียบ 5/1 ข้อ 9, ภาคผนวก จ'});
  if(s.ins.op) B.push({k:'O',color:'#b8c5d6',direct:true,title:L('Operator-provided travel and hotel','ค่าพาหนะและที่พักที่ผู้ขอจัดหาเอง'),amount:s.ins.op,sub:L('Paid directly by the operator, not to CAAT','ผู้ขอชำระเองโดยตรง มิได้ชำระให้ กพท.'),ref:'ระเบียบ 5/1 ข้อ 7–8, ภาคผนวก ค–ง'});
  return B;
}

/* ---------- Calendar (.ics): application deadline and expiry, with reminders. Dates only, no amounts. ---------- */
function icsEsc(t){ return String(t).replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\r?\n/g,'\\n'); }
function icsFold(line){
  const enc=new TextEncoder(); if(enc.encode(line).length<=74) return line;
  const out=[]; let cur='', n=0;
  for(const ch of Array.from(line)){ const b=enc.encode(ch).length; if(n+b>(out.length?73:74)){ out.push(cur); cur=''; n=0; } cur+=ch; n+=b; }
  out.push(cur); return out.join('\r\n ');
}
function icsEvents(op){
  const exp=opExpiry(op); if(!exp || (OPINFO[op]||{}).app) return [];
  const i=OPINFO[op]||{}, name=opName(op), aoc=i.aoc?` (${i.aoc})`:'', slug=op.toLowerCase().replace(/[^a-z0-9]+/g,'-').slice(0,40), due=addDays(exp,-150);
  return [
    {uid:`aoc-apply-${slug}-${exp}@caat-ops-ct`,date:due,
     title:L(`AOC renewal application due · ${name}${aoc}`,`ครบกำหนดยื่นคำขอต่ออายุใบรับรอง · ${name}${aoc}`),
     desc:L(`Last day to apply for AOC renewal (150 days before expiry on ${dfmt(exp,true)}).`,`วันสุดท้ายของการยื่นคำขอต่ออายุใบรับรอง (ไม่น้อยกว่า 150 วันก่อนวันหมดอายุ ${dfmt(exp,true)})`),
     alarms:[30,7,1]},
    {uid:`aoc-expiry-${slug}-${exp}@caat-ops-ct`,date:exp,
     title:L(`AOC expires · ${name}${aoc}`,`ใบรับรองหมดอายุ · ${name}${aoc}`),
     desc:L(`AOC valid until ${dfmt(exp,true)}. A new AOC can be issued from ${dfmt(addDays(exp,-45),true)}.`,`ใบรับรองใช้ได้ถึง ${dfmt(exp,true)} ออกฉบับใหม่ได้ตั้งแต่ ${dfmt(addDays(exp,-45),true)}`),
     alarms:[45]}];
}
function icsText(evs){
  const stamp=new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d+Z$/,'Z'), L2=[];
  L2.push('BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//CAAT OPS CT//AOC Fee Calculator//EN','CALSCALE:GREGORIAN','METHOD:PUBLISH','X-WR-CALNAME:'+icsEsc(L('AOC renewals','การต่ออายุใบรับรอง')));
  evs.forEach(e=>{
    L2.push('BEGIN:VEVENT','UID:'+e.uid,'DTSTAMP:'+stamp,'DTSTART;VALUE=DATE:'+e.date.replace(/-/g,''),'DTEND;VALUE=DATE:'+addDays(e.date,1).replace(/-/g,''),
      'SUMMARY:'+icsEsc(e.title),'DESCRIPTION:'+icsEsc(e.desc),'TRANSP:TRANSPARENT');
    e.alarms.forEach(d=>L2.push('BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+icsEsc(e.title),`TRIGGER:-P${d-1}DT15H`,'END:VALARM'));   // 09:00, d days before
    L2.push('END:VEVENT');
  });
  L2.push('END:VCALENDAR');
  return L2.map(icsFold).join('\r\n')+'\r\n';
}
function saveIcs(evs,name){
  const t0=localISO(); evs=evs.filter(e=>e.date>=t0);
  if(!evs.length){ toast(L('No upcoming dates to add','ไม่มีกำหนดการที่จะถึงให้เพิ่ม')); return; }
  const url=URL.createObjectURL(new Blob([icsText(evs)],{type:'text/calendar;charset=utf-8'}));
  const a=document.createElement('a'); a.href=url; a.download=name+'.ics'; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),4000);
  toast(L(`Calendar file ready: ${evs.length} event${evs.length>1?'s':''}`,`ไฟล์ปฏิทินพร้อมแล้ว ${evs.length} รายการ`));
}
function icsOne(op){ saveIcs(icsEvents(op),'aoc-deadlines-'+op.toLowerCase().replace(/[^a-z0-9]+/g,'-').slice(0,40)); }

/* ---------- Saved edits: each operator's entries are kept on this device ---------- */
const EDIT_KEY='aoc.opEdits';
function dataSig(op){ const t=JSON.stringify([FLEET[op]||null,OPINFO[op]||null]); let h=0; for(let k=0;k<t.length;k++){ h=(h*31+t.charCodeAt(k))|0; } return (h>>>0).toString(36); }
let persistT=null;
function persistSoon(){ clearTimeout(persistT); persistT=setTimeout(persistNow,400); }
/* Saving merges with what is already stored: only operators touched in this tab are written or removed,
   so a second open copy of the app cannot overwrite another copy's edits. */
const touched=new Set();
function readStore(){ let d=null; try{ d=JSON.parse(load(EDIT_KEY)||'null'); }catch(e){} return (d&&d.v===1&&d.ops&&typeof d.ops==='object')?d:{v:1,cur:'',ops:{}}; }
function persistNow(){
  clearTimeout(persistT);
  try{
    if(S.operator) touched.add(S.operator);
    const d=readStore();
    touched.forEach(op=>{
      const snap = op===S.operator ? (hasEdits()?snapOp():null) : (S.opCache[op]||null);
      if(snap) d.ops[op]={snap,sig:dataSig(op)}; else delete d.ops[op];
    });
    d.cur=S.operator||'';
    store(EDIT_KEY,JSON.stringify(d));
  }catch(e){}
}
/* Saved data is checked before use; anything malformed is dropped rather than loaded. */
function cleanSnap(op,s){
  if(!s||typeof s!=='object'||!Array.isArray(s.types)||!s.types.length) return null;
  const okT=t=>t&&typeof t==='object'&&typeof t.id==='string'&&['AEROPLANE','HELICOPTER','BALLOON'].includes(t.cat);
  if(!s.types.every(okT)) return null;
  const i=OPINFO[op]||{}, d=clone(OP_DEF);
  const out={types:s.types,
    expiry:(typeof s.expiry==='string'&&/^(\d{4}-\d{2}-\d{2})?$/.test(s.expiry))?s.expiry:(i.until||''),
    expiryAuto:!!s.expiryAuto, tx:s.tx==='initial'?'initial':'renewal', txAuto:!!s.txAuto,
    changesAdded:Array.isArray(s.changesAdded)?s.changesAdded.filter(x=>x&&typeof x==='object'&&typeof x.mode==='string'&&x.p&&typeof x.p==='object'):[],
    change:(s.change&&typeof s.change==='object')?Object.assign(d.change,s.change):d.change,
    insp:(s.insp&&typeof s.insp==='object'&&Array.isArray(s.insp.acts))?Object.assign(d.insp,s.insp,{gov:Object.assign(d.insp.gov,(s.insp.gov&&typeof s.insp.gov==='object')?s.insp.gov:{})}):d.insp,
    na:{change:!!(s.na&&s.na.change),insp:!!(s.na&&s.na.insp)},
    loadedSig:typeof s.loadedSig==='string'?s.loadedSig:null, fleetFrom:typeof s.fleetFrom==='string'?s.fleetFrom:null};
  return out;
}
function restoreEdits(){
  const d=readStore(), all=OPERATORS.concat(S.customOps);
  let max=0;
  Object.entries(d.ops).forEach(([op,o])=>{ if(!all.includes(op)||!o) return; const snap=cleanSnap(op,o.snap); if(!snap) return;
    S.opCache[op]=snap; if(o.sig!==dataSig(op)) S.staleOps[op]=true;
    snap.types.forEach(t=>{ const m=/^t(\d+)$/.exec(t.id); if(m) max=Math.max(max,+m[1]); });
    snap.insp.acts.forEach(a=>{ const m=/^t(\d+)$/.exec((a&&a.id)||''); if(m) max=Math.max(max,+m[1]); }); });
  uid=Math.max(uid,max);
  if(d.cur && all.includes(d.cur)){
    if(S.opCache[d.cur]){ S.operator=d.cur; Object.assign(S,clone(S.opCache[d.cur])); }
    else switchOperator(d.cur);
  }
}
function resetOp(op){
  touched.add(op); delete S.opCache[op]; delete S.staleOps[op];
  if(op===S.operator){ freshOp(op); }
  persistNow();
}
function savedOps(){ const c=Object.keys(S.opCache); if(S.operator && !c.includes(S.operator) && opEdited(S.operator)) c.push(S.operator); return c.sort((a,b)=>opName(a).localeCompare(opName(b))); }

const PDF_LIB='https://cdn.jsdelivr.net/npm/html2pdf.js@0.10.2/dist/html2pdf.bundle.min.js';
let pdfLibP=null;
function loadPdfLib(){
  if(window.html2pdf) return Promise.resolve();
  if(!pdfLibP) pdfLibP=new Promise((res,rej)=>{ const sc=document.createElement('script'); sc.src=PDF_LIB; sc.async=true;
    sc.onload=()=>window.html2pdf?res():rej(new Error('lib')); sc.onerror=()=>{ pdfLibP=null; sc.remove(); rej(new Error('net')); }; document.head.appendChild(sc); });
  return pdfLibP;
}
/* html2canvas only wraps at spaces, so long Thai runs were drawn on one line. Mark Thai word boundaries with
   zero-width spaces (Intl.Segmenter) so the captured lines match the browser layout. */
function pdfSource(){
  const host=document.createElement('div'); host.className='rp-x'; host.innerHTML=reportHTML();
  let seg=null; try{ seg=new Intl.Segmenter('th',{granularity:'word'}); }catch(e){}
  if(seg){
    const w=document.createTreeWalker(host,NodeFilter.SHOW_TEXT), nodes=[]; while(w.nextNode()) nodes.push(w.currentNode);
    nodes.forEach(n=>{ if(/[\u0E00-\u0E7F]/.test(n.nodeValue)) n.nodeValue=Array.from(seg.segment(n.nodeValue),x=>x.segment).join('\u200B'); });
  }
  return host;
}
async function makePdf(){
  await loadPdfLib();
  try{ if(document.fonts&&document.fonts.ready) await document.fonts.ready; }catch(e){}
  const y=window.scrollY; window.scrollTo(0,0);
  try{ return await window.html2pdf().set({
    margin:[12,13,14,13], filename:fileStem()+'.pdf',
    image:{type:'jpeg',quality:0.96},
    html2canvas:{scale:2,backgroundColor:'#ffffff',logging:false,scrollX:0,scrollY:0},
    jsPDF:{unit:'mm',format:'a4',orientation:'portrait',compress:true},
    pagebreak:{mode:['css','legacy'],avoid:['tr','.rp-blk','.rp-sign','.rp-tot','.rp-kpis','.rp-s h3','.rp-h','li']}
  }).from(pdfSource(),'element').outputPdf('blob'); }
  finally{ window.scrollTo(0,y); }
}

  const d=new Date(), stamp=`${localISO()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
  const ua=String(navigator.userAgent||''), dev=(/iPhone|iPad/.test(ua)?'iOS':/Android/.test(ua)?'Android':/Windows/.test(ua)?'Windows':/Mac/.test(ua)?'Mac':'Other')+' / '+(/Edg\//.test(ua)?'Edge':/Chrome\//.test(ua)?'Chrome':/Firefox\//.test(ua)?'Firefox':/Safari\//.test(ua)?'Safari':'Other');

  const body=[L('Please describe the error (what you did, what you expected, what you saw):','โปรดระบุข้อผิดพลาด (สิ่งที่ทำ ผลที่คาดหวัง และผลที่ปรากฏ):'),'','','',
    '--- App details ---',

    `Language: ${LANG}`,`Date: ${stamp}`,`Device: ${dev}`].join('\r\n');

}

  S.tests.push({id:'AC-03',desc:'Fleet list: every operator and aircraft code is known',expected:[],got:badFleet,pass:badFleet.length===0});
  S.tests.push({id:'AC-02',desc:'Aircraft list: no duplicate designators',expected:[],got:dupAc,pass:dupAc.length===0});
  { const tgOp='Thai Airways International Public Company Limited';
    const due=addDays('2027-05-07',-150);
    S.tests.push({id:'PL-01',desc:'Pipeline: application deadline = expiry − 150 days',expected:'2026-12-08',got:due,pass:due==='2026-12-08'});
    const fee=calcCertificate(fleetCards(tgOp),'renewal',RULESET).total;
    S.tests.push({id:'PL-02',desc:'Pipeline: Thai Airways renewal from the Ops Spec list',expected:22105000,got:fee,pass:fee===22105000});
    const txt=icsText([{uid:'x@y',date:'2027-01-02',title:'ครบกำหนดยื่นคำขอต่ออายุใบรับรอง · บริษัท การบินไทย จำกัด (มหาชน) (AOC.0003), test; a\\b',desc:'d',alarms:[30]}]);
    const enc=new TextEncoder(), long=txt.split('\r\n').filter(l=>enc.encode(l).length>75);
    const okIcs=long.length===0 && txt.includes('DTSTART;VALUE=DATE:20270102') && txt.includes('DTEND;VALUE=DATE:20270103') && txt.includes('TRIGGER:-P29DT15H') && txt.includes('\\;') && txt.endsWith('END:VCALENDAR\r\n');
    S.tests.push({id:'PL-03',desc:'Calendar file: dates, reminders, escaping and line folding',expected:true,got:okIcs,pass:okIcs}); }

  restoreEdits();

  try{ if('serviceWorker' in navigator) navigator.serviceWorker.getRegistrations().then(rs=>rs.forEach(r=>{ const w=r.active||r.waiting||r.installing; if(w&&/aoc-sw\.js/.test(w.scriptURL)) r.unregister(); })).catch(()=>{}); }catch(e){}
  document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='hidden') persistNow(); });
  window.addEventListener('pagehide',persistNow);
  renderAll();
}
init();
</script>
