  if(a.mg) h+=`<span class="mg">${L('Merged from your list','รวมจากรายการเดิม')}: ${esc(a.mg)}</span>`;
  h+=`</div>${a.m && String(toNum(t.mtow))!==String(a.m)?`<button type="button" class="btn btn-s" data-act="useRef" data-id="${t.id}">${L(`Use ${fmt(a.m)} kg`,`ใช้ ${fmt(a.m)} กก.`)}</button>`:''}</div>`;
  if(a.warn) h+=note('warn',LANG==='th'?a.warn.th:a.warn.en);
  return h;
}

function esc(s){ if(s==null) return ''; return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
let uid=0; const nid=()=> 't'+(++uid);
/* ---------- Version (major.minor): change APP_VERSION and APP_DATE, and add an entry to APP_LOG, for every release.
   Minor (1.0 > 1.1) = small change or fix. Major (1.1 > 2.0) = new feature or a rate change. ---------- */
const APP_VERSION='3.87', APP_DATE='2026-11-22';
const APP_LOG=[
  {v:'3.87',d:'2026-11-22',en:['The aeroplanes and helicopters on the globe animations are 20% smaller, with their wing lights, glow and strobe scaled to match.'],th:['เครื่องบินและเฮลิคอปเตอร์ในแอนิเมชันลูกโลกเล็กลง 20% โดยไฟปลายปีก แสงเรือง และไฟสโตรบปรับขนาดตามกัน']},
  {v:'3.86',d:'2026-11-22',en:['The globe animations now show tiny aeroplanes flying along each route, instead of a moving dot. Each jetliner has blinking red and green wing lights, a white strobe, a soft fading light trail in the flight path colour, and grows slightly at the top of its arc. A blue glow and ring appear where it lands. On the helicopter globes a small helicopter flies the route with a spinning rotor, hovers over the helipad while the rotor slows, then lands with the same blue glow. With Reduce Motion on, the globes show a still arc and a landing dot as before.'],
   th:['แอนิเมชันบนลูกโลกแสดงเครื่องบินลำเล็กบินตามเส้นทาง แทนจุดที่เคลื่อนที่ เครื่องบินมีไฟปลายปีกกะพริบสีแดงและเขียว ไฟสโตรบสีขาว และแสงเรืองจางตามหลังในสีเส้นทางบินที่เลือก และขยายใหญ่ขึ้นเล็กน้อยเมื่ออยู่สูงสุดของเส้นโค้ง เมื่อลงจอดจะมีแสงเรืองและวงแหวนสีน้ำเงินที่ปลายทาง บนลูกโลกของเฮลิคอปเตอร์จะมีเฮลิคอปเตอร์ลำเล็กบินตามเส้นทางพร้อมใบพัดหมุน ลอยนิ่งเหนือเฮลิพอร์ตขณะใบพัดค่อยๆ ช้าลง แล้วลงจอดพร้อมแสงเรืองสีน้ำเงินเช่นเดียวกัน เมื่อเปิดลดการเคลื่อนไหว ลูกโลกจะแสดงเส้นโค้งและจุดปลายทางแบบนิ่งเหมือนเดิม']},
  {v:'3.85',d:'2026-11-22',en:['The international globe no longer pauses on a Bangkok-centred view. The India view is now the main view: the replay returns to it between East Asia, Australia and the Middle East, and after being dragged and left alone for 3 seconds the globe glides back to it. Each view now holds 1.5 seconds longer.'],th:['ลูกโลกพื้นที่ปฏิบัติการต่างประเทศไม่หยุดที่มุมมองที่มีกรุงเทพฯ อยู่กลางอีกต่อไป มุมมองอินเดียเป็นมุมมองหลัก โดยจะกลับมาที่มุมมองนี้คั่นระหว่างเอเชียตะวันออก ออสเตรเลียและตะวันออกกลาง และเมื่อถูกลากแล้วปล่อยไว้ 3 วินาที ลูกโลกจะเลื่อนกลับมาที่มุมมองนี้ แต่ละมุมมองค้างนานขึ้น 1.5 วินาที']},
  {v:'3.84',d:'2026-11-22',en:['The international globe now opens on the India view (about 26 degrees from Bangkok) and the slow replay starts from there. After being dragged and left alone it still glides back to the Bangkok-centred view.'],th:['ลูกโลกพื้นที่ปฏิบัติการต่างประเทศเริ่มที่มุมมองอินเดีย (ห่างจากกรุงเทพฯ ประมาณ 26 องศา) และเล่นต่อจากจุดนั้น เมื่อถูกลากแล้วปล่อยไว้ ลูกโลกยังคงเลื่อนกลับมาที่มุมมองที่มีกรุงเทพฯ อยู่กลาง']},
  {v:'3.83',d:'2026-11-21',en:['The international globe now glides back to the Bangkok view after 3 seconds of being left alone (was 8 seconds).'],th:['ลูกโลกพื้นที่ปฏิบัติการต่างประเทศจะเลื่อนกลับมาที่มุมมองกรุงเทพฯ เมื่อไม่มีการสัมผัสนาน 3 วินาที (เดิม 8 วินาที)']},
  {v:'3.82',d:'2026-11-21',en:['The Other regions (international) globe no longer spins all the way round. It now sways slowly between views (East Asia, Australia, India and the Middle East), returning to a Bangkok-centred view between each one, so Bangkok stays on the front of the globe as the hub. Drag to look at any angle; if Bangkok is out of view and the globe is left alone for 8 seconds, it glides back to the Bangkok view and the slow replay resumes. With Reduce Motion on, the globe stays still on the Bangkok view.','The glow of the sun and the moon, and the tint they put on the edge of the globe, is about 15% stronger. The edge tint is now cool blue when the moon is showing.'],
   th:['ลูกโลกพื้นที่ปฏิบัติการต่างประเทศไม่หมุนรอบตัวอีกต่อไป แต่แกว่งช้าๆ ผ่านมุมมองเอเชียตะวันออก ออสเตรเลีย อินเดียและตะวันออกกลาง โดยกลับมาที่มุมมองที่มีกรุงเทพฯ อยู่กลางทุกครั้งคั่นระหว่างมุมมอง เพื่อให้กรุงเทพฯ อยู่ด้านหน้าของลูกโลกในฐานะศูนย์กลาง ลากเพื่อดูได้ทุกมุม หากกรุงเทพฯ อยู่นอกมุมมองและไม่มีการสัมผัสลูกโลกนาน 8 วินาที ลูกโลกจะเลื่อนกลับมาที่มุมมองกรุงเทพฯ และเล่นต่อ เมื่อเปิดลดการเคลื่อนไหว ลูกโลกจะหยุดนิ่งที่มุมมองกรุงเทพฯ','แสงเรืองของดวงอาทิตย์และดวงจันทร์ รวมถึงสีที่ส่องต่อขอบลูกโลก เข้มขึ้นประมาณ 15% และเมื่อแสดงดวงจันทร์ สีที่ขอบลูกโลกจะเป็นโทนฟ้าเย็น']},
  {v:'3.81',d:'2026-11-21',en:['New: choose the colour of the flight paths on the globe. A small colour selector sits directly below every globe, and the same choice is in Settings. Colours: white (default), blue, green, orange, yellow, red, purple, cyan and rainbow. It is a small drop-down that shows only the current colour until opened, in both Detailed and Simple view. The choice applies to every globe in the app and is saved on this device.','The Principal / Additional labels on the Certificate and Summary tabs now have a small shine that passes over them every few seconds (Detailed view only; off with Reduce Motion and in Simple view). Tap or click the sun on any globe to turn it into a moon, and tap the moon to bring the sun back. The choice applies to every globe and is saved on this device. The Additional label is now blue.'],
   th:['ใหม่: เลือกสีเส้นทางบินบนลูกโลกได้ มีตัวเลือกขนาดเล็กอยู่ใต้ลูกโลกทุกลูก และมีตัวเลือกเดียวกันในการตั้งค่า สีที่มี: ขาว (ค่าเริ่มต้น) น้ำเงิน เขียว ส้ม เหลือง แดง ม่วง ฟ้า และรุ้ง แสดงเฉพาะสีปัจจุบันจนกว่าจะเปิดรายการ ทั้งในมุมมองแบบละเอียดและแบบย่อ ใช้กับลูกโลกทุกลูกในแอปและบันทึกไว้ในอุปกรณ์นี้','ป้าย “แบบหลัก” และ “แบบเพิ่มเติม” ในหน้าค่าใบรับรองและหน้าสรุปมีแสงวาบเล็กน้อยผ่านทุกไม่กี่วินาที (เฉพาะมุมมองแบบละเอียด ปิดเมื่อเปิดลดการเคลื่อนไหว และในมุมมองแบบย่อ) แตะหรือคลิกดวงอาทิตย์บนลูกโลกเพื่อเปลี่ยนเป็นดวงจันทร์ และแตะดวงจันทร์เพื่อกลับเป็นดวงอาทิตย์ ใช้กับลูกโลกทุกลูกและบันทึกไว้ในอุปกรณ์นี้ ป้าย “เพิ่มเติม” เปลี่ยนเป็นสีน้ำเงิน']},
  {v:'3.80',d:'2026-11-21',en:['New Simple / Detailed view switch at the top of every page and in Settings. Simple keeps the inputs, results and errors, and hides instructions, field hints, notes, line details, step-by-step calculations and animations (the globe stays). Detailed is the default and is the same as before.','The language control at the top is now a small switch, stacked under the view switch, each with a blinking light.','Printed reports, PDFs and shared summaries are not affected by the view.'],
   th:['เพิ่มสวิตช์แบบละเอียด/แบบย่อที่ด้านบนของทุกหน้าและในการตั้งค่า แบบย่อคงช่องกรอก ผลการคำนวณ และข้อผิดพลาดไว้ และซ่อนคำอธิบาย คำแนะนำประกอบช่องกรอก หมายเหตุ รายละเอียดรายการ ขั้นตอนการคำนวณ และภาพเคลื่อนไหว (ยังแสดงลูกโลก) ค่าเริ่มต้นคือแบบละเอียดซึ่งเหมือนเดิม','ตัวเลือกภาษาด้านบนเปลี่ยนเป็นสวิตช์ขนาดเล็กซ้อนใต้สวิตช์มุมมอง แต่ละสวิตช์มีไฟกะพริบ','รายงานที่พิมพ์ ไฟล์ PDF และสรุปที่ส่งต่อไม่ได้รับผลจากมุมมองนี้']},
  {v:'3.79',d:'2026-11-21',en:['Certificate: the Principal / Additional label is now a plain badge. A single soft light sweep crosses it when a card becomes the principal. The airport letter board is removed.','Certificate: when you tap “Make principal” or an edit makes another card the principal, the cards glide to their new places. The fee on a card glows briefly when its amount changes, and a card that becomes a duplicate gives a short shake.','Result card: a ring shows each part of the fee (application, certificate, additional types) with its percentage, and draws itself in when the result first appears.','Renewal timeline: the days-left number sits inside a progress ring that is green, amber or red with the deadline.','Renewal revenue chart: the bars grow in when the chart scrolls into view.','The title bar that appears when you scroll shifts its colour gently with scroll depth.','All motion stops with Reduce Motion and does not appear in print or PDF.'],
   th:['ใบรับรอง: ป้ายแบบหลัก/แบบเพิ่มเติมเป็นป้ายเรียบ มีแสงวาบผ่านหนึ่งครั้งเมื่อการ์ดกลายเป็นแบบหลัก และนำป้ายแสดงเที่ยวบินแบบสนามบินออกแล้ว','ใบรับรอง: เมื่อกด “ตั้งเป็นแบบหลัก” หรือเมื่อการแก้ไขทำให้การ์ดอื่นเป็นแบบหลัก การ์ดจะเลื่อนไปยังตำแหน่งใหม่อย่างนุ่มนวล ค่าธรรมเนียมบนการ์ดจะเรืองแสงสั้น ๆ เมื่อยอดเปลี่ยน และการ์ดที่ซ้ำกันจะสั่นเล็กน้อย','การ์ดผลลัพธ์: เพิ่มวงแหวนแสดงสัดส่วนของค่าธรรมเนียม (ค่ายื่นคำขอ ค่าใบรับรอง ค่าเพิ่มแบบ) พร้อมร้อยละ และวาดขึ้นเมื่อแสดงผลครั้งแรก','กำหนดเวลาการต่ออายุ: ตัวเลขจำนวนวันที่เหลืออยู่ในวงแหวนความคืบหน้า เป็นสีเขียว เหลืองอำพัน หรือแดงตามกำหนดยื่น','กราฟรายได้จากการต่ออายุ: แท่งกราฟเติบโตขึ้นเมื่อเลื่อนมาถึงกราฟ','แถบชื่อหน้าที่ปรากฏเมื่อเลื่อนลง เปลี่ยนโทนสีอย่างนุ่มนวลตามระยะการเลื่อน','การเคลื่อนไหวทั้งหมดหยุดเมื่อเปิดการลดการเคลื่อนไหว และไม่ปรากฏในการพิมพ์หรือ PDF']},
  {v:'3.78',d:'2026-11-21',en:['Certificate: if the same aircraft type is on two cards, both cards turn red and stay red until one is changed. The result stays blocked while the duplicate is there.','Certificate: new “Make principal” button on each additional card. It is available only when that card has the same certificate fee as the principal (a tie), and moves the card, with its type, area, weight class and count, to the top. If the card has a lower fee the button is greyed out, with the rule: ประกาศ กพท. 2561 ข้อ 3(1) 2), the “ทั้งนี้” paragraph (the first type is charged at the highest rate).','Certificate: when you change a card so that another card now has the highest certificate fee, that card moves to the top as the principal automatically, with a short message. If fees are equal, the top card stays.'],
   th:['ใบรับรอง: หากระบุแบบอากาศยานเดียวกันในสองการ์ด ทั้งสองการ์ดจะเป็นสีแดงจนกว่าจะเปลี่ยนแบบหนึ่งการ์ด และระบบจะไม่แสดงผลคำนวณจนกว่าจะแก้ไขรายการซ้ำ','ใบรับรอง: เพิ่มปุ่ม “ตั้งเป็นแบบหลัก” ในการ์ดแบบเพิ่มเติม ใช้ได้เฉพาะการ์ดที่มีค่าใบรับรองเท่ากับแบบหลัก (เท่ากัน) และจะย้ายการ์ดพร้อมแบบ พื้นที่ ช่วงน้ำหนัก และจำนวนไปไว้ด้านบนสุด หากการ์ดมีค่าใบรับรองต่ำกว่า ปุ่มจะเป็นสีเทาพร้อมข้อกำหนด: ประกาศ กพท. 2561 ข้อ 3(1) 2) ข้อความ “ทั้งนี้” (แบบแรกคิดตามอัตราสูงสุด)','ใบรับรอง: เมื่อแก้ไขการ์ดจนทำให้การ์ดอื่นมีค่าใบรับรองสูงสุด การ์ดนั้นจะย้ายขึ้นด้านบนเป็นแบบหลักโดยอัตโนมัติ พร้อมข้อความแจ้ง หากค่าเท่ากัน การ์ดบนสุดยังคงเป็นแบบหลัก']},
  {v:'3.77',d:'2026-11-21',en:['Printing: the app title bar (page name and operator) no longer prints at the top of every report page, where it overlapped a section heading.','Area globe: a drawing error that could appear for a moment during the area animation is fixed.','All Thai numerals are now Arabic numerals throughout the app, including the quoted fee-schedule item and statute references.','Thai mode: the four aircraft source notes (A320, A330, B738, G500) are now in Thai.'],
   th:['การพิมพ์: แถบชื่อหน้าและผู้ดำเนินการเดินอากาศของแอปไม่พิมพ์ซ้ำที่ส่วนบนของทุกหน้ารายงานอีกต่อไป ซึ่งเดิมทับหัวข้อส่วนต่าง ๆ','ลูกโลกแสดงพื้นที่ปฏิบัติการ: แก้ข้อผิดพลาดการวาดภาพที่อาจเกิดขึ้นชั่วขณะระหว่างภาพเคลื่อนไหว','เปลี่ยนเลขไทยเป็นเลขอารบิกทั้งแอป รวมถึงข้อความอ้างอิงรายการท้ายพระราชบัญญัติและมาตราที่ยกมา','โหมดภาษาไทย: หมายเหตุแหล่งที่มาของแบบอากาศยาน 4 รายการ (A320, A330, B738, G500) แสดงเป็นภาษาไทยแล้ว']},
  {v:'3.76',d:'2026-11-21',en:['Renewal status fixes. A renewed AOC now always uses the new expiry date from the renewal list, including on devices where the operator was opened before; an expiry date typed earlier than the new expiry is treated as out of date. This stops a renewed AOC from being counted twice in revenue.','Renewal list entries are checked: an unknown operator, a date not in YYYY-MM-DD form, a new expiry not after the renewal date, or a fee that is not a number makes the entry ignored, so it cannot remove an AOC from revenue by mistake.','An AOC with Application received or Under certification is shown as applied, with its expiry countdown, and is no longer counted in Deadline passed, Due within 30 days or Due within 90 days, or in the Next 90 days view.','A renewed AOC reads “Renewed (date) · next expiry (date)”. In the industry report, renewed AOCs are listed in their own group after the schedule and are not added to the schedule total.'],
   th:['แก้ไขสถานะการต่ออายุ ใบรับรองที่ต่ออายุแล้วใช้วันหมดอายุใหม่จากรายการต่ออายุเสมอ รวมถึงในอุปกรณ์ที่เคยเปิดข้อมูลผู้ดำเนินการรายนั้นไว้แล้ว และวันหมดอายุที่กรอกไว้ก่อนวันหมดอายุใหม่ถือว่าล้าสมัย จึงไม่นับรายได้ของใบรับรองฉบับเดียวกันซ้ำ','ตรวจสอบรายการต่ออายุ หากชื่อผู้ดำเนินการไม่ตรงกับทะเบียน วันที่ไม่อยู่ในรูปแบบ YYYY-MM-DD วันหมดอายุใหม่ไม่อยู่หลังวันที่ต่ออายุ หรือค่าธรรมเนียมไม่เป็นตัวเลข ระบบจะไม่นำรายการนั้นมาใช้ เพื่อป้องกันมิให้รายได้ของใบรับรองหายไปโดยไม่ตั้งใจ','ใบรับรองที่มีสถานะรับคำขอแล้วหรืออยู่ระหว่างการรับรอง แสดงเป็นยื่นคำขอแล้ว พร้อมจำนวนวันก่อนหมดอายุ และไม่นับรวมในพ้นกำหนดยื่น ภายใน 30 วัน ภายใน 90 วัน หรือมุมมองภายใน 90 วัน','ใบรับรองที่ต่ออายุแล้วแสดงเป็น “ต่ออายุแล้ว (วันที่) · หมดอายุครั้งถัดไป (วันที่)” ในรายงานภาพรวมอุตสาหกรรม ใบรับรองที่ต่ออายุแล้วแยกเป็นกลุ่มต่อท้ายกำหนดการ และไม่รวมในยอดรวมของกำหนดการ']},
  {v:'3.75',d:'2026-11-21',en:['Pipeline: renewal status. Each AOC can now show Application received, Under certification or Renewed (with the renewal date and the new expiry). The statuses are kept in a built-in list in this file (RENEWALS) and are updated by the CT head only; users see them but cannot change them. The list is empty until the first status is entered, so nothing changes yet.','Expected renewal revenue and the Surveillance Coverage Projection now show Realised (renewed AOCs, counted in the year they were renewed, at the actual invoiced fee when entered, otherwise at the estimate) and Expected (open AOCs, counted in the year they expire). The total of the two feeds the coverage projection, and the realised part is shown on its own. A renewed AOC leaves the “to collect” list, its countdown follows the new expiry, and its next cycle is added to Expected when the new expiry falls inside the 5-year window.'],
   th:['ท่อต่ออายุ (Pipeline): เพิ่มสถานะการต่ออายุ ใบรับรองแต่ละฉบับแสดงได้ว่า รับคำขอแล้ว อยู่ระหว่างการรับรอง หรือ ต่ออายุแล้ว (พร้อมวันที่ต่ออายุและวันหมดอายุใหม่) สถานะเก็บไว้ในรายการภายในไฟล์นี้ (RENEWALS) และปรับปรุงโดยหัวหน้ากอง CT เท่านั้น ผู้ใช้งานดูได้แต่แก้ไขไม่ได้ รายการยังว่างอยู่จนกว่าจะบันทึกสถานะแรก จึงยังไม่มีอะไรเปลี่ยนแปลง','ประมาณการรายได้จากการต่ออายุและประมาณการความครอบคลุมงบประมาณการกำกับดูแล แสดงรายได้จริง (ใบรับรองที่ต่ออายุแล้ว นับในปีที่ต่ออายุ ใช้ค่าธรรมเนียมที่เรียกเก็บจริงเมื่อบันทึกไว้ มิฉะนั้นใช้ประมาณการ) และรายได้ที่คาดว่าจะได้ (ใบรับรองที่ยังไม่ต่ออายุ นับในปีที่หมดอายุ) ยอดรวมของทั้งสองส่วนใช้คำนวณความครอบคลุม และแสดงส่วนรายได้จริงแยกไว้ ใบรับรองที่ต่ออายุแล้วจะออกจากรายการ “รอเรียกเก็บ” การนับถอยหลังเปลี่ยนไปตามวันหมดอายุใหม่ และรอบถัดไปจะรวมในรายได้ที่คาดว่าจะได้เมื่อวันหมดอายุใหม่อยู่ในช่วง 5 ปี']},
  {v:'3.74',d:'2026-11-21',en:['Reports: the aeroplane on the cover page no longer covers text. Cover text (office, title, operator, AOC number, request type, date, footer) now sits above the aeroplane, and report content in general sits above the “ESTIMATE – NOT AN INVOICE” watermark, in the printout, PDF and preview, for the Summary and Industry reports.'],th:['รายงาน: รูปเครื่องบินบนหน้าปกไม่บังข้อความอีกต่อไป ข้อความบนหน้าปก (หน่วยงาน ชื่อรายงาน ผู้ดำเนินการ เลขที่ใบรับรอง ประเภทคำขอ วันที่ และท้ายหน้า) อยู่เหนือรูปเครื่องบิน และเนื้อหารายงานทั้งหมดอยู่เหนือลายน้ำ “ประมาณการ – มิใช่ใบแจ้งหนี้” ทั้งในรายงานที่พิมพ์ ไฟล์ PDF และตัวอย่างก่อนพิมพ์ ทั้งรายงานสรุปและรายงานภาพรวมอุตสาหกรรม']},
  {v:'3.73',d:'2026-11-21',en:['Settings › Certificate (password protected): new Statutory maximum setting for the ฿20,000,000 per certificate in fee schedule item (28/1). 1 main certificate fee only (default, as before), 2 cap the total of all AOC fee lines, shown as an adjustment line, 3 show both amounts for FAD. The detailed calculation, Summary, reports and CSV follow the option. To be confirmed by LEG.'],th:['ตั้งค่า › ค่าใบรับรอง (ต้องใช้รหัสผ่าน): เพิ่มการตั้งค่าอัตราขั้นสูง 20,000,000 บาทต่อฉบับ ตามอัตราค่าธรรมเนียม (28/1) ได้แก่ 1 เฉพาะค่าใบรับรองหลัก (ค่าเริ่มต้น เหมือนเดิม) 2 จำกัดยอดรวมค่าธรรมเนียมทุกรายการ โดยแสดงเป็นรายการปรับลด 3 แสดงทั้งสองจำนวนเพื่อให้ FAD พิจารณา รายละเอียดการคำนวณ หน้าสรุป รายงาน และไฟล์ CSV เป็นไปตามตัวเลือกที่เลือก ต้องได้รับการยืนยันจาก LEG']},
  {v:'3.72',d:'2026-11-21',en:['Certificate, Changes and Inspection: a “See Detailed Calculation” link at the bottom right of the result card unfolds every step of the calculation, one by one: how each type is classified, the area, the principal type, each rate with its formula and exact numbers, the legal reference (Ministerial Regulation, CAAT fee Announcement, Section 5/1 Regulation), the statutory maximum check and the final sum. Collapsed by default; built from the live result, so it always matches the figures on screen.'],
   th:['ใบรับรอง การเปลี่ยนแปลง และการตรวจสอบ: เพิ่มลิงก์ “ดูรายละเอียดการคำนวณ” ที่มุมขวาล่างของการ์ดผลลัพธ์ เมื่อกดจะแสดงขั้นตอนการคำนวณทีละขั้น ได้แก่ การจัดประเภทอากาศยาน พื้นที่ปฏิบัติการ แบบอากาศยานหลัก อัตราแต่ละรายการพร้อมสูตรและตัวเลข ข้อกฎหมายที่อ้างอิง (กฎกระทรวง ประกาศ กพท. ระเบียบ 5/1) การตรวจสอบอัตราขั้นสูง และผลรวม ซ่อนไว้เป็นค่าเริ่มต้น และสร้างจากผลการคำนวณจริงจึงตรงกับตัวเลขบนหน้าจอเสมอ']},
  {v:'3.71',d:'2026-11-21',en:['Globes: a small soft sun now sits in the sky behind the Earth, in the upper-right corner. It glows and breathes gently, and puts a faint warm edge on the sun-facing side of the Earth. It stays still with Reduce Motion, and is hidden when the globe fills the picture (Domestic).'],
   th:['ลูกโลก: เพิ่มดวงอาทิตย์ดวงเล็กนุ่มนวลอยู่ด้านหลังโลก ที่มุมขวาบน เรืองแสงและกะพริบเบาๆ พร้อมขอบสีอุ่นจางๆ ด้านที่หันเข้าหาดวงอาทิตย์ จะหยุดนิ่งเมื่อเปิดลดการเคลื่อนไหว และจะถูกบังเมื่อโลกเต็มภาพ (ในประเทศ)']},
  {v:'3.70',d:'2026-11-21',en:['Certificate: the Principal / Additional departure board now sits beside the A/C Type title again, in a more compact size. The board always shows the English words (PRINCIPAL, ADDITIONAL), also in Thai mode. On very narrow screens it drops to its own line under the title.'],
   th:['ใบรับรอง: ป้ายกระดานเที่ยวบิน Principal / Additional กลับมาอยู่ข้างชื่อแบบอากาศยาน ในขนาดที่เล็กลง ป้ายแสดงเป็นคำภาษาอังกฤษ (PRINCIPAL, ADDITIONAL) เสมอ รวมถึงในโหมดภาษาไทย บนหน้าจอที่แคบมากป้ายจะย้ายลงไปอยู่บรรทัดใต้ชื่อ']},
  {v:'3.69',d:'2026-11-21',en:['Certificate: the Principal / Additional label in each A/C Type header is now a small departure-board panel with a status light. A letter or two flips now and then so it stays alive; it pauses off-screen, and stays still with Reduce Motion, in print and in PDFs.','Certificate: additional A/C Type headers use a deeper slate blue, so they no longer look faded next to the principal type.'],
   th:['ใบรับรอง: ป้าย แบบหลัก / แบบเพิ่มเติม ที่แถบหัวของแบบอากาศยานแต่ละแบบ เปลี่ยนเป็นแผงป้ายแบบกระดานเที่ยวบินขนาดเล็กพร้อมไฟสถานะ ตัวอักษรจะพลิกเป็นระยะ หยุดเมื่ออยู่นอกหน้าจอ และไม่เคลื่อนไหวเมื่อเปิดลดการเคลื่อนไหว เมื่อพิมพ์ และในไฟล์ PDF','ใบรับรอง: แถบหัวของแบบอากาศยานเพิ่มเติมใช้สีน้ำเงินอมเทาเข้มขึ้น ไม่ดูซีดเมื่อเทียบกับแบบหลัก']},
  {v:'3.68',d:'2026-11-21',en:['Certificate: each A/C Type header shows an icon for the selected category (aeroplane, helicopter or balloon), with soft radar rings rippling out from it. The helicopter rotors spin. The icon changes when you change the Category.'],
   th:['ใบรับรอง: แถบหัวของแบบอากาศยานแต่ละแบบแสดงไอคอนตามประเภทที่เลือก (เครื่องบิน เฮลิคอปเตอร์ หรือบัลลูน) พร้อมวงคลื่นเรดาร์กระจายออกเบา ๆ ใบพัดเฮลิคอปเตอร์หมุน และไอคอนเปลี่ยนตามประเภทที่เลือก']},
  {v:'3.67',d:'2026-11-21',en:['Thai Airways: the A330 now loads as A330-300 (A333) by default instead of asking for a manual selection. Same area (Asia) and the same fee.'],
   th:['การบินไทย: แบบ A330 โหลดเป็น A330-300 (A333) โดยอัตโนมัติ แทนการให้เลือกเอง พื้นที่ปฏิบัติการ (เอเชีย) และค่าธรรมเนียมเท่าเดิม']},
  {v:'3.66',d:'2026-11-21',en:[
    'Look and feel: frosted glass menu bars, with a slim glass title bar on the phone once you scroll past the header. Night mode (Settings > General: Light, Night or Auto, which turns on from 19:00 to 06:00); boarding passes, globes and tail fins keep their colours. The selected tab is a pill that glides between tabs, and each tab icon makes a small move. When a total changes, a chip shows the amount up or down. Switches spring, segmented buttons have a sliding thumb, and buttons press in.'],
   th:[
    'รูปลักษณ์: แถบเมนูแบบกระจกฝ้า และบนโทรศัพท์มีแถบชื่อหน้าแบบกระจกเมื่อเลื่อนผ่านส่วนหัว โหมดกลางคืน (ตั้งค่า > ทั่วไป: สว่าง กลางคืน หรืออัตโนมัติ ซึ่งเปิดระหว่าง 19.00–06.00 น.) โดยบัตรโดยสาร ลูกโลก และแพนหางคงสีเดิม แท็บที่เลือกเป็นแถบเลื่อนไปมาระหว่างแท็บ และไอคอนแต่ละแท็บมีการเคลื่อนไหวเล็กน้อย เมื่อยอดรวมเปลี่ยน จะแสดงป้ายจำนวนที่เพิ่มขึ้นหรือลดลง สวิตช์มีการเด้ง ปุ่มแบ่งส่วนมีตัวเลื่อน และปุ่มมีลักษณะกดลง']},
  {v:'3.65',d:'2026-11-21',en:[
    'Globes: Domestic and Asia now have animated white flight arcs too (10 domestic airports; 13 Asian cities). Other regions is trimmed from 21 to 17 destinations. Short routes bow upward so they read as arcs when zoomed in. Helicopter globes: Domestic shows 6 typical helicopter routes (Hua Hin, U-Tapao, Gulf of Thailand offshore, Songkhla, Phuket, Chiang Mai); International keeps its 5 neighbouring-country routes. All routes are illustrative.'],
   th:[
    'ลูกโลก: พื้นที่ภายในประเทศและเอเชียแสดงเส้นโค้งเส้นทางบินสีขาวพร้อมภาพเคลื่อนไหวเช่นเดียวกัน (ท่าอากาศยานภายในประเทศ 10 แห่ง เมืองในเอเชีย 13 แห่ง) ภูมิภาคอื่นลดจาก 21 เหลือ 17 จุดหมาย เส้นทางระยะสั้นโค้งขึ้นเพื่อให้เห็นเป็นเส้นโค้งเมื่อขยายภาพ ลูกโลกเฮลิคอปเตอร์: ภายในประเทศแสดงเส้นทางเฮลิคอปเตอร์ทั่วไป 6 เส้นทาง (หัวหิน อู่ตะเภา แท่นขุดเจาะอ่าวไทย สงขลา ภูเก็ต เชียงใหม่) ต่างประเทศคงเส้นทางไปยังประเทศเพื่อนบ้าน 5 เส้นทาง เส้นทางทั้งหมดเพื่อประกอบภาพเท่านั้น']},
  {v:'3.64',d:'2026-11-21',en:[
    'Certificate: the plane in the renewal timeline header now flies forward, left to right.',
    'Settings: Balloons, Certificate and Changes settings sit together under one password (the Surveillance Coverage Projection password). One unlock opens all three.',
    'Mixed AOCs with aeroplanes and helicopters show a small tail fin and a small helicopter together wherever the operator icon appears.',
    'Industry: Industry profile and Expected renewal revenue can be folded. Industry profile is open by default; Expected renewal revenue is closed by default.',
    'Boarding passes: the decorative barcodes are removed. Each pass shows the operator name once, in full.'],
   th:[
    'ใบรับรอง: เครื่องบินในแถบหัวของกำหนดเวลาการต่ออายุบินไปข้างหน้าจากซ้ายไปขวา',
    'ตั้งค่า: การตั้งค่าบัลลูน ค่าใบรับรอง และการเปลี่ยนแปลง อยู่ภายใต้รหัสผ่านเดียวกัน (รหัสผ่านของการประมาณการความครอบคลุมงบประมาณการตรวจติดตาม) ปลดล็อกครั้งเดียวเปิดได้ทั้งสามส่วน',
    'ใบรับรองประเภทผสมที่มีทั้งเครื่องบินและเฮลิคอปเตอร์ แสดงไอคอนแพนหางและเฮลิคอปเตอร์ขนาดย่อร่วมกันในทุกจุดที่แสดงไอคอนผู้ดำเนินการ',
    'อุตสาหกรรม: ส่วนข้อมูลภาพรวมอุตสาหกรรมและประมาณการรายได้จากการต่ออายุย่อและขยายได้ ข้อมูลภาพรวมอุตสาหกรรมเปิดไว้เป็นค่าเริ่มต้น ประมาณการรายได้จากการต่ออายุปิดไว้เป็นค่าเริ่มต้น',
    'บัตรโดยสาร: นำบาร์โค้ดตกแต่งออก และแสดงชื่อผู้ดำเนินการเพียงครั้งเดียวเป็นชื่อเต็ม']},
  {v:'3.63',d:'2026-11-20',en:[
    'Globes: the Other regions (International) globe now shows 21 destinations spread across every continent. White arcs rise from Bangkok to each one, drawing in turn with a travelling light and a pulse on arrival. The helicopter International globe animates its arcs the same way. Reduced-motion shows the arcs still.'],
   th:[
    'ลูกโลก: ลูกโลกพื้นที่ปฏิบัติการต่างประเทศ (Other regions) แสดงจุดหมายปลายทาง 21 แห่งกระจายทั่วทุกทวีป เส้นโค้งสีขาวพุ่งจากกรุงเทพฯ ไปยังแต่ละแห่งทีละเส้น พร้อมแสงเคลื่อนที่และวงคลื่นเมื่อถึงปลายทาง ลูกโลกเฮลิคอปเตอร์ต่างประเทศแสดงเส้นโค้งแบบเดียวกัน หากผู้ใช้ตั้งค่าลดการเคลื่อนไหว จะแสดงเส้นโค้งแบบนิ่ง']},
  {v:'3.62',d:'2026-11-20',en:[
    'Industry: filter by aeroplane or helicopter operators (KPIs, profile, list and the Industry report). A View menu offers boarding passes, compact rows or a new icon view; tapping an icon prints its pass in place. On each pass the plane sits at the point reached between the start of the AOC and the application deadline, flies there when the pass opens, and the dots run toward RENEWAL. Calendar and Open are smaller and sit on the stub. Apply-by dates are dark red.',
    'Summary: the AOC fees table can be filtered by aeroplane or helicopter types; totals still include every type. The principal type has a light tinted background on screen and in the report.',
    'Certificate: each aircraft card has a full-width header; the principal card has a light tint. The renewal timeline is redesigned with a countdown, a moving timeline and colour-coded milestones. A Preview PDF button sits beside Summary and report.',
    'Changes: Expand the area shows one globe that moves from the current area to the expanded area.',
    'Globes: the background is lightest blue for Domestic, mid blue for Asia and darkest for Other regions, with a few twinkling stars and shooting stars.',
    'Settings: balloons can be turned on or off (off greys them out everywhere). The Certificate and Changes settings need the same password as the Surveillance Coverage Projection. The rule set and self-test result now appear only in Settings. Settings moved after Rates; on wide screens the menu stays at the top.',
    'Rates: each table has its own colour and tint. Thai Cargo Airlines (applicant): B737-800, Asia. The report cover no longer shows the tail fin.'],
   th:[
    'อุตสาหกรรม: กรองตามผู้ดำเนินการเครื่องบินหรือเฮลิคอปเตอร์ได้ (ตัวชี้วัด ภาพรวม รายการ และรายงานอุตสาหกรรม) มีเมนูมุมมองให้เลือกบัตรโดยสาร แถวแบบย่อ หรือมุมมองไอคอนใหม่ เมื่อแตะไอคอนจะพิมพ์บัตรของรายนั้น บนบัตรแต่ละใบ เครื่องบินจะอยู่ตามช่วงเวลาที่ผ่านไประหว่างวันเริ่มต้นของใบรับรองถึงกำหนดยื่นคำขอ และจุดจะเคลื่อนไปทางการต่ออายุ ปุ่มปฏิทินและเปิดมีขนาดเล็กลงและอยู่ด้านขวาของบัตร วันที่กำหนดยื่นเป็นสีแดงเข้ม',
    'สรุป: ตารางค่าธรรมเนียมใบรับรองกรองตามแบบเครื่องบินหรือเฮลิคอปเตอร์ได้ โดยยอดรวมยังรวมทุกแบบ แบบหลักมีพื้นหลังสีอ่อนทั้งบนหน้าจอและในรายงาน',
    'ใบรับรอง: การ์ดแบบอากาศยานแต่ละแบบมีแถบหัวเต็มความกว้าง การ์ดแบบหลักมีพื้นหลังสีอ่อน ปรับโฉมกำหนดเวลาการต่ออายุ มีการนับถอยหลัง เส้นเวลาเคลื่อนไหว และหมุดหมายแยกสี เพิ่มปุ่มดูตัวอย่าง PDF ข้างปุ่มสรุปและรายงาน',
    'การเปลี่ยนแปลง: การเพิ่มพื้นที่ปฏิบัติการแสดงลูกโลกเดียวที่เคลื่อนจากพื้นที่ปัจจุบันไปยังพื้นที่ที่ขอเพิ่ม',
    'ลูกโลก: พื้นหลังเป็นสีฟ้าอ่อนที่สุดสำหรับภายในประเทศ สีฟ้ากลางสำหรับภูมิภาคเอเชีย และเข้มที่สุดสำหรับภูมิภาคอื่น พร้อมดาวระยิบระยับและดาวตก',
    'ตั้งค่า: เปิดหรือปิดบัลลูนได้ (เมื่อปิด ตัวเลือกบัลลูนทั้งหมดจะเป็นสีเทา) การตั้งค่าค่าใบรับรองและการเปลี่ยนแปลงต้องใช้รหัสผ่านเดียวกับประมาณการความครอบคลุมงบประมาณการกำกับดูแล ชุดอัตราและผลการทดสอบระบบแสดงเฉพาะในหน้าตั้งค่า ย้ายตั้งค่าไปไว้หลังอัตรา บนหน้าจอกว้างเมนูจะอยู่ด้านบนตลอด',
    'อัตรา: แต่ละตารางมีสีและพื้นหลังของตนเอง บริษัท ไทย คาร์โก แอร์ไลน์ จำกัด (ผู้ยื่นคำขอ): B737-800 ภูมิภาคเอเชีย หน้าปกรายงานไม่แสดงแพนหางแล้ว']},
  {v:'3.61',d:'2026-11-20',en:['Helicopter operators: an AOC with helicopters only now shows a side-view helicopter in the operator colours, in place of the airline tail fin. On screen its main and tail rotors turn and it hovers gently. The motion stops when the device Reduce motion setting is on and never appears in printouts or PDFs.'],th:['ผู้ดำเนินการเฮลิคอปเตอร์: ใบรับรองที่มีเฉพาะเฮลิคอปเตอร์จะแสดงภาพเฮลิคอปเตอร์ด้านข้างในสีของผู้ดำเนินการ แทนแพนหางเครื่องบิน บนหน้าจอใบพัดหลักและใบพัดท้ายจะหมุนและลอยตัวเบา ๆ การเคลื่อนไหวจะหยุดเมื่อเปิดการตั้งค่าลดการเคลื่อนไหวของอุปกรณ์ และไม่ปรากฏในเอกสารพิมพ์หรือไฟล์ PDF']},
  {v:'3.60',d:'2026-11-20',en:['Industry list: rows start expanded. An Expand all / Collapse all button sits above the list; expanding prints the passes on screen one after another.'],th:['รายการอุตสาหกรรม: แถวเปิดไว้เป็นค่าเริ่มต้น มีปุ่มขยายทั้งหมด/ย่อทั้งหมดอยู่เหนือรายการ เมื่อขยาย บัตรที่อยู่บนหน้าจอจะพิมพ์ออกมาทีละใบ']},
  {v:'3.59',d:'2026-11-20',en:['Industry list: each collapsed row also shows the AOC No., apply-by date and expiry date. The fee sits beside the operator name. The strip folds away when the row is opened, as the pass shows the same details.'],th:['รายการอุตสาหกรรม: แถวที่ย่อไว้แสดงเลขที่ใบรับรอง กำหนดยื่น และวันหมดอายุเพิ่มเติม ค่าธรรมเนียมอยู่ข้างชื่อผู้ดำเนินการ เมื่อเปิดแถว ส่วนข้อมูลนี้จะย่อหายไปเนื่องจากบัตรแสดงข้อมูลเดียวกัน']},
  {v:'3.58',d:'2026-11-20',en:['Industry list: all rows start collapsed. The boarding-pass printout is smoother and faster (about 1.3 seconds).'],th:['รายการอุตสาหกรรม: ทุกแถวย่อไว้เป็นค่าเริ่มต้น การพิมพ์บัตรโดยสารลื่นไหลและเร็วขึ้น (ประมาณ 1.3 วินาที)']},
  {v:'3.57',d:'2026-11-20',en:['Industry list: each AOC is now one compact row (urgency bar, tail fin, operator, status, estimated fee and apply-by date). Tap a row to print out its boarding pass, fed out slowly like a laser printer: AOC number, aircraft types, apply-by date, expiry with days left, new-AOC date, calendar and open buttons, with the fee and status on the stub. The countdown ring and runway bar are removed, so each fact appears once.'],th:['รายการอุตสาหกรรม: ใบรับรองแต่ละฉบับแสดงเป็นแถวกระชับหนึ่งแถว (แถบความเร่งด่วน แพนหาง ผู้ดำเนินการ สถานะ ค่าต่ออายุโดยประมาณ และกำหนดยื่น) แตะแถวเพื่อพิมพ์บัตรโดยสาร ซึ่งเลื่อนออกมาช้า ๆ เหมือนเครื่องพิมพ์เลเซอร์ แสดงเลขที่ใบรับรอง จำนวนแบบอากาศยาน กำหนดยื่น วันหมดอายุพร้อมจำนวนวันที่เหลือ วันที่ออกใบรับรองใหม่ได้ ปุ่มปฏิทินและปุ่มเปิด โดยมีค่าธรรมเนียมและสถานะอยู่บนต้นขั้ว แถวที่ครบกำหนดภายใน 30 วันหรือพ้นกำหนดแล้วจะเปิดไว้ตั้งแต่ต้น ยกเลิกวงแหวนนับถอยหลังและแถบทางวิ่ง เพื่อให้ข้อมูลแต่ละรายการแสดงเพียงครั้งเดียว']},
  {v:'3.56',d:'2026-11-20',en:['Area of Operation picker: the flat map is replaced by a 3D globe centred on Thailand. Domestic zooms in and lights up Thailand; Asia pulls back and shades the Asian region; Other regions shows the whole globe turning slowly with routes from Bangkok; helicopter International shows routes to nearby countries. Changing the area flies the globe to the new view. Drag to turn the globe. The map is built in, so it works offline. Map shading is illustrative; the approved area is the one in the Ops Specs.'],th:['ตัวเลือกพื้นที่ปฏิบัติการ: เปลี่ยนแผนที่แบบเรียบเป็นลูกโลกสามมิติที่มีประเทศไทยอยู่กึ่งกลาง ภายในประเทศจะซูมเข้าและเน้นประเทศไทย ภูมิภาคเอเชียจะซูมออกและแรเงาภูมิภาคเอเชีย ภูมิภาคอื่นแสดงลูกโลกทั้งใบหมุนช้า ๆ พร้อมเส้นทางบินจากกรุงเทพฯ ส่วนเฮลิคอปเตอร์ภูมิภาคต่างประเทศแสดงเส้นทางไปยังประเทศใกล้เคียง เมื่อเปลี่ยนพื้นที่ ลูกโลกจะหมุนไปยังมุมมองใหม่ และลากเพื่อหมุนลูกโลกได้ แผนที่ฝังอยู่ในระบบจึงใช้งานได้แบบออฟไลน์ การแรเงาบนแผนที่เพื่อประกอบเท่านั้น พื้นที่ที่ได้รับอนุมัติเป็นไปตาม Ops Specs']},
  {v:'3.55',d:'2026-11-20',en:['Motion: the operator tail fin turns in and its colour stripe sweeps across when an operator is selected; the Summary pass prints out with its barcode; the fee-mix bar fills part by part with amounts counting up; the dates on the pass flip in like a departure board; Industry rings fill row by row, rows due within 30 days pulse in amber and overdue rings have a red rim; runway lights replace the spinner while the PDF is built and flash green when it is ready.','Each effect runs once, switches off when the device Reduce motion setting is on, and never appears in printouts or PDFs.'],th:['การเคลื่อนไหว: แพนหางของผู้ดำเนินการหมุนเข้าและแถบสีเลื่อนผ่านเมื่อเลือกผู้ดำเนินการ บัตรสรุปเลื่อนออกมาเหมือนพิมพ์พร้อมบาร์โค้ด แถบองค์ประกอบค่าธรรมเนียมเติมทีละส่วนพร้อมตัวเลขนับขึ้น วันที่บนบัตรพลิกเข้าเหมือนป้ายตารางเที่ยวบิน วงแหวนในหน้าอุตสาหกรรมเติมทีละรายการ รายการที่ครบกำหนดภายใน 30 วันกะพริบสีเหลืองอำพัน และรายการที่พ้นกำหนดมีขอบสีแดง ไฟทางวิ่งแทนสัญลักษณ์รอระหว่างจัดทำ PDF และกะพริบสีเขียวเมื่อพร้อม','แต่ละเอฟเฟกต์แสดงครั้งเดียว ปิดอัตโนมัติเมื่อเปิดการตั้งค่าลดการเคลื่อนไหวของอุปกรณ์ และไม่ปรากฏในเอกสารที่พิมพ์หรือไฟล์ PDF']},
  {v:'3.54',d:'2026-11-20',en:['Operator colours: each airline gets a shaded tail-fin badge in its own brand colours (Thai Airways, Bangkok Airways, Nok Air, Thai AirAsia, Thai AirAsia X, Thai Lion Air, Thai VietJet, SFS Aviation; others use the app steel blue). When an operator is selected, its colours are added as accents (operator bar, Summary, result cards and the report); the main theme stays.','Summary is leaner: one header pass holds the operator, AOC, expiry, apply-by date with days left, new-AOC date, status and total, with a fee-mix bar. The separate header card, the row of total cards and the Renewal timeline card are removed.'],th:['สีผู้ดำเนินการ: สายการบินแต่ละรายมีสัญลักษณ์แพนหางในสีของตราสินค้า (การบินไทย บางกอกแอร์เวย์ส นกแอร์ ไทยแอร์เอเชีย ไทยแอร์เอเชีย เอ็กซ์ ไทยไลอ้อนแอร์ ไทยเวียตเจ็ท และ SFS Aviation ส่วนรายอื่นใช้สีน้ำเงินเทาของระบบ) เมื่อเลือกผู้ดำเนินการ ระบบใช้สีดังกล่าวเป็นสีเสริม (แถบผู้ดำเนินการ หน้าสรุป การ์ดผลลัพธ์ และรายงาน) โดยคงสีหลักของระบบไว้','หน้าสรุปกระชับขึ้น: บัตรส่วนหัวเดียวแสดงผู้ดำเนินการ ใบรับรอง วันหมดอายุ กำหนดยื่นพร้อมจำนวนวันที่เหลือ วันที่ออกใบรับรองใหม่ได้ สถานะ และยอดรวม พร้อมแถบองค์ประกอบค่าธรรมเนียม ยกเลิกการ์ดส่วนหัวแยก แถวการ์ดยอดรวม และการ์ดกำหนดเวลาการต่ออายุ']},
  {v:'3.53',d:'2026-11-20',en:['Look and feel: boarding-pass card on the Summary; runway countdown on each Industry row; rolling-digit totals; map arcs above the area pickers; fleet wall of aircraft silhouettes in the Industry profile; header sky that follows the time of day; an ADDED stamp and Summary tab pulse when a change is added; optional report cover page (Settings › Summary report, on by default).'],th:['รูปลักษณ์: บัตรขึ้นเครื่องในหน้าสรุป แถบรันเวย์นับถอยหลังในแต่ละรายการของหน้าอุตสาหกรรม ตัวเลขยอดรวมแบบหมุน แผนที่เส้นทางเหนือตัวเลือกพื้นที่ปฏิบัติการ ภาพเงาอากาศยานในข้อมูลภาพรวมอุตสาหกรรม ส่วนหัวที่เปลี่ยนสีตามช่วงเวลาของวัน ตราประทับ “เพิ่มแล้ว” และแท็บสรุปกระพริบเมื่อเพิ่มรายการ และหน้าปกรายงาน (ตั้งค่า › รายงานสรุป ค่าเริ่มต้นเปิด)']},
  {v:'3.52',d:'2026-11-20',en:['Industry: the expiry date on each row reads “Expires by: DD Mmm YYYY” in bold.'],th:['หน้าอุตสาหกรรม: วันหมดอายุในแต่ละรายการแสดงเป็น “หมดอายุ: วัน เดือน ปี” ตัวหนา']},
  {v:'3.51',d:'2026-11-20',en:['Industry: each date badge now has the title “Apply by” (the renewal application deadline, 150 days before expiry).'],th:['หน้าอุตสาหกรรม: ป้ายวันที่แต่ละรายการมีหัวข้อ “กำหนดยื่น” (กำหนดยื่นคำขอต่ออายุ 150 วันก่อนวันหมดอายุ)']},
  {v:'3.50',d:'2026-11-20',en:['Industry profile counts only currently active AOCs (no applications, no expired AOCs). A small line at the end shows AOC Applications in Progress.'],th:['ข้อมูลภาพรวมอุตสาหกรรมนับเฉพาะใบรับรองที่มีผลใช้บังคับ (ไม่รวมคำขอและใบรับรองที่หมดอายุ) และแสดงจำนวนคำขอใบรับรองที่อยู่ระหว่างดำเนินการไว้ท้ายส่วน']},
  {v:'3.49',d:'2026-11-20',en:['Settings › Version history: the change log is collapsed by default. Tap “Change log” to open it.'],th:['ตั้งค่า › ประวัติเวอร์ชัน: บันทึกการเปลี่ยนแปลงย่อไว้เป็นค่าเริ่มต้น แตะ “บันทึกการเปลี่ยนแปลง” เพื่อเปิด']},
  {v:'3.48',d:'2026-11-20',en:['QR code and app link removed from all reports.','AOC Summary printout, PDF and email draft are now ready to send to the operator: no rule set, app version, status, internal warnings, Points to verify or FAD/EMPIC process wording. The footer says the amount payable is the amount on CAAT’s invoice. The Summary screen still shows Points to verify for the POI. The Industry report stays internal and is marked Internal use only.'],th:['ลบรหัส QR และลิงก์ระบบออกจากรายงานทั้งหมด','รายงานสรุปรายใบรับรองที่พิมพ์ ไฟล์ PDF และร่างอีเมล พร้อมส่งให้ผู้ดำเนินการ: ไม่มีชุดอัตรา เวอร์ชันระบบ สถานะ คำเตือนภายใน ประเด็นที่ต้องตรวจสอบยืนยัน หรือข้อความขั้นตอน FAD/EMPIC ท้ายเอกสารระบุว่าจำนวนเงินที่ต้องชำระเป็นไปตามใบแจ้งหนี้ของ กพท. หน้าสรุปบนจอยังแสดงประเด็นที่ต้องตรวจสอบยืนยันสำหรับ POI รายงานภาพรวมอุตสาหกรรมยังเป็นเอกสารภายในและระบุว่าใช้ภายในเท่านั้น']},
  {v:'3.47',d:'2026-11-20',en:['Pre-deployment QC fixes: Send summary to LINE no longer also takes the app page itself to LINE. The QR code in the footer of a sent or downloaded PDF printed as a solid square; it is now a real QR code. Removed a small mark that could appear at the foot of a PDF page before a section heading. The Industry profile counts only AOCs with aircraft types, so a manually added operator without types does not change the totals.'],th:['แก้ไขจากการตรวจสอบก่อนเผยแพร่: ปุ่มส่งสรุปทาง LINE ไม่พาหน้าแอปไปที่ LINE ด้วย รหัส QR ท้ายไฟล์ PDF ที่ส่งหรือดาวน์โหลดเคยแสดงเป็นสี่เหลี่ยมทึบ ตอนนี้แสดงเป็นรหัส QR ที่ถูกต้อง ลบเครื่องหมายเล็กที่อาจปรากฏท้ายหน้า PDF ก่อนหัวข้อ ข้อมูลภาพรวมอุตสาหกรรมนับเฉพาะใบรับรองที่มีแบบอากาศยาน ผู้ดำเนินการที่เพิ่มเองโดยไม่มีแบบจึงไม่กระทบยอดรวม']},
  {v:'3.46',d:'2026-11-20',en:['Aircraft types now show common names first (B737-800, A320-200, B777-300, A330-XXX where the series is not known), with the ICAO designator in small grey type after it, for example B737-800 (B738). Applies to the Certificate page, Changes, Summary, Industry and the reports. Saved operators are renamed automatically.'],th:['แบบอากาศยานแสดงชื่อที่ใช้ทั่วไปก่อน (B737-800, A320-200, B777-300 และ A330-XXX หากไม่ทราบรุ่นย่อย) ตามด้วยรหัส ICAO ตัวเล็กสีเทา เช่น B737-800 (B738) ในหน้าค่าใบรับรอง การเปลี่ยนแปลง สรุป อุตสาหกรรม และรายงาน ข้อมูลผู้ดำเนินการที่บันทึกไว้จะเปลี่ยนชื่อให้อัตโนมัติ']},
  {v:'3.45',d:'2026-11-20',en:['Industry: new Industry profile on the page and in the report: aeroplane, helicopter and mixed AOC counts, AOCs by widest area, large and small aircraft, aircraft type entries by area, distinct type designators, types per AOC, most common types, and average, median and highest renewal fee. The LINE and email summary includes the AOC and type counts.'],th:['หน้าอุตสาหกรรม: เพิ่มข้อมูลภาพรวมอุตสาหกรรมในหน้าและในรายงาน ได้แก่ จำนวนใบรับรองเครื่องบิน เฮลิคอปเตอร์ และประเภทผสม ใบรับรองตามพื้นที่กว้างที่สุด อากาศยานขนาดใหญ่และขนาดเล็ก จำนวนแบบอากาศยานตามพื้นที่ รหัสแบบไม่ซ้ำ จำนวนแบบต่อใบรับรอง แบบที่พบมากที่สุด และค่าต่ออายุเฉลี่ย มัธยฐาน และสูงสุด สรุปทาง LINE และอีเมลรวมจำนวนใบรับรองและแบบอากาศยาน']},
  {v:'3.44',d:'2026-11-20',en:['Pipeline is renamed Industry.','Industry: Send PDF, Preview and Print buttons. The report lists every air operator in one A4 document: deadline counts and fee totals, the renewal schedule by application deadline grouped by expiry year, expected fees by year, applications without an expiry date, and notes with references.','Send: new Send summary to LINE button, and the PDF can be sent with Mail, LINE or another app from the share sheet.'],th:['เปลี่ยนชื่อหน้า “ต่ออายุ” (Pipeline) เป็น “อุตสาหกรรม” (Industry)','หน้าอุตสาหกรรม: เพิ่มปุ่มส่งรายงาน PDF ดูตัวอย่าง และพิมพ์ รายงานรวมผู้ดำเนินการเดินอากาศทุกรายในเอกสาร A4 ฉบับเดียว ได้แก่ จำนวนตามกำหนดยื่นและยอดค่าธรรมเนียม กำหนดการต่ออายุเรียงตามกำหนดยื่นและจัดกลุ่มตามปีที่หมดอายุ ประมาณการรายปี คำขอที่ไม่มีวันหมดอายุ และหมายเหตุพร้อมบทบัญญัติ','การส่งรายงาน: เพิ่มปุ่มส่งสรุปทาง LINE และส่งไฟล์ PDF ทาง Mail, LINE หรือแอปอื่นได้จากเมนูแชร์']},
  {v:'3.43',d:'2026-11-20',en:['QC fixes: Remaining validity ignores an impossible date instead of showing 0 months. If the aircraft type chosen on Expand the area is deleted from the Certificate page, the next type starts from its own area. A Count from date, typed months, a chosen type or a manually picked area on the Changes page are now saved with the operator after reopening the app.'],th:['แก้ไขจากการตรวจสอบคุณภาพ: อายุใบรับรองคงเหลือไม่คำนวณจากวันที่ที่ไม่มีอยู่จริง แทนการแสดง 0 เดือน หากลบแบบอากาศยานที่เลือกในหน้าเพิ่มพื้นที่ปฏิบัติการออกจากหน้าค่าใบรับรอง แบบถัดไปจะเริ่มจากพื้นที่ของแบบนั้นเอง วันที่เริ่มนับ จำนวนเดือนที่กรอกเอง แบบอากาศยานที่เลือก หรือพื้นที่ที่เลือกเองในหน้าการเปลี่ยนแปลง จะถูกบันทึกกับผู้ดำเนินการเมื่อเปิดแอปอีกครั้ง']},
  {v:'3.42',d:'2026-11-20',en:['Changes and Inspection are now Applicable by default, so they are included in the Summary. Each can still be marked N/A for one operator. N/A flags saved by earlier versions (the old default) are cleared.','Settings › Summary report: switches to include or leave out First issue, Renewal, Changes and Inspection in the Summary page, printed report, PDF, CSV and shared summary. A section left out is not counted in the totals, and the Summary page names it.'],th:['หน้าการเปลี่ยนแปลงและหน้าการตรวจสอบตั้งเป็นเกี่ยวข้องเป็นค่าเริ่มต้นแล้ว จึงรวมอยู่ในรายงานสรุป และยังระบุว่าไม่เกี่ยวข้อง (N/A) เป็นรายผู้ดำเนินการได้ ค่า N/A ที่บันทึกจากเวอร์ชันก่อน (ค่าเริ่มต้นเดิม) ถูกล้างออก','ตั้งค่า › รายงานสรุป: เพิ่มสวิตช์เลือกรวมหรือไม่รวม การออกครั้งแรก การต่ออายุ การเปลี่ยนแปลง และการตรวจสอบ ในหน้าสรุป รายงานที่พิมพ์ PDF CSV และสรุปที่ส่งต่อ ส่วนที่ไม่รวมจะไม่นับในยอดรวม และหน้าสรุปจะระบุไว้']},
  {v:'3.41',d:'2026-11-20',en:['Settings › Notifications: the FAD and LEG recheck notes, the acknowledgement popup when the app opens, and the acknowledgement before print, PDF, send, copy or CSV are now off by default. Turn any of them on in Settings. Reset app turns them off again.'],th:['ตั้งค่า › การแจ้งเตือน: หมายเหตุให้ตรวจสอบกับ FAD และ LEG หน้าต่างรับทราบเมื่อเปิดแอป และหน้าต่างรับทราบก่อนพิมพ์ ดาวน์โหลด PDF ส่ง คัดลอก หรือส่งออก CSV ปิดเป็นค่าเริ่มต้นแล้ว เปิดได้ที่หน้าตั้งค่า และการรีเซ็ตแอปจะปิดอีกครั้ง']},
  {v:'3.40',d:'2026-11-20',en:['Settings › Notifications: switches to turn off the FAD and LEG recheck notes on results, the acknowledgement popup when the app opens, and the acknowledgement before print, PDF, send, copy or CSV. All on by default and saved on this device. Printed reports and PDFs always keep the estimate-only line.'],th:['ตั้งค่า › การแจ้งเตือน: เพิ่มสวิตช์ปิดหมายเหตุให้ตรวจสอบกับ FAD และ LEG ในผลการคำนวณ หน้าต่างรับทราบเมื่อเปิดแอป และหน้าต่างรับทราบก่อนพิมพ์ ดาวน์โหลด PDF ส่ง คัดลอก หรือส่งออก CSV ค่าเริ่มต้นเปิดทั้งหมดและบันทึกในอุปกรณ์นี้ รายงานที่พิมพ์และไฟล์ PDF ยังคงมีข้อความว่าเป็นการประมาณการเสมอ']},
  {v:'3.39',d:'2026-11-20',en:['Changes › Expand the area: choose the aircraft type being expanded, from the types on the Certificate page (or Other). The current area, category and weight class come from that type, so an AOC with types in different areas (for example Thai Airways A320 in Asia) can now be calculated.','Settings › Changes: new Area expansion fee basis: 1 rule word for word (default, item 2 difference), 2 charge what actually goes up (main fee or extra-type fee), 3 show both amounts for FAD.','Removed the note that one expansion is charged per AOC, which item 5 does not say.'],th:['การเปลี่ยนแปลง › เพิ่มพื้นที่ปฏิบัติการ: เลือกแบบอากาศยานที่ขอเพิ่มพื้นที่จากแบบในหน้าค่าใบรับรอง (หรืออื่น ๆ) พื้นที่ปัจจุบัน ประเภท และช่วงน้ำหนักใช้ตามแบบที่เลือก ใบรับรองที่มีแบบอากาศยานต่างพื้นที่กัน (เช่น A320 ของการบินไทยในภูมิภาคเอเชีย) จึงคำนวณได้แล้ว','ตั้งค่า › การเปลี่ยนแปลง: เพิ่มหลักการคิดค่าเพิ่มพื้นที่ปฏิบัติการ 1 คิดตามตัวอักษร (ค่าเริ่มต้น ส่วนต่างตามข้อ 2) 2 คิดเฉพาะส่วนที่เพิ่มขึ้นจริง 3 แสดงทั้งสองจำนวนให้ FAD พิจารณา','ลบหมายเหตุว่าคิดการเพิ่มพื้นที่ครั้งเดียวต่อใบรับรอง ซึ่งข้อ 5) มิได้กำหนดไว้']},
  {v:'3.38',d:'2026-11-20',en:['Changes: Current area now comes from the selected AOC, as the widest area of its aircraft types on the Certificate page (for example K-Mile Air: Asia), instead of always Domestic. Category and weight class follow the AOC too, the expanded area starts at the next wider area, and New type, same area starts at the current area. They follow any edit to the types until a value is picked on the Changes page, with a button to switch back. An AOC already at the widest area shows a note.'],th:['การเปลี่ยนแปลง: พื้นที่ปัจจุบันใช้ตามใบรับรองที่เลือก โดยใช้พื้นที่กว้างที่สุดของแบบอากาศยานในหน้าค่าใบรับรอง (เช่น เค-ไมล์ แอร์: ภูมิภาคเอเชีย) แทนการตั้งเป็นภายในประเทศทุกครั้ง ประเภทและช่วงน้ำหนักใช้ตามใบรับรองเช่นกัน พื้นที่ที่ขอเพิ่มเริ่มที่พื้นที่ถัดไป และการเพิ่มแบบอากาศยานพื้นที่เดิมเริ่มที่พื้นที่ปัจจุบัน ค่าดังกล่าวเปลี่ยนตามการแก้ไขแบบอากาศยานจนกว่าจะเลือกเองในหน้าการเปลี่ยนแปลง และมีปุ่มกลับไปใช้ค่าตามใบรับรอง ใบรับรองที่ครอบคลุมพื้นที่กว้างที่สุดแล้วจะแสดงหมายเหตุ']},
  {v:'3.37',d:'2026-11-19',en:['Changes: new Count from date above Remaining validity, for example the change approval date. Remaining validity is counted from that date to the AOC expiry; blank means today, and Use today clears it. Prorated results show the date used.'],th:['การเปลี่ยนแปลง: เพิ่มช่องนับตั้งแต่วันที่ เหนืออายุใบรับรองคงเหลือ เช่น วันที่อนุมัติการเปลี่ยนแปลง ระบบจะนับอายุคงเหลือตั้งแต่วันที่ดังกล่าวถึงวันหมดอายุของใบรับรอง หากไม่ระบุจะใช้วันนี้ และปุ่มใช้วันนี้จะล้างค่าที่ระบุ ผลการคำนวณตามสัดส่วนระบุวันที่ที่ใช้']},
  {v:'3.36',d:'2026-11-19',en:['Changes: Remaining validity is now filled from the selected AOC\'s expiry date (today to expiry) every time an AOC is selected or its expiry date changes, instead of a fixed 24 months. A note under the field shows the months and days left. A typed value is kept for that operator, with a Use AOC expiry button to switch back.','Settings: new part-month rule under Changes: round up (default, highest fee for CAAT), round down, nearest month or exact. Prorated results show the rule used.','Settings are grouped under headings: General, Certificate, Changes, and Data and app information.'],th:['การเปลี่ยนแปลง: อายุใบรับรองคงเหลือคำนวณจากวันหมดอายุของใบรับรองที่เลือก (วันนี้ถึงวันหมดอายุ) ทุกครั้งที่เลือกใบรับรองหรือแก้ไขวันหมดอายุ แทนค่าคงที่ 24 เดือน และแสดงจำนวนเดือนและวันคงเหลือใต้ช่อง หากกรอกเอง ระบบจะคงค่าที่กรอกสำหรับผู้ดำเนินการรายนั้น และมีปุ่มใช้ตามวันหมดอายุเพื่อกลับไปคำนวณอัตโนมัติ','ตั้งค่า: เพิ่มวิธีนับเศษเดือนในหมวดการเปลี่ยนแปลง ได้แก่ ปัดขึ้น (ค่าเริ่มต้น ค่าธรรมเนียมสูงสุด) ปัดลง ปัดตามหลักทั่วไป และคิดตามจริง ผลการคำนวณตามสัดส่วนระบุวิธีที่ใช้','จัดกลุ่มหน้าตั้งค่าเป็นหมวด: ทั่วไป ค่าใบรับรอง การเปลี่ยนแปลง และข้อมูลและรายละเอียดระบบ']},
  {v:'3.35',d:'2026-11-16',en:['20 million cap: now checked against the main certificate fee only, as item (28/1) of the fee schedule to the Air Navigation Act caps the certificate fee per certificate. The application and additional-type fees come from the 2561 CAAT Announcement and are not counted. Thai Airways (฿22,105,000) no longer shows the warning.'],th:['อัตราขั้นสูง 20 ล้านบาท: ตรวจสอบเฉพาะค่าใบรับรองหลัก ตามอัตราค่าธรรมเนียม (28/1) ท้ายพระราชบัญญัติการเดินอากาศ ซึ่งกำหนดค่าใบรับรองต่อฉบับ ค่าธรรมเนียมการยื่นคำขอและค่าเพิ่มแบบอากาศยานกำหนดตามประกาศ กพท. พ.ศ. 2561 จึงไม่นำมารวม การบินไทย (22,105,000 บาท) จึงไม่แสดงคำเตือนอีกต่อไป']},
  {v:'3.34',d:'2026-11-16',en:['Bangkok Airways: the A319/A320 group is now listed first, so it is the principal type and the ATR 72 is the additional type. The fee is unchanged.'],th:['การบินกรุงเทพ: จัดกลุ่ม A319/A320 ไว้เป็นลำดับแรก จึงเป็นแบบหลัก และ ATR 72 เป็นแบบเพิ่มเติม ค่าธรรมเนียมไม่เปลี่ยนแปลง']},
  {v:'3.33',d:'2026-11-16',en:['Certificate fee panel: the application fee, certificate fees subtotal and total are now flat colour bands across the panel (light blue, light blue, dark navy), not rounded cards. Main certificate and additional types stay plain.'],th:['แผงค่าธรรมเนียมใบรับรอง: ค่าธรรมเนียมการยื่นคำขอ ยอดรวมค่าใบรับรอง และรวมค่าธรรมเนียม แสดงเป็นแถบสีเต็มความกว้าง (ฟ้าอ่อน ฟ้าอ่อน น้ำเงินเข้ม) ไม่ใช่การ์ดมุมมน ส่วนค่าใบรับรองหลักและค่าเพิ่มแบบอากาศยานยังคงเป็นข้อความปกติ']},
  {v:'3.32',d:'2026-11-16',en:['Certificate fee panel: the Certificate fees subtotal is back in light blue and the Total AOC fees in dark navy. The other fee lines stay plain text.'],th:['แผงค่าธรรมเนียมใบรับรอง: ยอดรวมค่าใบรับรองกลับมาเป็นสีฟ้าอ่อน และรวมค่าธรรมเนียมเป็นสีน้ำเงินเข้ม ส่วนรายการอื่นยังคงเป็นข้อความปกติ']},
  {v:'3.31',d:'2026-11-16',en:['Certificate fee panel: removed the card and box styling; the fee lines from the application fee to the total are plain text segments again. The subtotal is in blue text and the total in bold navy.'],th:['แผงค่าธรรมเนียมใบรับรอง: ยกเลิกรูปแบบการ์ดและกล่อง รายการตั้งแต่ค่าธรรมเนียมการยื่นคำขอถึงรวมค่าธรรมเนียมแสดงเป็นข้อความปกติ ยอดรวมค่าใบรับรองเป็นตัวอักษรสีน้ำเงิน และรวมค่าธรรมเนียมเป็นตัวหนาสีน้ำเงินเข้ม']},
  {v:'3.30',d:'2026-11-16',en:['Certificate fee panel: the application fee takes the same light blue as the subtotal; the main certificate and additional types are white cards.'],th:['แผงค่าธรรมเนียมใบรับรอง: ค่าธรรมเนียมการยื่นคำขอใช้สีฟ้าอ่อนเดียวกับยอดรวมค่าใบรับรอง ส่วนค่าใบรับรองหลักและค่าเพิ่มแบบอากาศยานแสดงเป็นการ์ดสีขาว']},
  {v:'3.29',d:'2026-11-16',en:['Fee panel: the Certificate fees subtotal now sits in a light blue box so it stands out from the fee lines.'],th:['แผงค่าธรรมเนียม: ยอดรวมค่าใบรับรองแสดงในกล่องสีฟ้าอ่อนเพื่อให้เด่นชัดกว่ารายการค่าธรรมเนียม']},
  {v:'3.28',d:'2026-11-16',en:['Acknowledgement popup: Thai button now reads รับทราบ.'],th:['กล่องข้อความรับทราบ: ปุ่มภาษาไทยแสดงคำว่า รับทราบ']},
  {v:'3.27',d:'2026-11-16',en:['Fee panel: the Certificate fees subtotal is now lighter and the Total AOC fees darker, so the total stands out.','New red acknowledgement popup on opening the app: results are interpretation-based and may be incorrect; cross-checking with FAD is required.'],th:['แผงค่าธรรมเนียม: ยอดรวมค่าใบรับรองแสดงสีอ่อนลง และรวมค่าธรรมเนียมแสดงสีเข้มขึ้นเพื่อให้เห็นยอดรวมเด่นชัด','เพิ่มกล่องข้อความสีแดงให้รับทราบเมื่อเปิดแอป ผลการคำนวณอาศัยการตีความและอาจคลาดเคลื่อน ต้องตรวจสอบยืนยันกับ FAD']},
  {v:'3.26',d:'2026-11-16',en:['Certificate page: the fee panel now shows a Certificate fees subtotal (main certificate plus additional types) just before the total.'],th:['หน้าค่าใบรับรอง: แผงค่าธรรมเนียมแสดงยอดรวมค่าใบรับรอง (ค่าใบรับรองหลักและค่าเพิ่มแบบอากาศยาน) ก่อนยอดรวมค่าธรรมเนียม']},
  {v:'3.25',d:'2026-11-16',en:['Bangkok Airways: the ATR 72 now carries a reference MTOW of 23,000 kg and the A319/A320 group 78,000 kg (the higher of the two). These are preliminary figures; the fee is unchanged.','Every operator: a remark under the weight field, and a footnote on the results and print views, say that weights are reference figures and the official assessment uses the MTOW in the approved AFM.'],th:['การบินกรุงเทพ: แบบ ATR 72 กำหนดน้ำหนักวิ่งขึ้นสูงสุดอ้างอิง 23,000 กก. และกลุ่ม A319/A320 78,000 กก. (ค่าที่สูงกว่าของสองแบบ) เป็นค่าเบื้องต้น ค่าธรรมเนียมไม่เปลี่ยนแปลง','ทุกผู้ดำเนินการเดินอากาศ: เพิ่มหมายเหตุใต้ช่องน้ำหนัก และหมายเหตุท้ายหน้าผลลัพธ์และหน้าพิมพ์ ว่าน้ำหนักเป็นค่าอ้างอิง การประเมินอย่างเป็นทางการใช้น้ำหนักวิ่งขึ้นสูงสุดตาม AFM ที่ได้รับอนุมัติ']},
  {v:'3.24',d:'2026-11-16',en:['Surveillance budget: added − 5M and + 5M buttons on the outer sides of the − 1M and + 1M buttons.'],th:['งบประมาณการกำกับดูแล: เพิ่มปุ่ม − 5M และ + 5M ไว้ด้านนอกของปุ่ม − 1M และ + 1M']},
  {v:'3.23',d:'2026-11-16',en:['Tapping a button quickly (for example the − and + 1M budget buttons) no longer zooms the page on iPhone and iPad. Pinch-zoom still works.'],th:['การแตะปุ่มติดกันอย่างรวดเร็ว (เช่น ปุ่ม − และ + 1M ของงบประมาณ) จะไม่ซูมหน้าจอบน iPhone และ iPad อีกต่อไป ยังคงใช้สองนิ้วถ่างเพื่อซูมได้']},
  {v:'3.22',d:'2026-11-15',en:['Surveillance Coverage Projection: − and + buttons next to the budget change it by 1 million baht per tap.'],th:['ส่วนประมาณการความครอบคลุมงบประมาณการกำกับดูแล: เพิ่มปุ่ม − และ + ถัดจากช่องงบประมาณ เพื่อปรับลดหรือเพิ่มครั้งละ 1 ล้านบาท']},
  {v:'3.21',d:'2026-11-15',en:['Surveillance Coverage Projection shows the break-even budget: the annual budget at which 5 years of surveillance equals the renewal revenue (revenue ÷ 5), with a bar comparing it with the current budget.'],th:['ส่วนประมาณการความครอบคลุมงบประมาณการกำกับดูแลแสดงงบประมาณ ณ จุดคุ้มทุน คืองบประมาณต่อปีที่ทำให้งบประมาณการกำกับดูแล 5 ปีเท่ากับรายได้จากการต่ออายุ (รายได้ ÷ 5) พร้อมแถบเปรียบเทียบกับงบประมาณปัจจุบัน']},
  {v:'3.20',d:'2026-11-15',en:['Expected renewal revenue: one click on Show AOCs opens or closes the lists for every year at once. The part-year dates are shorter, so the year cards line up.'],th:['ส่วนประมาณการรายได้จากการต่ออายุ: คลิกแสดงรายการเพียงครั้งเดียวเพื่อเปิดหรือปิดรายการของทุกปีพร้อมกัน และย่อวันที่ของปีที่ไม่เต็มปีให้สั้นลง เพื่อให้การ์ดรายปีเรียงตรงกัน']},
  {v:'3.19',d:'2026-11-15',en:['The Surveillance Coverage Projection password has changed.'],th:['เปลี่ยนรหัสผ่านของส่วนประมาณการความครอบคลุมงบประมาณการกำกับดูแลแล้ว']},
  {v:'3.18',d:'2026-11-15',en:['Expected renewal revenue uses calendar years only (the Fiscal year option is removed) and covers the next 5 years from today, so every current AOC is counted once. The Surveillance Coverage Projection uses the same total: renewal revenue per 5-year cycle minus the annual budget × 5, with the average per AOC.'],th:['ส่วนประมาณการรายได้จากการต่ออายุใช้ปีปฏิทินเท่านั้น (นำตัวเลือกปีงบประมาณออก) และครอบคลุม 5 ปีข้างหน้านับจากวันนี้ จึงนับใบรับรองที่มีผลอยู่ทุกฉบับครั้งเดียว ส่วนประมาณการความครอบคลุมงบประมาณการกำกับดูแลใช้ยอดเดียวกัน คือรายได้จากการต่ออายุต่อรอบ 5 ปี หักงบประมาณต่อปี × 5 พร้อมค่าเฉลี่ยต่อใบรับรอง']},
  {v:'3.17',d:'2026-11-15',en:['Expected renewal revenue now shows five years (this year and the next four, one full AOC cycle), so its total matches the Surveillance Coverage Projection. The projection no longer has the year-by-year bar chart; it keeps the three figures, the ring chart and the summary.'],th:['ส่วนประมาณการรายได้จากการต่ออายุแสดงข้อมูล 5 ปี (ปีนี้และอีกสี่ปีถัดไป ครบหนึ่งรอบอายุใบรับรอง) ยอดรวมจึงตรงกับส่วนประมาณการความครอบคลุมงบประมาณการกำกับดูแล และนำกราฟแท่งรายปีออกจากส่วนประมาณการดังกล่าว โดยคงตัวเลขสรุปสามรายการ แผนภูมิวงกลม และข้อความสรุปไว้']},
  {v:'3.16',d:'2026-11-15',en:['Surveillance Coverage Projection: hover over (or tap) a year bar to see the air operators paying renewal fees that year, with each fee and the total.'],th:['ส่วนประมาณการความครอบคลุมงบประมาณการกำกับดูแล: วางเมาส์ (หรือแตะ) แท่งกราฟรายปีเพื่อดูรายชื่อผู้ดำเนินการเดินอากาศที่ชำระค่าต่ออายุในปีนั้น พร้อมค่าธรรมเนียมแต่ละรายและยอดรวม']},
  {v:'3.15',d:'2026-11-15',en:['Surveillance Coverage Projection now opens with a password, and a Lock button closes it again. The annual budget starts at 16,000,000 baht.'],th:['ส่วนประมาณการความครอบคลุมงบประมาณการกำกับดูแลต้องกรอกรหัสผ่านก่อนเปิด และมีปุ่มล็อกเพื่อปิดอีกครั้ง งบประมาณต่อปีเริ่มต้นที่ 16,000,000 บาท']},
  {v:'3.14',d:'2026-11-15',en:['Pipeline: new Surveillance Coverage Projection under Expected renewal revenue (closed by default). Enter the annual surveillance budget to see 5 years of renewal fees minus 5 years of budget, the amount and percent remaining, and a year-by-year chart with the running balance.'],th:['หน้าติดตามการต่ออายุ: เพิ่มส่วนประมาณการความครอบคลุมงบประมาณการกำกับดูแลใต้ส่วนประมาณการรายได้จากการต่ออายุ (ปิดไว้เป็นค่าเริ่มต้น) เมื่อกรอกงบประมาณการกำกับดูแลต่อปี ระบบจะแสดงรายได้จากการต่ออายุ 5 ปี หักงบประมาณ 5 ปี พร้อมยอดคงเหลือ ร้อยละ และกราฟรายปีพร้อมยอดสะสม']},
  {v:'3.13',d:'2026-11-15',en:['Print preview now has a Download button next to Print. It saves the report as a PDF without leaving the preview.'],th:['หน้าตัวอย่างก่อนพิมพ์มีปุ่มดาวน์โหลดเพิ่มถัดจากปุ่มพิมพ์ ใช้บันทึกรายงานเป็นไฟล์ PDF ได้โดยไม่ต้องออกจากหน้าตัวอย่าง']},
  {v:'3.12',d:'2026-11-14',en:['Mixed AOC fixes: a boundary-weight type in a mixed AOC again needs CAAT confirmation and is left out of the Pipeline totals; the readings now split only by kind (aeroplane, helicopter, balloon), so large and small aeroplanes stay one kind; the Simple view and report list every application fee and main type with the right references; additional-type references cite each section used; Pipeline totals say when they include a mixed-AOC estimate; the Inspection tab no longer says Calculated for an estimated certificate fee; copied text names each application fee; the error-report email includes the reading.'],th:['แก้ไขใบรับรองประเภทผสม: แบบอากาศยานที่มีน้ำหนักอยู่ที่เกณฑ์พอดีในใบรับรองประเภทผสมต้องได้รับการยืนยันจาก กพท. และไม่นับรวมในยอดหน้าต่ออายุ แนวทางคำนวณแบ่งตามประเภทอากาศยาน (เครื่องบิน เฮลิคอปเตอร์ บัลลูน) เท่านั้น เครื่องบินขนาดใหญ่และขนาดเล็กจึงนับเป็นประเภทเดียวกัน มุมมองแบบย่อและรายงานแสดงค่าธรรมเนียมการยื่นคำขอและแบบหลักครบทุกรายการพร้อมอ้างอิงที่ถูกต้อง อ้างอิงค่าเพิ่มแบบอากาศยานระบุทุกข้อที่ใช้ ยอดหน้าต่ออายุระบุเมื่อรวมประมาณการใบรับรองประเภทผสม หน้าค่าใช้จ่ายในการตรวจสอบไม่แสดงว่าคำนวณแล้วเมื่อค่าใบรับรองเป็นประมาณการ ข้อความที่คัดลอกระบุประเภทของค่าธรรมเนียมการยื่นคำขอ และอีเมลแจ้งข้อผิดพลาดระบุแนวทางที่ใช้']},
  {v:'3.11',d:'2026-11-14',en:['Mixed AOCs (for example planes and helicopters, as Siam Land Flying) now get an estimated fee instead of none. Settings has five readings of how a mixed AOC could be charged (A to E); A is the default. Mixed AOCs are marked as estimates and are counted in the Pipeline totals.'],th:['ใบรับรองที่มีอากาศยานต่างประเภท (เช่น เครื่องบินและเฮลิคอปเตอร์ ของสยามแลนด์ ฟลายอิ้ง) แสดงค่าธรรมเนียมโดยประมาณแล้ว แทนที่จะไม่แสดง หน้าตั้งค่ามีแนวทางคำนวณห้าแบบ (A ถึง E) โดย A เป็นค่าเริ่มต้น ใบรับรองประเภทผสมระบุเป็นประมาณการและนับรวมในยอดหน้าต่ออายุ']},
  {v:'3.10',d:'2026-11-14',en:['Operator search: opening the list highlights the operator already chosen, so pressing Enter no longer switches to the first one; tapping outside the list closes it on iPad and iPhone.'],th:['ค้นหาผู้ดำเนินการ: เมื่อเปิดรายการ จะไฮไลต์ผู้ดำเนินการที่เลือกอยู่ การกด Enter จึงไม่เปลี่ยนไปยังรายการแรก และการแตะนอกรายการจะปิดรายการบน iPad และ iPhone']},
  {v:'3.9',d:'2026-11-14',en:['Air operator picker is searchable: type part of the English or Thai name, or the AOC number.','Dropdown arrows are drawn inside the box on every platform, and long names no longer push the box wider.'],th:['ค้นหาผู้ดำเนินการเดินอากาศได้ โดยพิมพ์ชื่อภาษาอังกฤษหรือภาษาไทยบางส่วน หรือเลขที่ใบรับรอง','ลูกศรของรายการแบบเลือกอยู่ภายในกรอบบนทุกอุปกรณ์ และชื่อที่ยาวไม่ทำให้กรอบขยายเกินขนาด']},
  {v:'3.8',d:'2026-11-14',en:['Renewal timeline: each date shows the days remaining (or how long ago it passed).'],th:['กำหนดเวลาการต่ออายุ: แสดงจำนวนวันที่เหลือของแต่ละวันที่ (หรือจำนวนวันที่ผ่านมาแล้ว)']},
  {v:'3.7',d:'2026-11-13',en:['Report: signature fields removed; Changes and Section 5/1 inspection show a grey “Not Applicable” when marked N/A.'],th:['รายงาน: ตัดช่องลงนามออก และแสดง “ไม่เกี่ยวข้อง (N/A)” สีเทาสำหรับการเปลี่ยนแปลงและค่าใช้จ่ายในการตรวจสอบเมื่อกำหนดเป็นไม่เกี่ยวข้อง']},
  {v:'3.6',d:'2026-11-13',en:['Summary: Preview button shows the report on an A4 page before printing or sending.'],th:['หน้าสรุป: ปุ่มดูตัวอย่างแสดงรายงานบนหน้ากระดาษ A4 ก่อนพิมพ์หรือส่ง']},
  {v:'3.5',d:'2026-11-13',en:['“Use new data” and “Reload list” now confirm inside the app, so they work reliably on iPhone.'],th:['ปุ่ม “ใช้ข้อมูลในระบบ” และ “โหลดรายการใหม่” ยืนยันภายในระบบแล้ว จึงทำงานได้แน่นอนบน iPhone']},
  {v:'3.4',d:'2026-11-13',en:['Reset app: confirmation inside the app, reset without reloading, and a message showing what was cleared (or that nothing needed clearing).'],th:['ปุ่มรีเซ็ตระบบ: ยืนยันภายในระบบ รีเซ็ตโดยไม่ต้องโหลดหน้าใหม่ และแสดงข้อความว่าล้างข้อมูลใดไปบ้าง หรือแจ้งว่าไม่มีข้อมูลที่ต้องล้าง']},

  { const b=opBaseExpiry(v); S.expiry=b; S.expiryAuto=!!b; }

function switchOperator(v){
  const prev=S.operator; if(v===prev) return;
  const keepTyped = !prev && !typesPristine();      // entries typed before any operator was chosen are kept
  if(prev){ touched.add(prev); if(hasEdits()) S.opCache[prev]=snapOp(); else delete S.opCache[prev]; }
  S.operator=v; if(!v){ freshOp(''); return; }   // no operator: start blank so one operator's aircraft never carry over to another

function actCalcText(r){
  if(r.error) return `<span>${esc(r.error)}</span>`;
  const hrs=r.hours!=null?` · ${fmt(r.hours)} ${L('h elapsed','ชั่วโมง')}`:'';
  return `<span>${r.days} ${L(r.days===1?'day':'days','วัน')} × ${r.persons} × ${fmt(r.rate)}${hrs}</span><b>฿ ${fmt(r.amount)}</b>`;
}

  const f=e.target.closest('[data-setpw]'); if(!f) return; e.preventDefault();

  if(ok){ S.setUnlocked=true; S.setAsk=''; S.setErr=''; rerenderKeepScroll(); toast(L('Settings unlocked for this session','ปลดล็อกการตั้งค่าสำหรับการใช้งานครั้งนี้แล้ว')); }

function inspData(){
  const I=S.insp, warnings=[]; let E=0, maxP=0;

    if(x.r.flag) warnings.push(L(`Inspection ${x.i+1}: a trip of 12 hours or less counts as 0 days under Appendix A note 3. Refer for confirmation.`,`การตรวจสอบ ${x.i+1}: การเดินทางไม่เกิน 12 ชั่วโมงนับเป็น 0 วันตามหมายเหตุ 3 ภาคผนวก ก กรุณาส่งพิจารณายืนยัน`));
    E+=x.r.amount; });

  const apps=rows.filter(r=>r.band==='app'||r.band==='nodate').sort((a,b)=>opName(a.op).localeCompare(opName(b.op)));
  const late=hold.filter(r=>r.band==='overdue'||r.band==='expired'), d30=hold.filter(r=>r.band==='d30'), d90=hold.filter(r=>r.band==='d90');
  const yr=hold.filter(r=>r.de>=0&&r.de<=365), collect=hold.filter(r=>r.de!=null&&r.de>=0&&r.stat!=='ren');

/* Industry profile: what the AOC holders fly and where (current AOCs, not applications). */
function indStats(D){
  const H=D.rows.filter(r=>r.band!=='app'&&r.band!=='expired'&&r.n>0), A=D.rows.filter(r=>r.band==='app');   // currently active AOCs only
  const kindOf=c=>c==='AEROPLANE'?'A':c==='HELICOPTER'?'H':'B';
  const st={holders:H.length,apps:A.length,kinds:{A:0,H:0,B:0,M:0},area:{A:{DOM:0,ASIA:0,INTL:0},H:{DOM:0,HELI_INTL:0}},
    entries:{A:{DOM:0,ASIA:0,INTL:0,'':0},H:{DOM:0,HELI_INTL:0,'':0},B:0},weight:{A:{L:0,S:0},H:{L:0,S:0}},size:{one:0,few:0,many:0},
    models:{},types:0,fees:[],top:null};
  H.forEach(r=>{
    const ts=opTypes(r.op).filter(t=>t.ac||t.name); st.types+=ts.length;
    if(ts.length===1) st.size.one++; else if(ts.length>=2&&ts.length<=3) st.size.few++; else if(ts.length>=4) st.size.many++;
    const ks=[...new Set(ts.map(t=>kindOf(t.cat)))];
    if(ks.length>1) st.kinds.M++; else if(ks.length===1) st.kinds[ks[0]]++;
    ['A','H'].forEach(k=>{
      const c=k==='A'?'AEROPLANE':'HELICOPTER', tk=ts.filter(t=>t.cat===c); if(!tk.length) return;
      const ar=tk.map(t=>t.area).filter(a=>AREAS_FOR[c].includes(a)); if(ar.length){ const w=ar.reduce((x,y)=>RANK[y]>RANK[x]?y:x,ar[0]); st.area[k][w]++; }
      if(tk.some(t=>typeHeavy(t))) st.weight[k].L++; else st.weight[k].S++;
    });
    ts.forEach(t=>{ const k=kindOf(t.cat); if(k==='B') st.entries.B++; else { const a=AREAS_FOR[t.cat].includes(t.area)?t.area:''; st.entries[k][a]++; }
      const keys=(t.models&&t.models.length)?t.models:[((t.name||'').trim()||'?')]; keys.forEach(key=>(st.models[key]=st.models[key]||new Set()).add(r.op)); });
    if(r.fee!=null){ st.fees.push(r.fee); if(!st.top||r.fee>st.top.fee) st.top=r; }
  });
  st.distinct=Object.keys(st.models).length;
  st.common=Object.entries(st.models).map(([k,v])=>[k,v.size]).sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0])).slice(0,10);
  st.avgTypes=H.length?st.types/H.length:0;
  const f=st.fees.slice().sort((a,b)=>a-b); st.avgFee=f.length?f.reduce((a,b)=>a+b,0)/f.length:0; st.medFee=f.length?(f.length%2?f[(f.length-1)/2]:(f[f.length/2-1]+f[f.length/2])/2):0;
  return st;
}

/* ---------- Calendar (.ics): application deadline and expiry, with reminders. Dates only, no amounts. ---------- */
function icsEsc(t){ return String(t).replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\r?\n/g,'\\n'); }
function icsFold(line){
  const enc=new TextEncoder(); if(enc.encode(line).length<=74) return line;
  const out=[]; let cur='', n=0;
  for(const ch of Array.from(line)){ const b=enc.encode(ch).length; if(n+b>(out.length?73:74)){ out.push(cur); cur=''; n=0; } cur+=ch; n+=b; }
  out.push(cur); return out.join('\r\n ');
}
function icsEvents(op){
  const exp=opExpiry(op); if(!exp || (OPINFO[op]||{}).app) return [];
  const i=OPINFO[op]||{}, name=opName(op), aoc=i.aoc?` (${i.aoc})`:'', slug=op.toLowerCase().replace(/[^a-z0-9]+/g,'-').slice(0,40), due=addDays(exp,-150);
  return [
    {uid:`aoc-apply-${slug}-${exp}@caat-ops-ct`,date:due,
     title:L(`AOC renewal application due · ${name}${aoc}`,`ครบกำหนดยื่นคำขอต่ออายุใบรับรอง · ${name}${aoc}`),
     desc:L(`Last day to apply for AOC renewal (150 days before expiry on ${dfmt(exp,true)}).`,`วันสุดท้ายของการยื่นคำขอต่ออายุใบรับรอง (ไม่น้อยกว่า 150 วันก่อนวันหมดอายุ ${dfmt(exp,true)})`),
     alarms:[30,7,1]},
    {uid:`aoc-expiry-${slug}-${exp}@caat-ops-ct`,date:exp,
     title:L(`AOC expires · ${name}${aoc}`,`ใบรับรองหมดอายุ · ${name}${aoc}`),
     desc:L(`AOC valid until ${dfmt(exp,true)}. A new AOC can be issued from ${dfmt(addDays(exp,-45),true)}.`,`ใบรับรองใช้ได้ถึง ${dfmt(exp,true)} ออกฉบับใหม่ได้ตั้งแต่ ${dfmt(addDays(exp,-45),true)}`),
     alarms:[45]}];
}
function icsText(evs){
  const stamp=new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d+Z$/,'Z'), L2=[];
  L2.push('BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//CAAT OPS CT//AOC Fee Calculator//EN','CALSCALE:GREGORIAN','METHOD:PUBLISH','X-WR-CALNAME:'+icsEsc(L('AOC renewals','การต่ออายุใบรับรอง')));
  evs.forEach(e=>{
    L2.push('BEGIN:VEVENT','UID:'+e.uid,'DTSTAMP:'+stamp,'DTSTART;VALUE=DATE:'+e.date.replace(/-/g,''),'DTEND;VALUE=DATE:'+addDays(e.date,1).replace(/-/g,''),
      'SUMMARY:'+icsEsc(e.title),'DESCRIPTION:'+icsEsc(e.desc),'TRANSP:TRANSPARENT');
    e.alarms.forEach(d=>L2.push('BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+icsEsc(e.title),`TRIGGER:-P${d-1}DT15H`,'END:VALARM'));   // 09:00, d days before
    L2.push('END:VEVENT');
  });
  L2.push('END:VCALENDAR');
  return L2.map(icsFold).join('\r\n')+'\r\n';
}
function saveIcs(evs,name){
  const t0=localISO(); evs=evs.filter(e=>e.date>=t0);
  if(!evs.length){ toast(L('No upcoming dates to add','ไม่มีกำหนดการที่จะถึงให้เพิ่ม')); return; }
  const url=URL.createObjectURL(new Blob([icsText(evs)],{type:'text/calendar;charset=utf-8'}));
  const a=document.createElement('a'); a.href=url; a.download=name+'.ics'; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),4000);
  toast(L(`Calendar file ready: ${evs.length} event${evs.length>1?'s':''}`,`ไฟล์ปฏิทินพร้อมแล้ว ${evs.length} รายการ`));
}
function icsOne(op){ saveIcs(icsEvents(op),'aoc-deadlines-'+op.toLowerCase().replace(/[^a-z0-9]+/g,'-').slice(0,40)); }

/* ---------- Saved edits: each operator's entries are kept on this device ---------- */
const EDIT_KEY='aoc.opEdits';
function dataSig(op){ const t=JSON.stringify([FLEET[op]||null,OPINFO[op]||null]); let h=0; for(let k=0;k<t.length;k++){ h=(h*31+t.charCodeAt(k))|0; } return (h>>>0).toString(36); }
let persistT=null;
function persistSoon(){ if(S.resetMsg && S.tab!=='settings'){ S.resetMsg=''; } clearTimeout(persistT); persistT=setTimeout(persistNow,400); }
/* Saving merges with what is already stored: only operators touched in this tab are written or removed,
   so a second open copy of the app cannot overwrite another copy's edits. */
const touched=new Set();
function readStore(){ let d=null; try{ d=JSON.parse(load(EDIT_KEY)||'null'); }catch(e){} return (d&&d.v===1&&d.ops&&typeof d.ops==='object')?d:{v:1,cur:'',ops:{}}; }
function persistNow(){
  clearTimeout(persistT); if(RESETTING) return;
  try{
    if(S.operator) touched.add(S.operator);
    const d=readStore();
    touched.forEach(op=>{
      const snap = op===S.operator ? (hasEdits()?snapOp():null) : (S.opCache[op]||null);
      if(snap) d.ops[op]={snap,sig:dataSig(op)}; else delete d.ops[op];
    });
    d.cur=S.operator||'';
    store(EDIT_KEY,JSON.stringify(d));
  }catch(e){}
}
/* Saved data is checked before use; anything malformed is dropped rather than loaded. */
function cleanSnap(op,s){ const r=cleanSnapRaw(op,s); if(r){ cnFixTypes(r.types); if(typeof r.loadedSig==='string') r.loadedSig=cnFixSig(r.loadedSig); (r.changesAdded||[]).forEach(x=>{ if(x&&x.p&&Array.isArray(x.p.certTypes)) cnFixTypes(x.p.certTypes); if(x&&x.p&&x.p.expName&&x.p.certTypes&&x.p.certTypes[x.p.expIdx]) x.p.expName=x.p.certTypes[x.p.expIdx].name; }); } return r; }
function cleanSnapRaw(op,s){
  if(!s||typeof s!=='object'||!Array.isArray(s.types)||!s.types.length) return null;
  const okT=t=>t&&typeof t==='object'&&typeof t.id==='string'&&['AEROPLANE','HELICOPTER','BALLOON'].includes(t.cat);
  if(!s.types.every(okT)) return null;
  const i=OPINFO[op]||{}, d=clone(OP_DEF);
  const out={types:s.types,
    expiry:(typeof s.expiry==='string'&&/^(\d{4}-\d{2}-\d{2})?$/.test(s.expiry))?s.expiry:(i.until||''),
    expiryAuto:!!s.expiryAuto, tx:s.tx==='initial'?'initial':'renewal', txAuto:!!s.txAuto,
    changesAdded:Array.isArray(s.changesAdded)?s.changesAdded.filter(x=>x&&typeof x==='object'&&typeof x.mode==='string'&&x.p&&typeof x.p==='object'):[],
    change:(s.change&&typeof s.change==='object')?Object.assign(d.change,s.change):d.change,
    insp:(s.insp&&typeof s.insp==='object'&&Array.isArray(s.insp.acts))?Object.assign(d.insp,s.insp,{gov:Object.assign(d.insp.gov,(s.insp.gov&&typeof s.insp.gov==='object')?s.insp.gov:{})}):d.insp,
    na:(s.naSet===true)?{change:(s.na&&typeof s.na.change==='boolean')?s.na.change:d.na.change, insp:(s.na&&typeof s.na.insp==='boolean')?s.na.insp:d.na.insp}:clone(d.na), naSet:s.naSet===true,   // N/A saved before v3.42 was the old default, so it is not carried over
    loadedSig:typeof s.loadedSig==='string'?s.loadedSig:null, fleetFrom:typeof s.fleetFrom==='string'?s.fleetFrom:null};
  if(!(s.insp&&typeof s.insp.showOp==='boolean')) out.insp.showOp=!!((toNum(out.insp.opTravel)||0)+(toNum(out.insp.opHotel)||0));   // older saved edits without the switch
  else out.insp.showOp=s.insp.showOp;
  return out;
}
function restoreEdits(){
  const d=readStore(), all=OPERATORS.concat(S.customOps);
  let max=0;
  Object.entries(d.ops).forEach(([op,o])=>{ if(!all.includes(op)||!o) return; const snap=cleanSnap(op,o.snap); if(!snap) return;
    S.opCache[op]=snap; if(o.sig!==dataSig(op)) S.staleOps[op]=true;
    snap.types.forEach(t=>{ const m=/^t(\d+)$/.exec(t.id); if(m) max=Math.max(max,+m[1]); });
    snap.insp.acts.forEach(a=>{ const m=/^t(\d+)$/.exec((a&&a.id)||''); if(m) max=Math.max(max,+m[1]); }); });
  uid=Math.max(uid,max);
  if(d.cur && all.includes(d.cur)){
    if(S.opCache[d.cur]){ S.operator=d.cur; Object.assign(S,clone(S.opCache[d.cur])); }
    else switchOperator(d.cur);
  }
}

/* ---------- Send PDF: share sheet (attached) or email draft (attach manually). No server. ---------- */
const PDF_LIB='https://cdn.jsdelivr.net/npm/html2pdf.js@0.10.2/dist/html2pdf.bundle.min.js';
let pdfLibP=null;
function loadPdfLib(){
  if(window.html2pdf) return Promise.resolve();
  if(!pdfLibP) pdfLibP=new Promise((res,rej)=>{ const sc=document.createElement('script'); sc.src=PDF_LIB; sc.async=true;
    sc.onload=()=>window.html2pdf?res():rej(new Error('lib')); sc.onerror=()=>{ pdfLibP=null; sc.remove(); rej(new Error('net')); }; document.head.appendChild(sc); });
  return pdfLibP;
}
/* html2canvas only wraps at spaces, so long Thai runs were drawn on one line. Mark Thai word boundaries with
   zero-width spaces (Intl.Segmenter) so the captured lines match the browser layout. */
function pdfSource(){
  const host=document.createElement('div'); host.className='rp-x'; host.innerHTML=reportHTML();
  let seg=null; try{ seg=new Intl.Segmenter('th',{granularity:'word'}); }catch(e){}
  if(seg){
    const w=document.createTreeWalker(host,NodeFilter.SHOW_TEXT), nodes=[]; while(w.nextNode()) nodes.push(w.currentNode);
    nodes.forEach(n=>{ if(/[\u0E00-\u0E7F]/.test(n.nodeValue)) n.nodeValue=Array.from(seg.segment(n.nodeValue),x=>x.segment).join('\u200B'); });
  }
  return host;
}
async function makePdf(){
  await loadPdfLib();
  try{ if(document.fonts&&document.fonts.ready) await document.fonts.ready; }catch(e){}
  const y=window.scrollY; window.scrollTo(0,0);
  try{ return await window.html2pdf().set({
    margin:[12,13,14,13], filename:fileStem()+'.pdf',
    image:{type:'jpeg',quality:0.96},
    html2canvas:{scale:2,backgroundColor:'#ffffff',logging:false,scrollX:0,scrollY:0},
    jsPDF:{unit:'mm',format:'a4',orientation:'portrait',compress:true},
    pagebreak:{mode:['css','legacy'],after:['.rp-cover'],avoid:['tr','.rp-blk','.rp-sign','.rp-tot','.rp-kpis','.rp-s h3','.rp-h','li']}
  }).from(pdfSource(),'element').outputPdf('blob'); }
  finally{ window.scrollTo(0,y); }
}

      return; }
    case 'survStep': { const cur=toNum(S.survBudget), base=(cur!=null&&!isNaN(cur)&&cur>0)?cur:0, nv=Math.max(0,base+Number(el.dataset.d)*1e6);
      S.survBudget=String(nv); store('aoc.survBudget',S.survBudget); const inp=document.getElementById('svcIn'); if(inp) inp.value=nv?fmt(nv):'';
      const o=document.getElementById('svcOut'); if(o) o.innerHTML=svcOut(); return; }
    case 'svcToggle': if(S.survUnlocked){ S.survOpen=!S.survOpen; svcRender(); } else { S.survAsk=!S.survAsk; S.survErr=''; svcRender(S.survAsk?'svcPw':''); } return;

    case 'report': reportError(); return;

    case 'indTog': { const row=el.closest('.prow2'); if(!row) return; S.indOpen=S.indOpen||{}; const now=!row.classList.contains('open'); S.indOpen[el.dataset.op]=now; el.setAttribute('aria-expanded',String(now));
      row.classList.remove('printing'); clearTimeout(row._pt);
      if(now&&MOTION()){ void row.offsetWidth; row.classList.add('printing'); row._pt=setTimeout(()=>row.classList.remove('printing'),1800); }
      row.classList.toggle('open',now); indAllSync(); return; }
    case 'indAll': { S.indOpen=S.indOpen||{}; const rows=[...document.querySelectorAll('.prow2')], open=rows.some(r=>!r.classList.contains('open')), mot=MOTION(); let k=0;
      rows.forEach(r=>{ const hd=r.querySelector('.pr-hd'); S.indOpen[hd.dataset.op]=open; hd.setAttribute('aria-expanded',String(open)); r.classList.remove('printing'); clearTimeout(r._pt);
        const bx=r.getBoundingClientRect(), vis=bx.top<innerHeight&&bx.bottom>0;
        if(open&&mot&&vis&&k<6&&!r.classList.contains('open')){ const d=k++*140; r._pt=setTimeout(()=>{ void r.offsetWidth; r.classList.add('printing','open'); r._pt=setTimeout(()=>r.classList.remove('printing'),1800); },d); }
        else r.classList.toggle('open',open); });
      el.innerHTML=indAllLbl(open); return; }
    case 'pipeOpen': { const op=el.dataset.op; if(op!==S.operator) switchOperator(op); S.tab='cert'; renderAll(); window.scrollTo({top:0,behavior:'smooth'}); return; }
    case 'resetOp': { const op=el.dataset.op;
      askSheet(L(`Use the built-in data for ${opName(op)}?`,`ใช้ข้อมูลในระบบสำหรับ ${opName(op)} หรือไม่`),L('Your saved entries for this operator will be removed and replaced by the built-in data.','ข้อมูลที่บันทึกไว้ของผู้ดำเนินการรายนี้จะถูกลบและแทนที่ด้วยข้อมูลในระบบ'),L('Use built-in data','ใช้ข้อมูลในระบบ'),
        ()=>{ resetOp(op); renderAll(); toast(L('Built-in data restored for this operator','ใช้ข้อมูลในระบบสำหรับผู้ดำเนินการรายนี้แล้ว')); }); return; }
    case 'resetApp': confirmReset(); return;
    case 'ackYes': { const f=ackNext; closeAck(); if(f) f(); return; }
    case 'ackNo': closeAck(); return;
    case 'na': S.na[v]=el.dataset.on==='1'; S.naSet=true; renderAll();
      toast(S.na[v]?L('Marked Not Applicable: left out of the Summary and reports','กำหนดเป็นไม่เกี่ยวข้อง: ไม่แสดงในหน้าสรุปและรายงาน'):L('Included in the Summary and reports again','นำกลับมารวมในหน้าสรุปและรายงานแล้ว')); return;

  withFlip(()=>{ if(['tcat','theavy','tarea','tlegacy','useRef','showMtow','hideMtow','splitType'].includes(act)) autoPrincipal(); rerenderKeepScroll(); });

document.addEventListener('input',e=>{
  persistSoon();
  const el=e.target; const b=el.dataset.bind; if(!b) return;
  const id=el.dataset.id, val=el.value, c=S.change;
  if(b==='name'){ findT(id).name=val; renderSide(); return; }
  if(b==='mtow'){ const t=findT(id); t.mtow=val; if(!classify(t).boundary) t.legacyConfirm=null; refreshTypeCards(); renderSide(); return; }
  if(b==='expiry'){ S.expiry=val; S.expiryAuto=false; syncMonths(); renderTimeline(); return; }
  if(b==='cM'){ c.Mauto=false; c.Mrule='manual'; c.M=Number(val); refreshMonthsUI(); renderSide(); return; }
  if(b==='cMtxt'){ c.Mauto=false; c.Mrule='manual'; c.M=val; refreshMonthsUI(true); renderSide(); return; }
  if(b==='cAsOf'){ c.asOf=val; syncMonths(); refreshMonthsUI(); renderSide(); return; }
  if(b==='cT'){ c.T=val; syncMonths(); refreshMonthsUI(); const em=document.querySelector('[data-bind="cMtxt"]'); const T=toNum(val); if(em&&em.nextElementSibling&&T>0) em.nextElementSibling.textContent='/ '+T; renderSide(); return; }
  if(b==='country'){ findA(id).country=val; updateAct(id); return; }
  if(b==='start'||b==='end'){ findA(id)[b]=val; updateAct(id); return; }
  if(b==='opDraft'){ S.opDraft=val; return; }
  if(b==='survB'){ S.survBudget=val; store('aoc.survBudget',val.trim()); const o=document.getElementById('svcOut'); if(o) o.innerHTML=svcOut(); return; }
  if(b==='mailTo'){ if(S.send) S.send.to=val; store('aoc.mailTo',val.trim()); return; }
  if(b==='opTravel'||b==='opHotel'){ S.insp[b]=val; renderSide(); return; }
  if(b==='gnights'){ S.insp.gov.nights=val; renderSide(); return; }
  if(b==='gflights'){ S.insp.gov.flights=val; renderSide(); return; }
  if(b==='gveh'){ S.insp.gov.vehicleDays=val; renderSide(); return; }
});
document.addEventListener('change',e=>{
  persistSoon();
  const b=e.target.dataset.bind;
  if(b==='survB'){ const n=toNum(e.target.value); if(n!=null&&!isNaN(n)) e.target.value=fmt(n); return; }
  if(b==='mtow'){ withFlip(()=>{ if(autoPrincipal()) rerenderKeepScroll(); }); return; }
  if(b==='acsel'){
    const t=findT(e.target.dataset.id), v=e.target.value;
    if(v==='OTHER'){ t.ac='OTHER'; t.name=''; t.models=[]; }
    else if(!v){ t.ac=''; t.name=''; }
    else { const a=acById(v); t.ac=v; t.name=cnOf(a.id); t.models=[v]; t.chk=false; const cat=acCat(a); if(t.cat!==cat){ t.cat=cat; t.area=''; }
      if(t.area && !AREAS_FOR[t.cat].includes(t.area)) t.area='';
      t.heavy=acHeavy(a); t.showMtow=false; t.mtow=''; t.legacyConfirm=null; }
    withFlip(()=>{ autoPrincipal(); rerenderKeepScroll(); }); return;
  }
  if(b==='opsel'){
    const v=e.target.value;
    if(v==='__add'){ S.addingOp=true; S.opDraft=''; renderOpbar(); const i=document.querySelector('[data-bind="opDraft"]'); if(i) i.focus(); return; }
    switchOperator(v);
    renderAll(); return;
  }
});
document.addEventListener('keydown',e=>{
  if(e.target.dataset&&e.target.dataset.bind==='opDraft'){ if(e.key==='Enter'){ e.preventDefault(); saveOperator(); } else if(e.key==='Escape'){ S.addingOp=false; renderOpbar(); } }
});
function updateAct(id){ const a=findA(id); const el=document.getElementById('calc-'+id); if(el) el.innerHTML=actCalcText(calcActivity(a)); renderSide(); }
document.getElementById('mini').addEventListener('click',()=>{ const r=document.getElementById('side'); if(r) r.scrollIntoView({behavior:'smooth',block:'start'}); });
