<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1a2e4a">
<title>AOC Fee Calculator · CT/OPS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#1a2e4a; --navy-2:#223a5c; --blue:#1e4d8c; --blue-mid:#2563a8; --blue-soft:#e3ecf7;
  --teal:#2a9d8f; --teal-lt:#3bbfb0; --teal-soft:#e2f4f1;
  --green:#5f8f6f; --green-soft:#e8f1ea;
  --amber:#a8741a; --amber-soft:#fbf3e3;
  --error:#c0392b; --error-soft:#fbeceb;
  --grey-dark:#2d3748; --grey-mid:#4a5568; --grey-soft:#718096; --grey-light:#e2e8f0; --grey-pale:#f0f4f8; --white:#fff;
  --r-card:18px; --r-ctl:12px;
  --sh-1:0 1px 2px rgba(26,46,74,.06),0 2px 8px rgba(26,46,74,.06);
  --sh-2:0 1px 2px rgba(26,46,74,.05),0 8px 24px rgba(26,46,74,.10),0 24px 48px -24px rgba(26,46,74,.18);
  --sh-3:0 2px 4px rgba(26,46,74,.08),0 16px 40px rgba(26,46,74,.18);
  --font:'Inter','Noto Sans Thai',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono',ui-monospace,monospace;
  --nav-h:0px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{
  font-family:var(--font);color:var(--grey-dark);font-size:15px;line-height:1.45;
  background:
    radial-gradient(1200px 600px at 100% -10%,rgba(42,157,143,.10),transparent 60%),
    radial-gradient(900px 500px at -10% 10%,rgba(37,99,168,.10),transparent 60%),
    linear-gradient(180deg,#eef3f8 0%,#f4f7fa 40%,#eef2f6 100%);
  min-height:100vh;
  padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom));
}
button,input,select{font-family:inherit;font-size:inherit;color:inherit}
.thai{font-family:'Noto Sans Thai',var(--font)}
.mono{font-family:var(--mono)}

/* ---------- Header ---------- */
.hero{
  position:relative;overflow:hidden;color:#fff;
  background:linear-gradient(135deg,#132338 0%,var(--navy) 35%,var(--blue) 75%,#24679a 100%);
  padding:calc(18px + env(safe-area-inset-top)) 20px 64px;
  box-shadow:inset 0 -1px 0 rgba(255,255,255,.06);
}
.hero::before{content:"";position:absolute;inset:auto -10% -60% 30%;height:260px;
  background:radial-gradient(closest-side,rgba(59,191,176,.35),transparent);filter:blur(10px)}
.hero::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:linear-gradient(90deg,var(--teal),var(--teal-lt),var(--blue-mid))}
.hero-in{max-width:1180px;margin:0 auto;position:relative;display:flex;align-items:center;gap:14px}
.logo{width:44px;height:44px;border-radius:13px;flex:none;display:grid;place-items:center;
  background:linear-gradient(145deg,var(--teal-lt),var(--teal) 60%,#1f7d72);
  box-shadow:0 6px 16px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.35)}
.logo svg{width:24px;height:24px}
.hero h1{margin:0;font-size:19px;font-weight:600;letter-spacing:-.01em}
.hero p{margin:2px 0 0;font-size:12.5px;color:rgba(255,255,255,.72)}
.badge{margin-left:auto;font-size:11.5px;padding:6px 10px;border-radius:999px;white-space:nowrap;
  background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.18);backdrop-filter:blur(6px);display:flex;align-items:center;gap:6px}
.badge i{width:7px;height:7px;border-radius:50%;background:#9ae6b4;box-shadow:0 0 0 3px rgba(154,230,180,.18)}
.badge.bad i{background:#feb2b2;box-shadow:0 0 0 3px rgba(254,178,178,.2)}

/* ---------- Nav ---------- */
.nav{max-width:1180px;margin:-44px auto 0;padding:0 16px;position:relative;z-index:5}
.nav-in{display:flex;gap:6px;padding:6px;border-radius:16px;
  background:linear-gradient(180deg,rgba(255,255,255,.96),rgba(246,249,252,.94));
  box-shadow:var(--sh-2);border:1px solid rgba(255,255,255,.7);backdrop-filter:blur(10px);width:max-content;max-width:100%}
.nav button{border:0;background:transparent;padding:10px 14px;border-radius:11px;cursor:pointer;
  display:flex;align-items:center;gap:8px;color:var(--grey-mid);font-weight:500;font-size:14px;transition:all .18s}
.nav button svg{width:18px;height:18px;flex:none}
.nav button:hover{color:var(--navy);background:var(--grey-pale)}
.nav button.on{color:#fff;background:linear-gradient(135deg,var(--navy),var(--blue));box-shadow:0 4px 12px rgba(30,77,140,.35),inset 0 1px 0 rgba(255,255,255,.15)}

/* ---------- Layout ---------- */
.shell{max-width:1180px;margin:22px auto 40px;padding:0 16px;display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:22px;align-items:start}
.shell.full{grid-template-columns:minmax(0,1fr)}
.shell.full .side{display:none}
.side{position:sticky;top:18px}
.page{display:none}.page.on{display:block;animation:rise .28s ease}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.card{background:linear-gradient(180deg,#fff 0%,#fbfcfe 100%);border-radius:var(--r-card);box-shadow:var(--sh-2);
  border:1px solid rgba(226,232,240,.9);padding:20px;margin-bottom:18px;position:relative}
.card.lift{transition:transform .2s,box-shadow .2s}
.card h2{margin:0 0 4px;font-size:16px;font-weight:600;color:var(--navy);letter-spacing:-.01em}
.card .sub{margin:0 0 16px;color:var(--grey-soft);font-size:13px}
.eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--teal);font-weight:600;margin-bottom:6px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.lbl{font-size:12px;font-weight:600;color:var(--grey-mid);margin:14px 0 8px;display:flex;align-items:center;gap:6px}
.lbl small{font-weight:400;color:var(--grey-soft)}

/* ---------- Big toggle tiles ---------- */
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.tiles.three{grid-template-columns:repeat(3,1fr)}
.tile{border:1.5px solid var(--grey-light);border-radius:16px;padding:14px;cursor:pointer;text-align:left;
  background:linear-gradient(180deg,#fff,#f6f9fc);box-shadow:var(--sh-1);transition:all .18s;display:flex;gap:12px;align-items:center;min-height:64px}
.tile:hover{transform:translateY(-1px);box-shadow:var(--sh-2)}
.tile .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none;
  background:linear-gradient(145deg,#eef3f9,#dfe8f3);color:var(--blue);box-shadow:inset 0 1px 0 #fff,0 1px 2px rgba(26,46,74,.08)}
.tile .ic svg{width:22px;height:22px}
.tile b{display:block;font-size:14.5px;font-weight:600;color:var(--navy)}
.tile span{display:block;font-size:12px;color:var(--grey-soft)}
.tile.on{border-color:transparent;background:linear-gradient(135deg,var(--navy) 0%,var(--blue) 100%);
  box-shadow:0 10px 24px -8px rgba(30,77,140,.55),inset 0 1px 0 rgba(255,255,255,.12)}
.tile.on b{color:#fff}.tile.on span{color:rgba(255,255,255,.75)}
.tile.on .ic{background:linear-gradient(145deg,var(--teal-lt),var(--teal));color:#fff;box-shadow:0 4px 10px rgba(0,0,0,.2),inset 0 1px 0 rgba(255,255,255,.3)}

/* mini category tiles */
.cats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cat{border:1.5px solid var(--grey-light);background:linear-gradient(180deg,#fff,#f5f8fb);border-radius:14px;padding:10px 6px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12.5px;font-weight:500;color:var(--grey-mid);transition:all .16s;box-shadow:var(--sh-1)}
.cat svg{width:26px;height:26px;color:var(--blue)}
.cat.on{background:linear-gradient(160deg,var(--teal-soft),#d3ede8);border-color:var(--teal);color:var(--navy);box-shadow:0 6px 16px -6px rgba(42,157,143,.55)}
.cat.on svg{color:var(--teal)}

/* segmented */
.seg{display:inline-flex;padding:4px;border-radius:13px;background:linear-gradient(180deg,#e9eef4,#f1f5f9);box-shadow:inset 0 1px 3px rgba(26,46,74,.12);gap:2px;max-width:100%;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:8px 14px;border-radius:10px;cursor:pointer;font-size:13.5px;font-weight:500;color:var(--grey-mid);transition:all .16s}
.seg button.on{background:linear-gradient(180deg,#fff,#f8fafc);color:var(--navy);box-shadow:0 1px 2px rgba(26,46,74,.12),0 3px 8px rgba(26,46,74,.10);font-weight:600}
.seg.full{display:flex;width:100%}.seg.full button{flex:1}

/* route ladder for Area of Operation */
.route{display:flex;align-items:stretch;gap:0;position:relative;padding:4px 0}
.route .stop{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;position:relative;padding:4px 2px;border:0;background:none}
.route .stop::before{content:"";position:absolute;top:17px;left:-50%;width:100%;height:4px;border-radius:2px;background:var(--grey-light);z-index:0}
.route .stop:first-child::before{display:none}
.route .stop.lit::before{background:linear-gradient(90deg,var(--teal),var(--blue-mid))}
.route .dot{width:30px;height:30px;border-radius:50%;z-index:1;display:grid;place-items:center;font-size:12px;font-weight:600;
  background:linear-gradient(180deg,#fff,#eef2f7);border:2px solid var(--grey-light);color:var(--grey-soft);box-shadow:var(--sh-1);transition:all .18s}
.route .stop.lit .dot{border-color:var(--teal);color:var(--teal)}
.route .stop.on .dot{background:linear-gradient(145deg,var(--teal-lt),var(--teal) 55%,var(--blue-mid));border-color:transparent;color:#fff;transform:scale(1.12);box-shadow:0 6px 14px -4px rgba(42,157,143,.6)}
.route .name{font-size:12.5px;font-weight:500;color:var(--grey-mid);text-align:center;line-height:1.2}
.route .stop.on .name{color:var(--navy);font-weight:600}
.route .th{font-size:11px;color:var(--grey-soft)}

/* aircraft type card */
.type{border-radius:16px;padding:16px;margin-bottom:14px;background:linear-gradient(180deg,#fff,#f8fafd);border:1px solid var(--grey-light);box-shadow:var(--sh-1);position:relative}
.type.principal{border-color:rgba(42,157,143,.55);box-shadow:0 0 0 3px rgba(42,157,143,.10),var(--sh-2)}
.type-h{display:flex;align-items:center;gap:10px;margin-bottom:4px}
.type-h .num{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;font-size:13px;font-weight:600;color:#fff;
  background:linear-gradient(145deg,var(--blue-mid),var(--navy));box-shadow:0 3px 8px rgba(30,77,140,.35)}
.type-h input{flex:1;min-width:0;border:0;border-bottom:1.5px dashed transparent;background:transparent;font-size:15px;font-weight:600;color:var(--navy);padding:4px 2px}
.type-h input:focus{outline:none;border-bottom-color:var(--teal)}
.type-h input::placeholder{color:#a0aec0;font-weight:500}
.pill{font-size:11px;font-weight:600;padding:4px 9px;border-radius:999px;white-space:nowrap}
.pill.principal{background:linear-gradient(135deg,var(--teal),var(--teal-lt));color:#fff;box-shadow:0 3px 8px -2px rgba(42,157,143,.5)}
.pill.add{background:var(--blue-soft);color:var(--blue)}
.icon-btn{border:0;background:var(--grey-pale);width:32px;height:32px;border-radius:10px;cursor:pointer;display:grid;place-items:center;color:var(--grey-soft);flex:none}
.icon-btn:hover{background:var(--error-soft);color:var(--error)}
.type-fee{margin-top:12px;padding-top:12px;border-top:1px dashed var(--grey-light);display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:12.5px;color:var(--grey-soft)}
.type-fee b{font-size:16px;color:var(--navy);font-weight:600;font-variant-numeric:tabular-nums}
.more{background:none;border:0;color:var(--blue-mid);font-size:12.5px;cursor:pointer;padding:6px 0;font-weight:500}
.field{display:flex;align-items:center;gap:8px;background:linear-gradient(180deg,#fff,#f9fbfd);border:1.5px solid var(--grey-light);border-radius:var(--r-ctl);padding:0 12px;min-height:44px;box-shadow:inset 0 1px 2px rgba(26,46,74,.04)}
.field:focus-within{border-color:var(--teal);box-shadow:0 0 0 3px rgba(42,157,143,.15)}
.field input,.field select{border:0;background:transparent;flex:1;min-width:0;padding:10px 0;outline:none;font-size:16px}
/* iOS / iPadOS zoom into any field below 16px */
input,select,textarea{font-size:16px!important}
.field em{font-style:normal;color:var(--grey-soft);font-size:12.5px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}

.add-btn{width:100%;border:1.5px dashed #b8c5d6;background:linear-gradient(180deg,rgba(255,255,255,.7),rgba(240,244,248,.7));border-radius:16px;
  padding:14px;cursor:pointer;color:var(--blue);font-weight:600;font-size:14px;display:flex;align-items:center;justify-content:center;gap:8px;transition:all .16s}
.add-btn:hover{border-color:var(--teal);color:var(--teal);background:#fff}

/* stepper + slider */
.stepper{display:inline-flex;align-items:center;border-radius:12px;background:linear-gradient(180deg,#e9eef4,#f3f6f9);box-shadow:inset 0 1px 3px rgba(26,46,74,.12);padding:3px}
.stepper button{width:34px;height:34px;border:0;border-radius:9px;background:linear-gradient(180deg,#fff,#f4f7fa);box-shadow:0 1px 2px rgba(26,46,74,.15);cursor:pointer;font-size:18px;color:var(--navy);line-height:1}
.stepper span{min-width:40px;text-align:center;font-weight:600;color:var(--navy);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;-webkit-appearance:none;appearance:none;height:8px;border-radius:999px;background:linear-gradient(90deg,var(--teal) 0%,var(--blue-mid) var(--p,40%),var(--grey-light) var(--p,40%));outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:linear-gradient(145deg,#fff,#e6ecf3);border:2px solid var(--teal);box-shadow:0 3px 8px rgba(26,46,74,.25);cursor:pointer}
input[type=range]::-moz-range-thumb{width:24px;height:24px;border-radius:50%;background:#fff;border:2px solid var(--teal);box-shadow:0 3px 8px rgba(26,46,74,.25);cursor:pointer}

/* change-mode chooser */
.modes{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.mode{border:1.5px solid var(--grey-light);border-radius:14px;padding:12px;cursor:pointer;background:linear-gradient(180deg,#fff,#f6f9fc);text-align:left;box-shadow:var(--sh-1);transition:all .16s}
.mode b{display:block;font-size:13.5px;color:var(--navy);font-weight:600}
.mode span{display:block;font-size:11.5px;color:var(--grey-soft);margin-top:2px}
.mode.on{border-color:var(--teal);background:linear-gradient(160deg,var(--teal-soft),#fff);box-shadow:0 8px 18px -8px rgba(42,157,143,.55)}

/* ---------- Result panel ---------- */
.result{border-radius:22px;overflow:hidden;box-shadow:var(--sh-3);background:#fff;border:1px solid rgba(226,232,240,.8)}
.result-top{padding:20px 20px 18px;color:#fff;position:relative;
  background:radial-gradient(400px 160px at 90% -20%,rgba(59,191,176,.45),transparent 70%),linear-gradient(140deg,#14263d,var(--navy) 45%,var(--blue) 100%)}
.result-top .k{font-size:12px;color:rgba(255,255,255,.7);display:flex;justify-content:space-between;align-items:center}
.result-top .total{font-size:34px;font-weight:700;letter-spacing:-.02em;margin:6px 0 2px;font-variant-numeric:tabular-nums;text-shadow:0 2px 12px rgba(0,0,0,.25)}
.result-top .total small{font-size:15px;font-weight:500;opacity:.75;margin-right:4px}
.result-top .cap{font-size:12px;color:rgba(255,255,255,.7)}
.status{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;padding:5px 10px;border-radius:999px}
.st-ok{background:rgba(154,230,180,.18);color:#c6f6d5;border:1px solid rgba(154,230,180,.35)}
.st-est{background:rgba(190,227,248,.16);color:#d6ecfa;border:1px solid rgba(190,227,248,.35)}
.st-ver{background:rgba(246,224,94,.16);color:#fbe7a1;border:1px solid rgba(246,224,94,.35)}
.st-inc{background:rgba(254,178,178,.16);color:#fed7d7;border:1px solid rgba(254,178,178,.35)}
.bar{display:flex;height:8px;border-radius:999px;overflow:hidden;margin-top:14px;background:rgba(255,255,255,.12)}
.bar i{display:block;height:100%}
.legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:8px;font-size:11.5px;color:rgba(255,255,255,.75)}
.legend span{display:flex;align-items:center;gap:5px}.legend i{width:8px;height:8px;border-radius:2px;display:inline-block}
.lines{padding:6px 20px 4px}
.line{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:12px 0;border-bottom:1px solid var(--grey-pale)}
.line:last-child{border-bottom:0}
.line .t{font-size:13.5px;font-weight:500;color:var(--grey-dark)}
.line .a{font-size:14px;font-weight:600;color:var(--navy);text-align:right;font-variant-numeric:tabular-nums}
.line .r{grid-column:1/-1;font-size:11.5px;color:var(--grey-soft)}
.line .r .thai{font-size:11.5px}
.line.sum{border-top:2px solid var(--grey-light);border-bottom:0;margin-top:2px}
.line.sum .t,.line.sum .a{font-weight:700;color:var(--navy);font-size:14.5px}
.notes{padding:0 20px 16px}
.note{display:flex;gap:10px;padding:10px 12px;border-radius:12px;font-size:12.5px;margin-top:8px;line-height:1.4}
.note svg{width:16px;height:16px;flex:none;margin-top:1px}
.n-warn{background:var(--amber-soft);color:#7a5412}
.n-info{background:var(--blue-soft);color:#1e4d8c}
.n-err{background:var(--error-soft);color:#962d22}
.n-ok{background:var(--green-soft);color:#3f6b4d}
.actions{display:flex;gap:8px;padding:0 20px 18px;flex-wrap:wrap}
.btn{border:0;border-radius:11px;padding:10px 14px;font-weight:600;font-size:13.5px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;transition:all .16s}
.btn svg{width:16px;height:16px}
.btn-p{color:#fff;background:linear-gradient(135deg,var(--teal),#23867a);box-shadow:0 6px 14px -6px rgba(42,157,143,.7),inset 0 1px 0 rgba(255,255,255,.2)}
.btn-p:hover{filter:brightness(1.06)}
.btn-s{color:var(--navy);background:linear-gradient(180deg,#fff,#eef2f7);box-shadow:0 1px 2px rgba(26,46,74,.12),inset 0 0 0 1px var(--grey-light)}
.foot{padding:12px 20px;background:linear-gradient(180deg,#f7f9fc,#eef2f7);font-size:11.5px;color:var(--grey-soft);border-top:1px solid var(--grey-light)}
.empty{padding:26px 20px;text-align:center;color:var(--grey-soft);font-size:13px}

/* timeline */
.tl{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.tl div{border-radius:14px;padding:12px;background:linear-gradient(180deg,#fff,#f4f8fb);border:1px solid var(--grey-light);box-shadow:var(--sh-1)}
.tl small{display:block;font-size:11.5px;color:var(--grey-soft)}
.tl b{display:block;font-size:14.5px;color:var(--navy);margin-top:3px}
.tl .hl{background:linear-gradient(160deg,var(--teal-soft),#fff);border-color:rgba(42,157,143,.4)}

/* inspection rows */
.act{border-radius:16px;padding:14px;margin-bottom:12px;background:linear-gradient(180deg,#fff,#f8fafd);border:1px solid var(--grey-light);box-shadow:var(--sh-1)}
.act-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.act-h b{color:var(--navy);font-size:14px}
.act-calc{margin-top:12px;padding:10px 12px;border-radius:12px;background:linear-gradient(90deg,var(--blue-soft),#f2f7fc);font-size:13px;color:var(--blue);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.act-calc b{color:var(--navy);font-variant-numeric:tabular-nums}
.people{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.people .pc{border-radius:12px;padding:10px;background:var(--grey-pale);display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.people .pc small{font-size:11.5px;color:var(--grey-soft)}

/* settings radio cards */
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;border:1.5px solid var(--grey-light);border-radius:14px;padding:14px;cursor:pointer;background:linear-gradient(180deg,#fff,#f7f9fc);box-shadow:var(--sh-1);text-align:left}
.opt .rd{width:20px;height:20px;border-radius:50%;border:2px solid #b8c5d6;flex:none;margin-top:1px;display:grid;place-items:center;background:#fff}
.opt.on{border-color:var(--teal);background:linear-gradient(160deg,var(--teal-soft),#fff)}
.opt.on .rd{border-color:var(--teal)}
.opt.on .rd::after{content:"";width:10px;height:10px;border-radius:50%;background:linear-gradient(145deg,var(--teal-lt),var(--teal))}
.opt b{display:block;color:var(--navy);font-size:14px}
.opt span{display:block;font-size:12.5px;color:var(--grey-soft);margin-top:2px}
.tag{font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:3px 7px;border-radius:6px;background:var(--navy);color:#fff;margin-left:6px;vertical-align:1px}

/* tables */
.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:13px;overflow:hidden;border-radius:12px;border:1px solid var(--grey-light)}
.tbl th{background:linear-gradient(180deg,#f4f7fb,#e9eef5);color:var(--grey-mid);font-weight:600;font-size:12px;text-align:left;padding:9px 10px}
.tbl td{padding:9px 10px;border-top:1px solid var(--grey-pale);vertical-align:top}
.tbl td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl tr:nth-child(even) td{background:#fafcfe}
.tbl .ref{font-size:11.5px;color:var(--grey-soft)}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.tests{max-height:320px;overflow:auto;border-radius:12px;border:1px solid var(--grey-light)}
.tests div{display:grid;grid-template-columns:62px 1fr auto;gap:8px;padding:7px 10px;font-size:12px;border-top:1px solid var(--grey-pale)}
.tests div:first-child{border-top:0}
.ok{color:var(--green);font-weight:600}.no{color:var(--error);font-weight:600}

.banner{max-width:1180px;margin:14px auto 0;padding:0 16px}
.banner > div{border-radius:14px;padding:12px 14px;font-size:13px;display:flex;gap:10px;align-items:center;box-shadow:var(--sh-1)}

/* mini bar (mobile) */
.mini{display:none}
.toast{position:fixed;left:50%;bottom:calc(24px + var(--nav-h) + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);opacity:0;
  background:linear-gradient(135deg,var(--navy),var(--blue));color:#fff;padding:10px 16px;border-radius:12px;box-shadow:var(--sh-3);font-size:13px;transition:all .25s;z-index:80;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* operator bar */
.opwrap{max-width:1180px;margin:16px auto 0;padding:0 16px}
.opbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 14px;border-radius:16px;
  background:linear-gradient(180deg,#fff,#f6f9fc);border:1px solid var(--grey-light);box-shadow:var(--sh-1)}
.opbar .op-ic{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;flex:none;color:#fff;
  background:linear-gradient(145deg,var(--blue-mid),var(--navy));box-shadow:0 4px 10px rgba(30,77,140,.3)}
.opbar .op-ic svg{width:20px;height:20px}
.opbar .op-l{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--grey-soft);font-weight:600}
.opsel{flex:1;min-width:220px;position:relative}
.opsel select{width:100%;appearance:none;-webkit-appearance:none;border:1.5px solid var(--grey-light);border-radius:12px;padding:11px 40px 11px 12px;
  background:linear-gradient(180deg,#fff,#f8fafc);font-size:15px;font-weight:600;color:var(--navy);cursor:pointer;box-shadow:inset 0 1px 2px rgba(26,46,74,.04)}
.opsel select:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px rgba(42,157,143,.15)}
.opsel::after{content:"";position:absolute;right:16px;top:50%;width:8px;height:8px;border-right:2px solid var(--grey-mid);border-bottom:2px solid var(--grey-mid);transform:translateY(-70%) rotate(45deg);pointer-events:none}
.opsel.empty select{color:var(--grey-soft);font-weight:500}
.opadd{display:flex;gap:8px;flex:1;min-width:240px;flex-wrap:wrap}
.opadd .field{flex:1;min-width:200px}

/* summary */
.sum-hero{border-radius:22px;padding:22px;color:#fff;box-shadow:var(--sh-3);margin-bottom:18px;position:relative;overflow:hidden;
  background:radial-gradient(500px 220px at 95% -30%,rgba(59,191,176,.45),transparent 70%),linear-gradient(135deg,#14263d,var(--navy) 45%,var(--blue) 100%)}
.sum-hero .op{font-size:20px;font-weight:600;letter-spacing:-.01em;margin:4px 0 2px}
.sum-hero .meta{font-size:12.5px;color:rgba(255,255,255,.75);display:flex;gap:14px;flex-wrap:wrap;margin-top:6px}
.sum-hero .big{display:flex;gap:28px;flex-wrap:wrap;margin-top:18px;align-items:flex-end}
.sum-hero .big div small{display:block;font-size:12px;color:rgba(255,255,255,.7)}
.sum-hero .big div b{display:block;font-size:30px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.sum-hero .big div.sec b{font-size:20px;font-weight:600;opacity:.92}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:18px}
.kpi{border-radius:16px;padding:14px 16px;background:linear-gradient(180deg,#fff,#f6f9fc);border:1px solid var(--grey-light);box-shadow:var(--sh-1);position:relative;overflow:hidden}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c,var(--teal))}
.kpi small{display:block;font-size:12px;color:var(--grey-soft)}
.kpi b{display:block;font-size:19px;color:var(--navy);margin-top:4px;font-variant-numeric:tabular-nums}
.kpi span{display:block;font-size:11.5px;color:var(--grey-soft);margin-top:2px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--grey-pale);color:var(--grey-mid)}
.chip.p{background:var(--teal-soft);color:#1f7d72}
.chg{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--grey-pale);align-items:flex-start}
.chg:first-child{border-top:0}
.chg b{color:var(--navy);font-size:14px}.chg .r{font-size:12px;color:var(--grey-soft)}
.chg .amt{font-weight:600;color:var(--navy);white-space:nowrap;font-variant-numeric:tabular-nums}
.sum-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.btn-lg{padding:13px 18px;font-size:14.5px;border-radius:13px}


/* language switch */
.rpt{display:inline-flex;align-items:center;gap:6px;flex:none;margin-left:10px;padding:7px 12px;border-radius:999px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.10);color:#fff;font-size:12.5px;font-weight:600;cursor:pointer}
.rpt svg{width:16px;height:16px}.rpt:hover{background:rgba(255,255,255,.18)}
@media (max-width:959px){ .rpt{margin-left:auto}.rpt+.langsw{margin-left:8px} }
@media (max-width:600px){ .rpt{padding:7px 9px}.rpt span{display:none} }
@media print{ .rpt{display:none!important} }
.langsw{display:flex;padding:3px;border-radius:999px;background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.2);margin-left:10px;flex:none}
.langsw button{border:0;background:transparent;color:rgba(255,255,255,.8);padding:6px 11px;border-radius:999px;font-size:12.5px;font-weight:600;cursor:pointer}
.langsw button.on{background:#fff;color:var(--navy);box-shadow:0 2px 6px rgba(0,0,0,.2)}
.hero h1{line-height:1.25}
/* summary mode bar */
.modebar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
/* simple composition blocks */
.cbar{display:flex;height:12px;border-radius:999px;overflow:hidden;margin:4px 0 16px;box-shadow:inset 0 1px 2px rgba(26,46,74,.15)}
.cbar i{display:block;height:100%}
.blocks{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.blk{border-radius:16px;padding:14px 16px 12px;background:linear-gradient(180deg,#fff,#f6f9fc);border:1px solid var(--grey-light);box-shadow:var(--sh-1);border-top:4px solid var(--c);display:flex;flex-direction:column;gap:4px}
.blk.direct{border-style:dashed;border-top-style:solid;background:linear-gradient(180deg,#fbfcfd,#f3f6f9)}
.blk-k{font-size:12.5px;font-weight:600;color:var(--grey-mid);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.dtag{font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:999px;background:var(--grey-pale);color:var(--grey-mid)}
.blk-a{font-size:21px;font-weight:700;color:var(--navy);font-variant-numeric:tabular-nums;display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.blk-a span{font-size:12px;font-weight:600;color:var(--grey-soft)}
.blk-s{font-size:12px;color:var(--grey-mid)}
.blk-r{font-size:11px;color:var(--grey-soft);margin-top:auto;padding-top:6px;border-top:1px dashed var(--grey-light)}
.btot{display:flex;gap:12px;flex-wrap:wrap;margin-top:14px}
.btot>div{flex:1;min-width:200px;border-radius:16px;padding:14px 16px;color:#fff;background:linear-gradient(135deg,#14263d,var(--navy) 50%,var(--blue));box-shadow:var(--sh-2)}
.btot>div.alt{background:linear-gradient(135deg,#1f7d72,var(--teal))}
.btot small{display:block;font-size:12px;opacity:.75}.btot b{display:block;font-size:24px;font-variant-numeric:tabular-nums}.btot span{font-size:11.5px;opacity:.7}
/* print: simple composition */
.rp-cbar{display:flex;height:9px;border-radius:5px;overflow:hidden;margin:2px 0 10px}
.rp-cbar i{display:block;height:100%}
.rp-blocks{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rp-blk{border:1px solid #d9e1ea;border-top:3px solid var(--c);border-radius:7px;padding:8px 10px;background:#fafbfd;break-inside:avoid}
.rp-blk.direct{border-style:dashed;border-top-style:solid}
.rp-blk .k{font-size:9px;font-weight:600;color:#4a5568}
.rp-blk .a{font-size:15px;font-weight:700;color:#1a2e4a;margin:2px 0;font-variant-numeric:tabular-nums}
.rp-blk .a span{font-size:9px;font-weight:600;color:#718096}
.rp-blk .s{font-size:8.5px;color:#4a5568}
.rp-blk .r{font-size:8px;color:#718096;margin-top:4px;padding-top:4px;border-top:1px dashed #d9e1ea}
.rp-tot{display:flex;gap:8px;margin-top:10px}
.rp-tot>div{flex:1;border:1px solid #d9e1ea;border-radius:8px;padding:9px 12px;background:#f7f9fc}
.rp-tot>div:first-child,.rp-tot>div.m{background:linear-gradient(135deg,#1a2e4a,#1e4d8c);border-color:#1a2e4a;color:#fff}
.rp-tot small{display:block;font-size:8.5px;text-transform:uppercase;letter-spacing:.05em;font-weight:600;opacity:.8}
.rp-tot b{display:block;font-size:17px;font-variant-numeric:tabular-nums}
.rp[lang=th],.rp:lang(th){font-family:'Noto Sans Thai','Inter',sans-serif}
@media (max-width:959px){ .langsw{margin-left:auto} }


/* Thai: no letter-spacing or uppercase tracking on Thai script */
html[lang=th] .eyebrow,html[lang=th] .op-l,html[lang=th] .tag,
.rp[lang=th] h3,.rp[lang=th] .rp-org,.rp[lang=th] .rp-kpi small,.rp[lang=th] .rp-sign small,.rp[lang=th] .rp-tot small{letter-spacing:0;text-transform:none}
.rp[lang=th]{font-size:11px}


/* aircraft type picker */
.type-h .acsel{flex:1;min-width:0}
.type-h .acsel select{padding:9px 36px 9px 10px;font-size:16px}
.autochip{display:flex;gap:10px;align-items:flex-start;margin-top:10px;padding:10px 12px;border-radius:12px;background:linear-gradient(90deg,var(--teal-soft),#f2faf8);color:#1f6b62;font-size:12.5px;flex-wrap:wrap}
.autochip svg{width:16px;height:16px;flex:none;margin-top:2px}
.autochip>div{flex:1;min-width:200px;display:flex;flex-direction:column;gap:2px}
.autochip b{color:var(--navy);font-size:13px}
.autochip span{color:#2f6f66}.autochip .mg{color:var(--grey-soft);font-size:11.5px}
.autochip .btn{padding:7px 11px;font-size:12.5px}


.fleetline{flex-basis:100%;display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 12px;border-radius:12px;background:linear-gradient(90deg,var(--blue-soft),#f3f7fc);color:var(--blue);font-size:12.5px}
.fleetline svg{width:18px;height:18px;flex:none}.fleetline span{flex:1;min-width:200px}.fleetline .btn{padding:7px 12px;font-size:12.5px}
.fleetline.muted{background:var(--grey-pale);color:var(--grey-mid)}
.autochip.src{background:linear-gradient(90deg,var(--blue-soft),#f4f8fc);color:var(--blue)}.autochip.src b{color:var(--navy)}.autochip.src span{color:#2c548c}
.autochip.grp{background:linear-gradient(90deg,var(--green-soft),#f5f9f6)}.autochip.grp span{color:#3f6b4d}

/* ---------- Mobile ---------- */
@media (max-width:959px){
  :root{--nav-h:68px}
  .shell{grid-template-columns:minmax(0,1fr);margin-top:16px}
  .side{position:static}
  .hero{padding-bottom:22px}
  .badge{display:none}
  .nav{position:fixed;left:0;right:0;bottom:0;margin:0;padding:0;z-index:60}
  .nav-in{width:100%;border-radius:20px 20px 0 0;justify-content:space-around;padding:6px 6px calc(6px + env(safe-area-inset-bottom));
    background:linear-gradient(180deg,rgba(255,255,255,.94),rgba(244,247,250,.97));box-shadow:0 -8px 30px rgba(26,46,74,.14)}
  .nav button{flex-direction:column;gap:3px;padding:8px 4px;font-size:10.5px;flex:1;border-radius:12px}
  .nav button svg{width:22px;height:22px}
  .nav button span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  .mini{display:flex;position:fixed;left:12px;right:12px;bottom:calc(var(--nav-h) + 10px + env(safe-area-inset-bottom));z-index:55;
    border-radius:16px;padding:10px 14px;align-items:center;gap:10px;color:#fff;cursor:pointer;
    background:linear-gradient(135deg,rgba(20,38,61,.96),rgba(30,77,140,.96));box-shadow:var(--sh-3);backdrop-filter:blur(8px)}
  .mini.hide{display:none}
  .mini .mv{margin-left:auto;font-weight:700;font-size:17px;font-variant-numeric:tabular-nums}
  .mini small{font-size:11px;opacity:.75;display:block}
  body{padding-bottom:calc(var(--nav-h) + 76px + env(safe-area-inset-bottom))}
}
@media (max-width:520px){
  .tiles.three{grid-template-columns:1fr}
  .grid2{grid-template-columns:1fr}
  .tl{grid-template-columns:1fr}
  .card{padding:16px}
  .result-top .total{font-size:30px}
  .hero h1{font-size:17px}
}

/* ---------- Print ---------- */
#print{display:none}
@page{size:A4;margin:12mm 13mm 14mm}
@media print{
  html,body{background:#fff!important;padding:0!important}
  .hero,.nav,.shell,.mini,.banner,.toast,.opwrap{display:none!important}
  #print{display:block}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
.rp{font-family:'Inter','Noto Sans Thai',sans-serif;color:#1f2a37;font-size:10.5px;line-height:1.45}

/* =====================================================================
   Section themes: each tab has its own pastel family (blue, turquoise,
   muted green, periwinkle blue, slate grey, steel blue). No neon.
   ===================================================================== */
@property --sec-glow{syntax:'<color>';inherits:true;initial-value:rgba(37,99,168,.18)}
@property --sec-tint{syntax:'<color>';inherits:true;initial-value:#f4f8fd}
@property --sec-soft{syntax:'<color>';inherits:true;initial-value:#e3eefa}
body{--sec:#2563a8;--sec-2:#1e4d8c;--sec-lt:#7aa9de;--sec-soft:#e3eefa;--sec-tint:#f4f8fd;--sec-glow:rgba(37,99,168,.18);
  transition:--sec-glow .6s ease,--sec-tint .6s ease,--sec-soft .6s ease;
  background:
    radial-gradient(1100px 620px at 105% -8%,var(--sec-glow),transparent 62%),
    radial-gradient(900px 520px at -12% 18%,rgba(42,157,143,.10),transparent 60%),
    radial-gradient(800px 600px at 50% 120%,var(--sec-glow),transparent 65%),
    linear-gradient(180deg,var(--sec-tint) 0%,#f4f7fa 45%,var(--sec-tint) 100%);
  background-attachment:fixed}
body[data-sec=change]  {--sec:#2a9d8f;--sec-2:#1f7d72;--sec-lt:#76cdc2;--sec-soft:#dcf3ef;--sec-tint:#f1faf8;--sec-glow:rgba(42,157,143,.20)}
body[data-sec=insp]    {--sec:#5f8f6f;--sec-2:#46725a;--sec-lt:#9cc4a8;--sec-soft:#e3f0e6;--sec-tint:#f4f9f5;--sec-glow:rgba(95,143,111,.20)}
body[data-sec=sum]     {--sec:#4c6fb3;--sec-2:#30508f;--sec-lt:#9bb1e0;--sec-soft:#e5eaf8;--sec-tint:#f4f6fc;--sec-glow:rgba(76,111,179,.20)}
body[data-sec=settings]{--sec:#5c6f86;--sec-2:#425369;--sec-lt:#a3b1c3;--sec-soft:#e8ecf1;--sec-tint:#f5f7f9;--sec-glow:rgba(92,111,134,.18)}
body[data-sec=ref]     {--sec:#3a86a8;--sec-2:#2a6683;--sec-lt:#86c2da;--sec-soft:#dff0f6;--sec-tint:#f2f9fc;--sec-glow:rgba(58,134,168,.20)}

/* hero: layered aurora + fine grid for depth */
.hero{background:
   radial-gradient(600px 240px at 85% 0%,color-mix(in srgb,var(--sec-lt) 45%,transparent),transparent 70%),
   linear-gradient(135deg,#0f1d30 0%,var(--navy) 32%,var(--blue) 72%,#24679a 100%)}
.hero .grid{position:absolute;inset:0;pointer-events:none;opacity:.35;
  background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);
  background-size:28px 28px;-webkit-mask-image:linear-gradient(180deg,#000,transparent 85%);mask-image:linear-gradient(180deg,#000,transparent 85%)}
.hero .aur{position:absolute;border-radius:50%;filter:blur(38px);opacity:.55;pointer-events:none}
.hero .aur.a1{width:340px;height:200px;right:6%;top:-60px;background:radial-gradient(closest-side,rgba(59,191,176,.75),transparent);animation:drift 14s ease-in-out infinite alternate}
.hero .aur.a2{width:300px;height:180px;left:18%;bottom:-90px;background:radial-gradient(closest-side,color-mix(in srgb,var(--sec-lt) 85%,#fff),transparent);animation:drift 18s ease-in-out infinite alternate-reverse}
@keyframes drift{from{transform:translate(0,0) scale(1)}to{transform:translate(-40px,18px) scale(1.12)}}
@media (prefers-reduced-motion:reduce){.hero .aur{animation:none}}
.logo{background:linear-gradient(145deg,#7fd8cc,var(--teal) 55%,#1a6e65);box-shadow:0 10px 22px rgba(0,0,0,.32),inset 0 1px 0 rgba(255,255,255,.45),inset 0 -3px 6px rgba(0,0,0,.18)}

/* nav: every tab carries its own colour */
.nav button[data-val=cert]{--c:#2563a8;--c2:#1e4d8c;--cs:#e3eefa}
.nav button[data-val=change]{--c:#2a9d8f;--c2:#1f7d72;--cs:#dcf3ef}
.nav button[data-val=insp]{--c:#5f8f6f;--c2:#46725a;--cs:#e3f0e6}
.nav button[data-val=sum]{--c:#4c6fb3;--c2:#30508f;--cs:#e5eaf8}
.nav button[data-val=settings]{--c:#5c6f86;--c2:#425369;--cs:#e8ecf1}
.nav button[data-val=ref]{--c:#3a86a8;--c2:#2a6683;--cs:#dff0f6}
.nav button svg{color:var(--c)}
.nav button:hover{background:var(--cs);color:var(--c2)}
.nav button.on{color:#fff;background:linear-gradient(140deg,color-mix(in srgb,var(--c) 70%,#fff) -10%,var(--c) 45%,var(--c2) 100%);
  box-shadow:0 8px 18px -6px color-mix(in srgb,var(--c) 70%,transparent),inset 0 1px 0 rgba(255,255,255,.28),inset 0 -2px 4px rgba(0,0,0,.12)}
.nav button.on svg{color:#fff}

/* section head ribbon */
.sechead{position:relative;overflow:hidden;border-radius:22px;padding:18px 20px;margin-bottom:18px;display:flex;align-items:center;gap:16px;
  background:
    radial-gradient(260px 140px at 100% 0%,rgba(255,255,255,.85),transparent 70%),
    linear-gradient(135deg,var(--sec-soft) 0%,color-mix(in srgb,var(--sec-soft) 55%,#fff) 60%,#fff 100%);
  border:1px solid color-mix(in srgb,var(--sec) 22%,#fff);
  box-shadow:0 1px 0 #fff inset,0 18px 36px -22px color-mix(in srgb,var(--sec) 75%,transparent),0 2px 6px rgba(26,46,74,.05)}
.sechead::before,.sechead::after{content:"";position:absolute;border-radius:50%;pointer-events:none}
.sechead::before{width:180px;height:180px;right:-40px;top:-90px;background:radial-gradient(closest-side,color-mix(in srgb,var(--sec-lt) 55%,transparent),transparent)}
.sechead::after{width:120px;height:120px;right:90px;bottom:-80px;background:radial-gradient(closest-side,color-mix(in srgb,var(--sec) 22%,transparent),transparent)}
.sechead .orb{width:52px;height:52px;border-radius:16px;flex:none;display:grid;place-items:center;color:#fff;position:relative;z-index:1;
  background:linear-gradient(145deg,var(--sec-lt) -10%,var(--sec) 50%,var(--sec-2) 100%);
  box-shadow:0 12px 22px -8px color-mix(in srgb,var(--sec) 80%,transparent),inset 0 1px 0 rgba(255,255,255,.45),inset 0 -3px 6px rgba(0,0,0,.15)}
.sechead .orb svg{width:26px;height:26px}
.sechead .tx{position:relative;z-index:1;min-width:0}
.sechead .ey{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--sec-2);opacity:.85}
.sechead h2{margin:2px 0 2px;font-size:20px;font-weight:700;color:var(--navy);letter-spacing:-.015em}
.sechead p{margin:0;font-size:13px;color:var(--grey-mid)}
html[lang=th] .sechead .ey{letter-spacing:0;text-transform:none}

/* cards: pastel tint, accent strip, layered depth */
.card{background:linear-gradient(180deg,#fff 0%,#fff 40%,var(--sec-tint) 100%);border:1px solid color-mix(in srgb,var(--sec) 12%,#e2e8f0);
  box-shadow:inset 0 1px 0 #fff,0 1px 2px rgba(26,46,74,.05),0 12px 30px -14px color-mix(in srgb,var(--sec) 45%,transparent),0 30px 60px -40px rgba(26,46,74,.25);
  transition:box-shadow .25s,transform .25s}
.card::before{content:"";position:absolute;left:18px;right:18px;top:0;height:3px;border-radius:0 0 4px 4px;
  background:linear-gradient(90deg,var(--sec-lt),var(--sec) 50%,var(--sec-2))}
@media (hover:hover){.card:hover{box-shadow:inset 0 1px 0 #fff,0 1px 2px rgba(26,46,74,.05),0 18px 38px -14px color-mix(in srgb,var(--sec) 55%,transparent),0 36px 70px -40px rgba(26,46,74,.3)}}
.card h2{display:flex;align-items:center;gap:8px}
.card h2::before{content:"";width:8px;height:18px;border-radius:4px;flex:none;background:linear-gradient(180deg,var(--sec-lt),var(--sec-2));box-shadow:0 2px 6px -1px color-mix(in srgb,var(--sec) 60%,transparent)}
.eyebrow{color:var(--sec-2)}

/* controls follow the section colour */
.tile .ic{background:linear-gradient(145deg,#fff,var(--sec-soft));color:var(--sec-2);box-shadow:inset 0 1px 0 #fff,0 2px 6px -1px color-mix(in srgb,var(--sec) 35%,transparent)}
.tile:hover{border-color:color-mix(in srgb,var(--sec) 35%,#e2e8f0)}
.tile.on{background:linear-gradient(140deg,color-mix(in srgb,var(--sec) 75%,#fff) -15%,var(--sec) 35%,var(--sec-2) 85%,var(--navy) 130%);
  box-shadow:0 14px 26px -12px color-mix(in srgb,var(--sec) 85%,transparent),inset 0 1px 0 rgba(255,255,255,.25),inset 0 -3px 8px rgba(0,0,0,.12)}
.tile.on .ic{background:linear-gradient(145deg,rgba(255,255,255,.95),rgba(255,255,255,.75));color:var(--sec-2)}
.cat svg{color:var(--sec)}
.cat.on,.mode.on,.opt.on{background:linear-gradient(160deg,var(--sec-soft),#fff 85%);border-color:var(--sec);box-shadow:0 10px 20px -10px color-mix(in srgb,var(--sec) 70%,transparent),inset 0 1px 0 #fff}
.cat.on svg{color:var(--sec-2)}
.opt.on .rd{border-color:var(--sec)}.opt.on .rd::after{background:linear-gradient(145deg,var(--sec-lt),var(--sec-2))}
.field:focus-within,.opsel select:focus{border-color:var(--sec);box-shadow:0 0 0 3px color-mix(in srgb,var(--sec) 18%,transparent)}
.btn-p{background:linear-gradient(140deg,color-mix(in srgb,var(--sec) 65%,#fff) -20%,var(--sec) 40%,var(--sec-2) 100%);
  box-shadow:0 10px 18px -8px color-mix(in srgb,var(--sec) 85%,transparent),inset 0 1px 0 rgba(255,255,255,.3),inset 0 -2px 4px rgba(0,0,0,.12)}
.btn-p:hover{filter:brightness(1.06);transform:translateY(-1px)}
.btn-s:hover{background:linear-gradient(180deg,#fff,var(--sec-soft))}
.add-btn{color:var(--sec-2);border-color:color-mix(in srgb,var(--sec) 35%,#c8d3e0);background:linear-gradient(180deg,rgba(255,255,255,.8),var(--sec-tint))}
.add-btn:hover{border-color:var(--sec);color:var(--sec);background:#fff}
.type{background:linear-gradient(180deg,#fff,var(--sec-tint));box-shadow:inset 0 1px 0 #fff,0 8px 20px -14px color-mix(in srgb,var(--sec) 60%,transparent),0 1px 2px rgba(26,46,74,.06)}
.type-h .num{background:linear-gradient(145deg,var(--sec-lt) -20%,var(--sec) 45%,var(--sec-2));box-shadow:0 5px 10px -3px color-mix(in srgb,var(--sec) 75%,transparent),inset 0 1px 0 rgba(255,255,255,.35)}
.act{background:linear-gradient(180deg,#fff,var(--sec-tint));box-shadow:inset 0 1px 0 #fff,0 8px 20px -14px color-mix(in srgb,var(--sec) 60%,transparent)}
.act-calc{background:linear-gradient(90deg,var(--sec-soft),#fff);color:var(--sec-2)}
.tl .hl{background:linear-gradient(160deg,var(--sec-soft),#fff);border-color:color-mix(in srgb,var(--sec) 40%,#fff)}
.tbl th{background:linear-gradient(180deg,#fff,var(--sec-soft));color:var(--sec-2)}
.kpi{background:linear-gradient(180deg,#fff,var(--sec-tint));box-shadow:inset 0 1px 0 #fff,0 10px 22px -14px color-mix(in srgb,var(--sec) 55%,transparent)}
.blk{background:linear-gradient(180deg,#fff,color-mix(in srgb,var(--c) 7%,#fff));box-shadow:inset 0 1px 0 #fff,0 10px 22px -14px color-mix(in srgb,var(--c) 60%,transparent)}
.opbar{background:linear-gradient(120deg,#fff 0%,#fff 55%,var(--sec-soft) 140%);border-color:color-mix(in srgb,var(--sec) 18%,#e2e8f0);
  box-shadow:inset 0 1px 0 #fff,0 10px 26px -16px color-mix(in srgb,var(--sec) 55%,transparent)}
.opbar .op-ic{background:linear-gradient(145deg,var(--sec-lt) -20%,var(--sec) 45%,var(--sec-2));box-shadow:0 8px 16px -6px color-mix(in srgb,var(--sec) 75%,transparent),inset 0 1px 0 rgba(255,255,255,.35)}

/* result + summary hero take on the section glow */
.result{box-shadow:0 2px 4px rgba(26,46,74,.06),0 24px 50px -18px color-mix(in srgb,var(--sec) 55%,transparent),0 40px 80px -50px rgba(26,46,74,.35)}
.result-top,.sum-hero{background:
   radial-gradient(420px 200px at 92% -25%,color-mix(in srgb,var(--sec-lt) 70%,transparent),transparent 70%),
   radial-gradient(300px 160px at -10% 120%,rgba(59,191,176,.28),transparent 70%),
   linear-gradient(140deg,#0f1d30,var(--navy) 40%,var(--sec-2) 100%)}
.result-top::after,.sum-hero::after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:inherit;
  background:linear-gradient(180deg,rgba(255,255,255,.10),transparent 40%);}
.result-top .total,.sum-hero .big div b{background:linear-gradient(180deg,#fff 30%,color-mix(in srgb,var(--sec-lt) 40%,#fff));-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none;filter:drop-shadow(0 3px 10px rgba(0,0,0,.25))}
.btot>div{background:linear-gradient(140deg,#0f1d30,var(--navy) 45%,var(--sec-2))}
.mini{background:linear-gradient(135deg,rgba(15,29,48,.96),color-mix(in srgb,var(--sec-2) 92%,transparent))!important}
.toast{background:linear-gradient(135deg,var(--navy),var(--sec-2))}
@media (max-width:959px){ .nav-in{background:linear-gradient(180deg,rgba(255,255,255,.95),color-mix(in srgb,var(--sec-soft) 70%,#fff))}
  .sechead{padding:14px 16px;border-radius:18px}.sechead .orb{width:44px;height:44px;border-radius:14px}.sechead h2{font-size:17px}.sechead p{font-size:12.5px} }

/* ---------- Renewal pipeline ---------- */
body[data-sec=pipe]{--sec:#3e6a9e;--sec-2:#2b4f7d;--sec-lt:#93b4d9;--sec-soft:#e2ebf6;--sec-tint:#f3f7fb;--sec-glow:rgba(62,106,158,.20)}
.nav button[data-val=pipe]{--c:#3e6a9e;--c2:#2b4f7d;--cs:#e2ebf6}
.redbox{display:flex;gap:12px;align-items:flex-start;border-radius:16px;padding:14px 16px;margin-bottom:16px;color:#8a2a20;font-size:13.5px;line-height:1.5;
  background:linear-gradient(180deg,#fdf1f0,#fbe3e1);border:1.5px solid rgba(192,57,43,.45);box-shadow:0 10px 24px -16px rgba(192,57,43,.7),inset 0 1px 0 #fff}
.redbox svg{width:22px;height:22px;flex:none;color:#c0392b;margin-top:1px}
.redbox b{display:block;color:#a8322a;font-size:14.5px;margin-bottom:2px}
.pkpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}
.pk{border-radius:16px;padding:14px 16px;position:relative;overflow:hidden;background:linear-gradient(180deg,#fff,var(--k2));border:1px solid color-mix(in srgb,var(--k) 22%,#fff);
  box-shadow:inset 0 1px 0 #fff,0 12px 26px -16px color-mix(in srgb,var(--k) 70%,transparent)}
.pk::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(180deg,color-mix(in srgb,var(--k) 55%,#fff),var(--k))}
.pk small{display:block;font-size:12px;color:var(--grey-mid);font-weight:600}
.pk b{display:block;font-size:28px;font-weight:700;color:var(--k);letter-spacing:-.02em;line-height:1.15;margin-top:2px;font-variant-numeric:tabular-nums}
.pk b i{font-style:normal;font-size:.55em;margin-right:2px;opacity:.75}
.pk span{font-size:12px;color:var(--grey-soft)}
.k-red{--k:#b23a2e;--k2:#fcefed}.k-amber{--k:#a8741a;--k2:#fbf4e6}.k-blue{--k:#2f5f9a;--k2:#ebf1f9}.k-sum{--k:#2b4f7d;--k2:#e8eef7}
.k-sum b{font-size:22px}
.ptool{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:12px}
.ptool .seg{flex:0 1 560px}
.pcol{display:flex;flex-wrap:wrap;align-items:center;gap:6px 18px;padding:12px 16px;margin-bottom:12px;border-radius:16px;background:linear-gradient(180deg,#fff,#e9f5f3);border:1px solid #cde6e1}
.pcol small{display:block;font-size:11.5px;color:var(--grey-soft)}.pcol b{font-size:20px;color:var(--navy);font-variant-numeric:tabular-nums}.pcol b i{font-style:normal;font-size:.7em;margin-right:2px;color:var(--grey-mid)}
.pcol span{font-size:12.5px;color:var(--grey-mid)}
.plist{display:flex;flex-direction:column;gap:10px}
.prow{display:grid;grid-template-columns:64px minmax(0,1fr) auto auto;gap:14px;align-items:center;padding:12px 14px;border-radius:16px;position:relative;
  background:linear-gradient(180deg,#fff,color-mix(in srgb,var(--b) 5%,#fff));border:1px solid color-mix(in srgb,var(--b) 18%,#e2e8f0);
  box-shadow:inset 0 1px 0 #fff,0 10px 22px -16px color-mix(in srgb,var(--b) 65%,transparent);transition:transform .15s,box-shadow .2s}
@media (hover:hover){.prow:hover{transform:translateY(-1px);box-shadow:inset 0 1px 0 #fff,0 16px 28px -16px color-mix(in srgb,var(--b) 75%,transparent)}}
.prow.slim{grid-template-columns:minmax(0,1fr) auto}
.b-red{--b:#b23a2e}.b-amber{--b:#a8741a}.b-blue{--b:#2f5f9a}.b-green{--b:#4f7f5f}.b-grey{--b:#7a8797}
.pdate{width:64px;height:66px;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;line-height:1.05;
  background:linear-gradient(150deg,color-mix(in srgb,var(--b) 60%,#fff) -10%,var(--b) 55%,color-mix(in srgb,var(--b) 75%,#000));
  box-shadow:0 8px 16px -8px color-mix(in srgb,var(--b) 85%,transparent),inset 0 1px 0 rgba(255,255,255,.35)}
.pdate b{font-size:22px;font-weight:700}.pdate span{font-size:11.5px;font-weight:600;opacity:.95}.pdate small{font-size:10px;opacity:.8}
.pop{font-weight:700;color:var(--navy);font-size:14.5px;overflow-wrap:anywhere}
.pmeta{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin-top:4px;font-size:12px;color:var(--grey-soft)}
.pmeta .mono{font-size:11.5px;color:var(--grey-mid)}
.pmeta .pcd{font-weight:600;color:var(--grey-mid)}
.pchip{display:inline-flex;align-items:center;padding:2px 8px;border-radius:999px;font-size:11.5px;font-weight:700;color:var(--b);background:color-mix(in srgb,var(--b) 11%,#fff);border:1px solid color-mix(in srgb,var(--b) 25%,#fff)}
.pfee{text-align:right;min-width:150px}
.pfee small{display:block;font-size:11px;color:var(--grey-soft)}
.pfee b{font-size:18px;font-weight:700;color:var(--navy);font-variant-numeric:tabular-nums}
.pfee b i{font-style:normal;font-size:.7em;margin-right:2px;color:var(--grey-mid)}
.pneed{display:inline-block;font-size:12px;font-weight:700;color:#7a5412;background:var(--amber-soft);padding:4px 9px;border-radius:9px}
.pact{display:flex;gap:6px}
.ib{width:38px;height:38px;border-radius:11px;border:1px solid #d5dde8;background:linear-gradient(180deg,#fff,#f1f5f9);color:var(--sec-2);display:grid;place-items:center;cursor:pointer;
  box-shadow:inset 0 1px 0 #fff,0 2px 5px rgba(26,46,74,.08)}
.ib svg{width:19px;height:19px}
.ib:hover{border-color:var(--sec);background:#fff}
.ib-go{color:#fff;border-color:transparent;background:linear-gradient(145deg,var(--sec-lt) -20%,var(--sec) 45%,var(--sec-2));box-shadow:0 6px 12px -5px color-mix(in srgb,var(--sec) 80%,transparent),inset 0 1px 0 rgba(255,255,255,.3)}
.ib-go:hover{filter:brightness(1.07);background:linear-gradient(145deg,var(--sec-lt) -20%,var(--sec) 45%,var(--sec-2))}
.pempty{padding:28px;text-align:center;color:var(--grey-soft);border:1.5px dashed #c8d3e0;border-radius:16px;background:rgba(255,255,255,.6)}
.pnote{font-size:12px;color:var(--grey-soft);margin:16px 2px 0;line-height:1.5}
@media (max-width:959px){
  .pkpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .prow{grid-template-columns:56px minmax(0,1fr) auto;gap:10px 12px}
  .pdate{width:56px;height:60px}.pdate b{font-size:19px}
  .pfee{grid-column:2/3;text-align:left;min-width:0}
  .pact{grid-row:1/3;grid-column:3;flex-direction:column}
  .ptool .seg{flex:1 1 100%}.ptool .btn{width:100%;justify-content:center}
}
/* ---------- saved edits ---------- */
.elist{display:flex;flex-direction:column;gap:6px}
.erow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 10px;border-radius:11px;background:rgba(255,255,255,.7);border:1px solid #e2e8f0;font-size:13.5px}
.btn-sm{padding:6px 12px;font-size:12.5px}
.tl-cal{margin-top:10px}
@media (max-width:959px){ .nav button{padding:8px 1px;font-size:9.5px;min-width:0;gap:2px} .nav button span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap} .nav-in{gap:2px;padding-left:4px;padding-right:4px} }
body[data-sec=pipe] #opbar{display:none}
/* ---------- acknowledgement before any output ---------- */
.ack{z-index:95}
.ack .sheet-in{max-width:480px;border:1px solid rgba(192,57,43,.35)}
.ack-top{position:relative;padding:20px 20px 16px;color:#fff;display:flex;gap:14px;align-items:center;
  background:radial-gradient(260px 120px at 95% -20%,rgba(255,255,255,.22),transparent 70%),linear-gradient(140deg,#7e1f16,#a8322a 45%,#c0392b)}
.ack-top .ai{width:46px;height:46px;border-radius:14px;flex:none;display:grid;place-items:center;
  background:linear-gradient(145deg,rgba(255,255,255,.35),rgba(255,255,255,.12));box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 8px 16px -6px rgba(0,0,0,.4)}
.ack-top .ai svg{width:26px;height:26px}
.ack-top h3{margin:0;font-size:17.5px;font-weight:700}
.ack-top p{margin:2px 0 0;font-size:12.5px;color:rgba(255,255,255,.82)}
.ack-body{padding:16px 20px 20px;display:flex;flex-direction:column;gap:12px}
.ack-msg{border-radius:14px;padding:14px;background:linear-gradient(180deg,#fdf1f0,#fbe5e3);border:1px solid rgba(192,57,43,.28);color:#8a2a20;font-size:13.5px;line-height:1.55;font-weight:500}
.ack-msg ul{margin:8px 0 0;padding-left:18px;font-weight:400;font-size:12.5px;color:#7a2e26}
.ack-msg li{margin:3px 0}
.btn-ack{color:#fff;justify-content:center;text-align:center;padding:14px 16px;border-radius:14px;font-size:14px;line-height:1.4;
  background:linear-gradient(140deg,#d35b4f -20%,#c0392b 40%,#962d22);box-shadow:0 12px 22px -10px rgba(192,57,43,.85),inset 0 1px 0 rgba(255,255,255,.28),inset 0 -2px 4px rgba(0,0,0,.15)}
.btn-ack:hover{filter:brightness(1.05)}
.btn-ack svg{flex:none;width:20px;height:20px}

/* ---------- Not Applicable sections ---------- */

<!-- ================= ENGINE (pure functions, no DOM) ================= -->
<script id="engine">
'use strict';
const RULESET = {
  version: 'CAAT-AOC-FEES-2026.11',
  sources: {
    P: 'ประกาศ กพท. กำหนดค่าธรรมเนียมฯ พ.ศ. 2561 (effective 1 Oct 2018)',
    C: 'กฎกระทรวงกำหนดค่าธรรมเนียมฯ (ฉบับที่ 3) พ.ศ. 2567 (Royal Gazette 19 Aug 2024)',
    A: 'ประกาศ กพท. กำหนดค่าธรรมเนียมฯ พ.ศ. 2561',
    E: 'ระเบียบ กพท. ว่าด้วยค่าใช้จ่ายตามมาตรา 5/1 (ฉบับที่ 5) พ.ศ. 2565'
  },
  settings: { areaExpansionBasis: 'MR2567' },
  P: { A1:{initial:535000,renewal:240000}, A2:{initial:267500,renewal:120000},
       H1:{initial:535000,renewal:240000}, H2:{initial:267500,renewal:125000},
       B1:{initial:50000, renewal:20000} },
  C: { A1:{DOM:2465000, ASIA:5565000, INTL:7065000},
       A2:{DOM:1232500, ASIA:2732500, INTL:3532500},
       H1:{DOM:2065000, HELI_INTL:2765000},
       H2:{DOM:1032500, HELI_INTL:1382000},
       B1:{NA:1500000} },
  A: { A1:{DOM:{initial:1300000,renewal:1100000}, ASIA:{initial:3500000,renewal:2300000}, INTL:{initial:4700000,renewal:3400000}},
       A2:{DOM:{initial:650000, renewal:500000},  ASIA:{initial:1750000,renewal:1150000}, INTL:{initial:2350000,renewal:1700000}},
       H1:{DOM:{initial:600000, renewal:500000},  HELI_INTL:{initial:1000000,renewal:750000}},
       H2:{DOM:{initial:300000, renewal:250000},  HELI_INTL:{initial:500000, renewal:375000}},
       B1:{NA:{initial:75000, renewal:65000}} },
  // Superseded 2018 certificate rates (item 2) - read only, used ONLY for the area-expansion basis option.
  C2018: { A1:{DOM:{initial:2465000,renewal:2200000}, ASIA:{initial:5465000,renewal:4000000}, INTL:{initial:7065000,renewal:5400000}},
           A2:{DOM:{initial:1232500,renewal:1100000}, ASIA:{initial:2732500,renewal:2000000}, INTL:{initial:3532500,renewal:2700000}},
           H1:{DOM:{initial:2065000,renewal:1800000}, HELI_INTL:{initial:2765000,renewal:2300000}},
           H2:{DOM:{initial:1032500,renewal:900000},  HELI_INTL:{initial:1382000,renewal:1150000}} },
  ADMIN: { amendment:1000, replacement:1000 },
  STATUTORY_MAX_AOC: 20000000,
  E: { DAY:4000, OVERNIGHT:5000, OVERSEAS:8500, OVERSEAS_SPECIAL:9500 },
  GOV: { accommodation:1500, airfare:5000, vehicleSmall:2500, vehicleLarge:3100 }
};

const SPECIAL_COUNTRIES = [
  ['JP','Japan','ญี่ปุ่น'],['FR','France','ฝรั่งเศส'],['RU','Russia','รัสเซีย'],['CH','Switzerland','สวิตเซอร์แลนด์'],
  ['IT','Italy','อิตาลี'],['BE','Belgium','เบลเยียม'],['ES','Spain','สเปน'],['DE','Germany','เยอรมนี'],
  ['US','United States','สหรัฐอเมริกา'],['GB','United Kingdom','สหราชอาณาจักร'],['PT','Portugal','โปรตุเกส'],['SG','Singapore','สิงคโปร์']
];
const OTHER_COUNTRIES = [['AU','Australia','ออสเตรเลีย'],['CN','China','จีน'],['HK','Hong Kong','ฮ่องกง'],['IN','India','อินเดีย'],['ID','Indonesia','อินโดนีเซีย'],['KR','South Korea','เกาหลีใต้'],
  ['MY','Malaysia','มาเลเซีย'],['NZ','New Zealand','นิวซีแลนด์'],['PH','Philippines','ฟิลิปปินส์'],['TW','Taiwan','ไต้หวัน'],['VN','Vietnam','เวียดนาม'],['AE','United Arab Emirates','สหรัฐอาหรับเอมิเรตส์'],['OT','Other country','ประเทศอื่น']];

const SEC = {A1:'ก',A2:'ข',H1:'ค',H2:'ง',B1:'จ'};
const AREA_NO = {DOM:'1',ASIA:'2',INTL:'3',HELI_INTL:'2'};
const AREA_LETTER = {DOM:'ก',ASIA:'ข',INTL:'ค',HELI_INTL:'ข'};
const AREA_LABEL = {DOM:'Domestic',ASIA:'Asia',INTL:'Other regions',HELI_INTL:'International',NA:'No area'};
const AREAS_FOR = {AEROPLANE:['DOM','ASIA','INTL'],HELICOPTER:['DOM','HELI_INTL'],BALLOON:['NA']};
const RANK = {DOM:1,ASIA:2,INTL:3,HELI_INTL:2};
const THRESH = {AEROPLANE:5700,HELICOPTER:3192};
const CAT_LABEL = {A1:'Large aeroplane',A2:'Small aeroplane',H1:'Large helicopter',H2:'Small helicopter',B1:'Balloon'};

/* ---------- Language (EN / TH) ---------- */
let LANG='en';
function setLang(l){ LANG = l==='th'?'th':'en'; }
function L(en,th){ return LANG==='th'?th:en; }
const AREA_TH={DOM:'ภายในประเทศ',ASIA:'ภูมิภาคเอเชีย',INTL:'ภูมิภาคอื่น',HELI_INTL:'ภูมิภาคต่างประเทศ',NA:'ไม่มีการกำหนดพื้นที่'};
const CAT_TH={A1:'เครื่องบิน น้ำหนักเกิน 5,700 กก.',A2:'เครื่องบิน น้ำหนักไม่เกิน 5,700 กก.',H1:'เฮลิคอปเตอร์ น้ำหนักเกิน 3,192 กก.',H2:'เฮลิคอปเตอร์ น้ำหนักไม่เกิน 3,192 กก.',B1:'บัลลูน'};
function areaL(a){ return LANG==='th'?AREA_TH[a]:AREA_LABEL[a]; }
function catL(c){ return LANG==='th'?CAT_TH[c]:CAT_LABEL[c]; }
function txL(tx){ return tx==='initial'?L('initial issue','การออกครั้งแรก'):L('renewal','การต่ออายุ'); }
function colL(col){ return col==='initial'?L('initial','การออกครั้งแรก'):L('renewal','การต่ออายุ'); }
function endS(){ return L('.',''); }

function fmt(n){ if(n==null||isNaN(n)) return '–'; const r=Math.round(n*100)/100; return r.toLocaleString('en-US',{minimumFractionDigits:0,maximumFractionDigits:2}); }
function toNum(v){ if(v==null) return null; const s=String(v).replace(/[,\s_฿]/g,''); if(s==='') return null; const n=Number(s); return isNaN(n)?NaN:n; }
const BASES=['MR2567','2018_INITIAL','2018_RENEWAL'];
function catCode(cat,heavy){ return cat==='AEROPLANE'?(heavy?'A1':'A2'):(heavy?'H1':'H2'); }

/* Classify one type under both instruments. */
function classify(t){
  if(t.cat==='BALLOON') return {mr:'B1',legacy:'B1'};
  const th=THRESH[t.cat]; if(!th) return {error:L('Choose an aircraft category','กรุณาเลือกประเภทอากาศยาน')};
  const m=toNum(t.mtow);
  if(m===null && t.showMtow) return {error:L('Enter the MTOW, or switch back to the weight class','กรุณาระบุน้ำหนักวิ่งขึ้นสูงสุด หรือเลือกช่วงน้ำหนักแทน')};
  if(m!==null){
    if(isNaN(m)||m<=0) return {error:L('MTOW must be a number greater than 0','น้ำหนักวิ่งขึ้นสูงสุดต้องเป็นตัวเลขที่มากกว่า 0')};
    const mr=catCode(t.cat,m>th);
    let legacy;
    if(m===th) legacy=(t.legacyConfirm==='heavy'?catCode(t.cat,true):t.legacyConfirm==='light'?catCode(t.cat,false):'AMBIGUOUS');
    else legacy=catCode(t.cat,m>th);
    return {mr,legacy,boundary:m===th};
  }
  if(t.heavy===true||t.heavy===false){ const c=catCode(t.cat,t.heavy); return {mr:c,legacy:c}; }
  return {error:L('Choose the weight class or enter the MTOW','กรุณาเลือกช่วงน้ำหนัก หรือระบุน้ำหนักวิ่งขึ้นสูงสุด')};
}

function refP(cat,tx){ return `ประกาศ กพท. 2561 ข้อ 3(1)(${SEC[cat]})1)${tx==='initial'?'ก':'ข'})`; }
function refC(cat,area,tx){
  const base = cat==='B1' ? 'กฎกระทรวง (ฉบับที่ 3) 2567 ข้อ 5 (28/1)(จ)' : `กฎกระทรวง (ฉบับที่ 3) 2567 ข้อ 5 (28/1)(${SEC[cat]})${AREA_NO[area]})`;
  return tx==='renewal' ? base+L(' · read with กฎกระทรวง 2554 ข้อ 2(30)',' ประกอบกับ กฎกระทรวง 2554 ข้อ 2(30)') : base;
}
function refA(cat,area){ return cat==='B1' ? 'ประกาศ กพท. 2561 ข้อ 3(1)(จ)3)' : `ประกาศ กพท. 2561 ข้อ 3(1)(${SEC[cat]})3)${AREA_LETTER[area]})`; }

/* Initial / renewal certificate calculation (Report section 5). */
function calcCertificate(types, tx, R){
  R=R||RULESET;
  const errors=[], warnings=[], notes=[];
  if(!types.length) return {status:'INCOMPLETE',errors:[L('Add at least one aircraft type.','กรุณาเพิ่มแบบอากาศยานอย่างน้อย 1 แบบ')],warnings,notes,lines:[]};
  const seen={};
  types.forEach(t=>{
    const k=(t.name||'').trim().toLowerCase();
    if(k){ if(seen[k]) errors.push(L(`“${t.name.trim()}” is entered twice. Enter each approved type once.`,`“${t.name.trim()}” ระบุซ้ำ กรุณาระบุแบบอากาศยานที่ได้รับอนุมัติเพียงครั้งเดียว`)); seen[k]=true; }
  });
  const cl=types.map((t,i)=>{
    const c=classify(t);
    const label=(t.name||'').trim()||L(`Type ${i+1}`,`แบบที่ ${i+1}`);
    if(c.error){ errors.push(`${label}: ${c.error}${endS()}`); return null; }
    if(!AREAS_FOR[t.cat].includes(t.area)){ errors.push(`${label}: ${L('choose a valid Area of Operation.','กรุณาเลือกพื้นที่ปฏิบัติการให้ถูกต้อง')}`); return null; }
    return Object.assign({},t,c,{label,idx:i});
  });
  if(errors.length) return {status:'INCOMPLETE',errors,warnings,notes,lines:[]};

  const flags=[];
  const amb=cl.filter(t=>t.legacy==='AMBIGUOUS');
  if(amb.length){
    flags.push('MTOW_BOUNDARY');
    const kg=amb[0].cat==='AEROPLANE'?'5,700':'3,192';
    return {status:'VERIFICATION_REQUIRED',flags,errors,warnings,lines:[],
      notes:[L(`${amb.map(t=>t.label).join(', ')}: MTOW sits exactly on the ${kg} kg line. The 2018 Announcement wording overlaps here. Confirm which 2018 category CAAT applies to continue.`,
               `${amb.map(t=>t.label).join(', ')}: น้ำหนักวิ่งขึ้นสูงสุดเท่ากับ ${kg} กิโลกรัมพอดี ซึ่งถ้อยคำในประกาศ กพท. พ.ศ. 2561 ครอบคลุมทั้งสองประเภท กรุณายืนยันประเภทที่ กพท. ใช้บังคับก่อนดำเนินการต่อ`)]};
  }
  const legacySet=new Set(cl.map(t=>t.legacy));
  if(legacySet.size>1){
    flags.push('MIXED_CATEGORY');
    const mix=[...legacySet].map(c=>catL(c)).join(' + ');
    return {status:'VERIFICATION_REQUIRED',flags,errors,warnings,lines:[],
      notes:[L(`The fleet mixes fee categories (${mix}). The instruments do not say which single application fee or principal type applies. Refer to FAD; no automatic total is produced.`,
               `ฝูงบินประกอบด้วยอากาศยานต่างประเภทค่าธรรมเนียม (${mix}) ซึ่งกฎหมายที่เกี่ยวข้องมิได้กำหนดวิธีเลือกค่าธรรมเนียมการยื่นคำขอหรือแบบอากาศยานหลักไว้ กรุณาส่ง FAD พิจารณา ระบบจะไม่คำนวณยอดรวมอัตโนมัติ`)]};
  }
  cl.forEach(t=>{ t.C=R.C[t.mr][t.area]; t.A=R.A[t.legacy][t.area][tx]; });
  const sorted=[...cl].sort((a,b)=> b.C-a.C || a.idx-b.idx);
  const principal=sorted[0], others=sorted.slice(1);
  const cat=principal.legacy;
  const P=R.P[cat][tx];
  const sumA=others.reduce((s,t)=>s+t.A,0);
  const certSubtotal=principal.C+sumA;
  const total=P+certSubtotal;
  const lines=[
    {kind:'P',label:L('Application fee','ค่าธรรมเนียมการยื่นคำขอ'),basis:`${catL(cat)} · ${txL(tx)} · ${L('charged once','เรียกเก็บครั้งเดียว')}`,ref:refP(cat,tx),amount:P},
    {kind:'C',label:`${L('Main certificate fee','ค่าใบรับรองผู้ดำเนินการเดินอากาศ')} · ${principal.label}`,basis:`${L('Principal type','แบบอากาศยานหลัก')} · ${catL(principal.mr)} · ${areaL(principal.area)}`,ref:refC(principal.mr,principal.area,tx),amount:principal.C,typeIdx:principal.idx},
    ...others.map(t=>({kind:'A',label:`${L('Additional type','ค่าเพิ่มแบบอากาศยาน')} · ${t.label}`,basis:`${catL(t.legacy)} · ${areaL(t.area)} · ${L(tx+' rate','อัตรา'+colL(tx))}`,ref:refA(t.legacy,t.area)+(tx==='renewal'?' · การต่ออายุ':' · การออกครั้งแรก'),amount:t.A,typeIdx:t.idx}))
  ];
  let status='CALCULATED';
  if(cl.some(t=>t.boundary)){ status='VERIFICATION_REQUIRED'; notes.push(L('A boundary-weight type uses the 2018 category you confirmed. CAAT confirmation is still required.','แบบอากาศยานที่มีน้ำหนักอยู่ที่เกณฑ์พอดีใช้ประเภทตามประกาศ กพท. พ.ศ. 2561 ที่ผู้ใช้ยืนยัน ทั้งนี้ ยังต้องได้รับการยืนยันจาก กพท.')); }
  if(certSubtotal>R.STATUTORY_MAX_AOC) warnings.push(L(`Certificate and additional-type fees total ${fmt(certSubtotal)}, above the THB 20,000,000 statutory maximum per certificate (พ.ร.บ. ฉบับที่ 14 มาตรา 64). No reduction applied: verify with FAD.`,
    `ค่าใบรับรองรวมค่าเพิ่มแบบอากาศยานเท่ากับ ${fmt(certSubtotal)} บาท สูงกว่าอัตราขั้นสูง 20,000,000 บาทต่อฉบับ ตามพระราชบัญญัติการเดินอากาศ (ฉบับที่ 14) พ.ศ. 2562 มาตรา 64 ระบบมิได้ปรับลดยอด กรุณาตรวจสอบกับ FAD`));
  if(cl.some(t=>t.cat!=='BALLOON' && t.legacy===t.mr) && types.length>1 && new Set(cl.map(t=>t.area)).size===1)
    notes.push(L('All types share one Area of Operation. Item 3) is applied to the second and later types, as in the Email 2 methodology.','แบบอากาศยานทุกแบบอยู่ในพื้นที่ปฏิบัติการเดียวกัน ระบบใช้อัตราตามข้อ 3) กับแบบที่สองเป็นต้นไป ตามแนวทางในอีเมลฉบับที่ 2'));
  return {status,flags,errors,warnings,notes,lines,P,C:principal.C,sumA,certSubtotal,total,principalIdx:principal.idx,category:cat,principalArea:principal.area,principalMr:principal.mr};
}

/* Mid-validity changes (Report section 6). */
function calcChange(mode, p, settings, R){
  R=R||RULESET; settings=settings||R.settings;
  const errors=[], warnings=[], notes=[], lines=[];
  const months=L('months','เดือน');
  const prorate=(rate)=>{
    const M=toNum(p.M), T=toNum(p.T);
    if(M===null||T===null||isNaN(M)||isNaN(T)) { errors.push(L('Enter remaining and total months.','กรุณาระบุจำนวนเดือนคงเหลือและจำนวนเดือนทั้งหมด')); return null; }

    if(M<0||M>T){ errors.push(L('Remaining months must be between 0 and the total validity.','จำนวนเดือนคงเหลือต้องอยู่ระหว่าง 0 ถึงจำนวนเดือนตามอายุใบรับรอง')); return null; }
    return {value:rate*M/T, M, T};
  };
  const inc=()=>({status:'INCOMPLETE',errors,warnings,notes,lines});
  const catOf=()=> p.cat==='BALLOON'?'B1':catCode(p.cat,!!p.heavy);
  if(mode==='newTypeArea'||mode==='newType'){
    const cat=catOf();
    if(!AREAS_FOR[p.cat].includes(p.area)) { errors.push(L('Choose the Area of Operation of the new type.','กรุณาเลือกพื้นที่ปฏิบัติการของแบบอากาศยานที่ขอเพิ่ม')); return inc(); }
    const rate=R.A[cat][p.area][p.col];
    const ref=refA(cat,p.area)+(p.col==='renewal'?' · การต่ออายุ':' · การออกครั้งแรก');
    if(mode==='newTypeArea' || p.prorate){
      const r=prorate(rate); if(!r) return inc();
      lines.push({label:L('Additional type, prorated','ค่าเพิ่มแบบอากาศยาน คิดตามสัดส่วนเดือนคงเหลือ'),basis:`${fmt(rate)} × ${fmt(r.M)} / ${fmt(r.T)} ${months}`,
        ref:(mode==='newTypeArea'?`ประกาศ กพท. 2561 ข้อ 3(1)(${SEC[cat]})4) ${L('with','ประกอบกับ')} `:'')+ref,amount:r.value});
    } else {
      lines.push({label:L('Additional type, full rate','ค่าเพิ่มแบบอากาศยาน อัตราเต็ม'),basis:`${catL(cat)} · ${areaL(p.area)} · ${L(colL(p.col)+' column','อัตรา'+colL(p.col))}`,ref,amount:rate});
    }
    notes.push(mode==='newTypeArea'
      ? L('The Announcement does not say whether the initial or renewal column of item 3) applies during validity. Confirm with LEG/FAD.','ประกาศ กพท. มิได้กำหนดว่าการขอเพิ่มระหว่างอายุใบรับรองให้ใช้อัตราการออกครั้งแรกหรืออัตราการต่ออายุตามข้อ 3) กรุณายืนยันกับ LEG/FAD')
      : L('No express proration or rate column for a standalone new type. Confirm the billing basis with LEG/FAD.','ไม่มีบทบัญญัติกำหนดการคิดตามสัดส่วนหรืออัตราที่ใช้สำหรับการขอเพิ่มแบบอากาศยานในพื้นที่ปฏิบัติการเดิม กรุณายืนยันหลักเกณฑ์การเรียกเก็บกับ LEG/FAD'));
  } else if(mode==='expand'){
    if(p.cat==='BALLOON'){ errors.push(L('Balloons have no Area of Operation fee structure.','บัลลูนไม่มีโครงสร้างค่าธรรมเนียมตามพื้นที่ปฏิบัติการ')); return inc(); }
    const cat=catOf();
    if(!AREAS_FOR[p.cat].includes(p.from)||!AREAS_FOR[p.cat].includes(p.to)){ errors.push(L('Choose the current and new areas.','กรุณาเลือกพื้นที่ปฏิบัติการปัจจุบันและพื้นที่ที่ขอเพิ่ม')); return inc(); }

    const basis=BASES.includes(settings.areaExpansionBasis)?settings.areaExpansionBasis:'MR2567';
    let cFrom,cTo,basisLabel;
    if(basis==='MR2567'){ cFrom=R.C[cat][p.from]; cTo=R.C[cat][p.to]; basisLabel=L('2024 Ministerial Regulation rates','อัตราตามกฎกระทรวง (ฉบับที่ 3) พ.ศ. 2567'); }
    else { const col=basis==='2018_INITIAL'?'initial':'renewal'; cFrom=R.C2018[cat][p.from][col]; cTo=R.C2018[cat][p.to][col]; basisLabel=L(`2018 Announcement ${col} rates (superseded figures)`,`อัตรา${colL(col)}ตามประกาศ กพท. พ.ศ. 2561 (อัตราเดิมที่ถูกแทนที่)`); }
    const diff=cTo-cFrom;
    const r=prorate(diff); if(!r) return inc();
    lines.push({label:`${L('Area expansion','การเพิ่มพื้นที่ปฏิบัติการ')} · ${areaL(p.from)} → ${areaL(p.to)}`,basis:`(${fmt(cTo)} − ${fmt(cFrom)}) × ${fmt(r.M)} / ${fmt(r.T)} ${months} · ${basisLabel}`,
      ref:`ประกาศ กพท. 2561 ข้อ 3(1)(${SEC[cat]})5)`+(basis==='MR2567'?`${L(' · rates from ',' ใช้อัตราตาม ')}กฎกระทรวง (ฉบับที่ 3) 2567 (28/1)(${SEC[cat]})`:''),amount:r.value});
    if(basis!=='MR2567') warnings.push(L('A non-default reference basis is selected in Settings.','มีการเลือกอัตราอ้างอิงที่ไม่ใช่ค่าเริ่มต้นในหน้าตั้งค่า'));
    notes.push(L('Item 5) refers to the item 2) certificate fees, which the 2024 Regulation replaced. Reference basis to be confirmed by LEG/FAD. One expansion is charged per AOC, not per type.',
      'ข้อ 5) อ้างอิงค่าใบรับรองตามข้อ 2) ซึ่งถูกแทนที่โดยกฎกระทรวง (ฉบับที่ 3) พ.ศ. 2567 อัตราอ้างอิงต้องได้รับการยืนยันจาก LEG/FAD และเรียกเก็บหนึ่งครั้งต่อใบรับรอง มิใช่ต่อแบบอากาศยาน'));
  } else if(mode==='balloon'){
    const rate=R.A.B1.NA[p.col];
    const r=prorate(rate); if(!r) return inc();
    lines.push({label:L('Additional balloon type, prorated','ค่าเพิ่มแบบบัลลูน คิดตามสัดส่วนเดือนคงเหลือ'),basis:`${fmt(rate)} × ${fmt(r.M)} / ${fmt(r.T)} ${months} · ${L(colL(p.col)+' column','อัตรา'+colL(p.col))}`,ref:L('ประกาศ กพท. 2561 ข้อ 3(1)(จ)4) with (จ)3)','ประกาศ กพท. 2561 ข้อ 3(1)(จ)4) ประกอบกับ (จ)3)'),amount:r.value});
    notes.push(L('Initial or renewal column for a mid-validity balloon addition to be confirmed.','อัตราที่ใช้ (การออกครั้งแรกหรือการต่ออายุ) สำหรับการขอเพิ่มแบบบัลลูนระหว่างอายุใบรับรองต้องได้รับการยืนยัน'));
  } else if(mode==='amend'){
    const n=Math.max(1,Math.floor(toNum(p.occasions)||1));
    lines.push({label:L('Amendment of certificate details','การแก้ไขเปลี่ยนแปลงรายละเอียดในใบรับรอง'),basis:L(`${n} × 1,000 per occasion`,`${n} × 1,000 บาทต่อครั้ง`),ref:'ประกาศ กพท. 2561 ข้อ 3(17)',amount:n*R.ADMIN.amendment});
    notes.push(L('Charge only when the certificate itself is amended, not for every Ops Specs or manual change.','เรียกเก็บเฉพาะกรณีแก้ไขรายละเอียดในใบรับรอง มิใช่ทุกการแก้ไขข้อกำหนดการปฏิบัติการหรือคู่มือ'));
    return {status:'CALCULATED',errors,warnings,notes,lines,total:lines[0].amount};
  } else if(mode==='replace'){
    lines.push({label:L('Replacement certificate','ใบแทนใบรับรอง'),basis:L('Half the certificate fee, capped at 1,000 → 1,000','กึ่งหนึ่งของค่าใบรับรอง แต่ไม่เกิน 1,000 บาท → 1,000 บาท'),ref:'กฎกระทรวง 2554 ข้อ 2(29); ประกาศ กพท. 2561 ข้อ 3(18)',amount:R.ADMIN.replacement});
    return {status:'CALCULATED',errors,warnings,notes,lines,total:lines[0].amount};
  } else if(mode==='nofee'){
    const why={reg:L('Aircraft added within an approved type: no additional-type fee. Inspection expenses only, if any.','การเพิ่มอากาศยานในแบบที่ได้รับอนุมัติแล้ว ไม่มีค่าเพิ่มแบบอากาศยาน คงมีเพียงค่าใช้จ่ายในการตรวจสอบ (ถ้ามี)'),
               reduce:L('Area of Operation reduced: not an expansion under item 5). No negative fee and no refund.','การลดพื้นที่ปฏิบัติการมิใช่การเพิ่มพื้นที่ตามข้อ 5) ไม่มีการคิดค่าธรรมเนียมติดลบและไม่มีการคืนค่าธรรมเนียม'),
               remove:L('Aircraft type or aircraft removed: no refund of fees already paid.','การถอนแบบอากาศยานหรืออากาศยาน ไม่มีการคืนค่าธรรมเนียมที่ชำระแล้ว')}[p.reason||'reg'];
    lines.push({label:L('Fee for this change','ค่าธรรมเนียมสำหรับการเปลี่ยนแปลงนี้'),basis:why,ref:L('No fee provision in the supplied instruments','ไม่มีบทบัญญัติกำหนดค่าธรรมเนียมในกฎหมายที่เกี่ยวข้อง'),amount:0});
    return {status:'CALCULATED',errors,warnings,notes,lines,total:0};
  } else { errors.push(L('Choose a change type.','กรุณาเลือกประเภทการเปลี่ยนแปลง')); return inc(); }
  const total=lines.reduce((s,l)=>s+l.amount,0);
  return {status:'VERIFICATION_REQUIRED',errors,warnings,notes,lines,total};
}

/* Section 5/1 inspection expenses (Report section 7). */
function isSpecial(code){ return SPECIAL_COUNTRIES.some(c=>c[0]===code); }
function overnightDays(hours){
  const full=Math.floor(hours/24), rem=hours-full*24;
  const days=full+(rem>12?1:0);
  return {days,flag:days===0?'REFER_SHORT_TRIP':null};
}
function hoursBetween(a,b){ const s=Date.parse(a), e=Date.parse(b); if(isNaN(s)||isNaN(e)) return null; return (e-s)/36e5; }
function calcActivity(a,R){
  R=R||RULESET;
  const persons=Math.max(0,Math.floor(toNum(a.persons)||0));
  const res={persons,excluded:Math.max(0,Math.floor(toNum(a.excluded)||0)),days:0,rate:0,amount:0,flag:null,error:null,hours:null};
  if(a.kind==='DAY'){ res.rate=R.E.DAY; res.days=Math.max(1,Math.floor(toNum(a.workDays)||1)); }
  else {
    res.rate = a.kind==='OVERNIGHT'?R.E.OVERNIGHT:(isSpecial(a.country)?R.E.OVERSEAS_SPECIAL:R.E.OVERSEAS);
    const h = a.hours!=null ? toNum(a.hours) : hoursBetween(a.start,a.end);
    if(h==null||isNaN(h)) { res.error=L('Enter departure and return times','กรุณาระบุเวลาออกเดินทางและเวลากลับ'); return res; }
    if(h<=0){ res.error=L('Return must be after departure','เวลากลับต้องอยู่หลังเวลาออกเดินทาง'); return res; }
    res.hours=h; const d=overnightDays(h); res.days=d.days; res.flag=d.flag;
  }
  res.amount=res.days*res.persons*res.rate;
  return res;
}
function calcGov(g,persons,R){
  R=R||RULESET;
  const p=Math.max(0,persons|0);
  const acc=(toNum(g.nights)||0)*p*R.GOV.accommodation;
  const air=(toNum(g.flights)||0)*p*R.GOV.airfare;
  const vday=toNum(g.vehicleDays)||0;
  const veh=vday*(p<=5?R.GOV.vehicleSmall:R.GOV.vehicleLarge);
  return {acc,air,veh,total:acc+air+veh,overTen:p>10};
}

  if(i.app){ if(S.tx!=='initial'){ S.tx='initial'; S.txAuto=true; } }

function cardFromGroup(g){

  return {id:nid(), ac:a?a.id:'OTHER', models:g.m.slice(), name:g.name||g.m.join(' / '),
    cat:g.cat||(a?acCat(a):'AEROPLANE'), heavy:g.heavy!=null?g.heavy:(a?acHeavy(a):true),
    area:g.area||'', mtow:g.mtow?String(g.mtow):'', showMtow:!!g.mtow, count:1, legacyConfirm:null, src:g.src||'', chk:!!g.chk};

function typesPristine(){ return (S.types.length===1 && !S.types[0].ac && !(S.types[0].name||'').trim()) || (S.loadedSig && typesSig()===S.loadedSig); }
function fleetCards(op){
  const f=FLEET[op]; if(!f) return [];

/* ---------- Operator switching: each operator has its own estimate ----------
   First visit: values come from the Ops Spec list and the AOC register. Edits are kept per operator for this
   session, so returning to an operator restores them. "Reload list" resets the aircraft types. */
const clone=o=>JSON.parse(JSON.stringify(o));
const OP_DEF=clone({change:S.change,insp:S.insp,na:S.na});
const OP_KEYS=['types','expiry','expiryAuto','tx','txAuto','changesAdded','change','insp','na','loadedSig','fleetFrom'];
const blankType=()=>({id:nid(),ac:'',name:'',cat:'AEROPLANE',heavy:true,area:'',mtow:'',count:1,showMtow:false,legacyConfirm:null});
function snapOp(){ const o={}; OP_KEYS.forEach(k=>o[k]=clone(S[k])); return o; }
function freshOp(v){
  const i=OPINFO[v]||{}; delete S.staleOps[v];
  S.expiry=i.until||''; S.expiryAuto=!!i.until;
  S.tx=i.app?'initial':'renewal'; S.txAuto=false;
  S.changesAdded=[]; S.change=clone(OP_DEF.change); S.insp=clone(OP_DEF.insp); S.na=clone(OP_DEF.na);
  if(FLEET[v]) loadFleet(v,true); else { S.types=[blankType()]; S.loadedSig=null; S.fleetFrom=null; }

function switchOperator(v){
  const prev=S.operator; if(v===prev) return;
  const keepTyped = !prev && !typesPristine();      // entries typed before any operator was chosen are kept
  if(prev){ touched.add(prev); if(hasEdits()) S.opCache[prev]=snapOp(); else delete S.opCache[prev]; }
  S.operator=v; if(!v) return;
  if(S.opCache[v]){ Object.assign(S,clone(S.opCache[v])); toast(L('Your earlier entries for this operator are restored','เรียกคืนข้อมูลที่กรอกไว้ของผู้ดำเนินการรายนี้แล้ว')); return; }
  if(keepTyped){ applyOpInfo(v); toast(L('Kept the aircraft types you entered. Use “Load types” to replace them.','คงแบบอากาศยานที่กรอกไว้ เลือก “โหลดแบบอากาศยาน” หากต้องการแทนที่')); return; }
  freshOp(v);
  const n=FLEET[v]?FLEET[v].length:0;
  toast(n?L(`Loaded ${n} aircraft type${n>1?'s':''} and register data for this operator`,`โหลดแบบอากาศยาน ${n} แบบ และข้อมูลทะเบียนของผู้ดำเนินการรายนี้แล้ว`)

}

    card.classList.toggle('principal',res.total!=null&&res.principalIdx===i);
    const p=card.querySelector('.pslot'); if(p) p.innerHTML=pillHTML(res,i);
    const f=card.querySelector('.fslot'); if(f) f.innerHTML=feeHTML(res.total!=null?(res.lines||[]).find(x=>x.typeIdx===i):null);

    const ac=card.querySelector('.acslot'); if(ac){ const na=acAutoHTML(t); if(ac.dataset.h!==na){ ac.innerHTML=na; ac.dataset.h=na; } }
  });

  let h=`<div class="card"><div class="eyebrow">${L('Step 1','ขั้นตอนที่ 1')}</div><h2>${L('What are you calculating?','ประเภทคำขอ')}</h2><p class="sub">${L('The certificate fee is the same for both; the application and additional-type fees differ.','ค่าใบรับรองเท่ากันทั้งสองกรณี ส่วนค่าธรรมเนียมการยื่นคำขอและค่าเพิ่มแบบอากาศยานแตกต่างกัน')}</p>
    <div class="tiles">
      <button type="button" class="tile ${S.tx==='initial'?'on':''}" data-act="tx" data-val="initial"><span class="ic">${ICON.cert}</span><span><b>${L('First issue','การออกครั้งแรก')}</b><span class="thai">${L('การออกครั้งแรก','Initial certification')}</span></span></button>

    </div></div>`;
  h+=`<div class="card"><div class="eyebrow">${L('Step 2','ขั้นตอนที่ 2')}</div><h2>${L('Approved aircraft types','แบบอากาศยานที่ได้รับอนุมัติ')}</h2><p class="sub">${L('One card per approved type in the Ops Specs, not per registration. The highest-rated type becomes the principal automatically.','ระบุหนึ่งรายการต่อแบบอากาศยานในข้อกำหนดการปฏิบัติการ (Operations Specifications) มิใช่ต่อทะเบียน ระบบจะกำหนดแบบที่มีอัตราสูงสุดเป็นแบบหลักโดยอัตโนมัติ')}</p>`;
  S.types.forEach((t,i)=>{
