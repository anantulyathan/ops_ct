  toast(target === null ? t('act_cleared', { n: actCount(days.length) }) : t('act_saved', { n: actCount(days.length), name: who }), 'success');
}
function actPick(){
  openModal('<h2>' + esc(t('act_pick_t')) + '</h2><input class="loq lsq" id="apQ" type="text" placeholder="' + esc(t('act_search')) + '" autocomplete="off" autocapitalize="off" spellcheck="false" oninput="actPickF()"><div class="aplist" id="apL"></div>' +
    '<div class="row" style="margin-top:12px;justify-content:flex-end"><button class="btn ghost" onclick="closeModal()">' + esc(t('cancel')) + '</button></div>');
  actPickF();
}
function actPickF(){
  const l = $('apL'); if(!l) return; const q = val('apQ').toLowerCase();
  const list = (staffList || []).filter(function(s){ return !q || (s.name + ' ' + s.division).toLowerCase().indexOf(q) >= 0; }).sort(function(a, b){ return a.name.localeCompare(b.name); }).slice(0, 80);
  l.innerHTML = list.length ? list.map(function(s){ return '<button type="button" class="apr" onclick="actAssign(' + s.id + ')"><b style="font-weight:600">' + esc(s.name) + '</b><span>' + esc(s.division) + '</span></button>'; }).join('') : '<div class="hint">' + esc(t('act_none_p')) + '</div>';
}

/* ---------- Terminal widget: next 7 days ---------- */
function actWidgetHTML(){
  if(!me || ACT.state === 'missing' || ACT.state === 'error') return '';
  const hd = '<div class="gh"><div class="gi">' + ico('calendar', 20) + '</div><div><div class="gt">' + esc(t('act_title')) + '</div><div class="gd">' + esc(t('act_w_sub')) + '</div></div></div>';
  if(ACT.state !== 'ok'){ actKick(); return '<section class="atw" id="thActing">' + hd + '</section>'; }
  const td = actToday(), days = [];
  for(let i = 0; i < 7; i++){ const ymd = actAdd(td, i); days.push({ ymd: ymd, a: ACT.days[ymd] || null }); }
  let tiles = '', runs = [];
  days.forEach(function(x, i){
    tiles += '<div class="atw7d' + (i === 0 ? ' me' : '') + '"><span class="wk">' + esc(actDayLabel(x.ymd, { weekday: 'short' })) + '</span><b>' + Number(x.ymd.slice(8)) + '</b>' +
      (x.a ? '<u style="' + actStyle(x.a.id) + '" title="' + esc(x.a.name) + '">' + esc(x.a.name) + '</u>' : '<u class="no">-</u>') + '</div>';
    const last = runs[runs.length - 1], id = x.a ? x.a.id : 0;
    if(last && last.id === id) last.to = x.ymd; else runs.push({ id: id, name: x.a ? x.a.name : '', from: x.ymd, to: x.ymd, today: i === 0 });
  });
  const list = runs.map(function(r){
    const rng = r.from === r.to ? actDayLabel(r.from, { weekday: 'short', day: 'numeric', month: 'short' }) : actDayLabel(r.from, { weekday: 'short', day: 'numeric' }) + ' - ' + actDayLabel(r.to, { weekday: 'short', day: 'numeric', month: 'short' });
    return '<div class="atwr"><i' + (r.id ? ' style="' + actStyle(r.id) + '"' : ' class="no"') + '></i><div><b>' + esc(r.id ? r.name : t('act_w_none')) + '</b><span>' + esc(rng) + '</span></div>' + (r.today ? '<em>' + esc(t('act_w_today')) + '</em>' : '') + '</div>';
  }).join('');
  return '<section class="atw" id="thActing">' + hd + '<div class="atwp" role="button" tabindex="0" aria-label="' + esc(t('act_w_open')) + '" onclick="setTab(\'acting\')" onkeydown="if(event.key===\'Enter\'||event.key===\' \'){event.preventDefault();setTab(\'acting\')}"><div class="atw7">' + tiles + '</div><div class="atwl">' + list + '</div></div></section>';
}

/* ---------- Text colour: dots with hover preview ---------- */
function gsInkName(c){ const x = GS_INK.filter(function(k){ return k[2] === c; })[0]; return x ? (lang === 'th' ? x[1] : x[0]) : ''; }
function gsPrev(c){ const w = $('gsW'); if(w) w.style.setProperty('--ink', c); const n = $('gsNm'); if(n) n.textContent = gsInkName(c); }
function gsMag(cx){
  Array.prototype.forEach.call(document.querySelectorAll('#gsDots .gsd'), function(b){
    if(cx === null){ b.style.transform = ''; return; }
    const r = b.getBoundingClientRect(), d = Math.abs(cx - (r.left + r.width / 2)), k = Math.exp(-Math.pow(d / 30, 2));
    b.style.transform = 'scale(' + (1 + 0.95 * k).toFixed(3) + ')';
  });
}
document.addEventListener('pointermove', function(e){
  if(e.pointerType !== 'mouse') return;
  const b = e.target.closest ? e.target.closest('#gsDots') : null;
  if(!b){ if(GS.mag){ GS.mag = false; gsMag(null); gsPrev(GS.ink); } return; }
  GS.mag = true; gsMag(e.clientX);
  const d = e.target.closest('.gsd'); gsPrev(d ? d.dataset.c : GS.ink);
});
document.documentElement.addEventListener('pointerleave', function(){ if(GS.mag){ GS.mag = false; gsMag(null); gsPrev(GS.ink); } });
document.addEventListener('focusin', function(e){ const d = e.target.closest ? e.target.closest('.gsd') : null; if(d) gsPrev(d.dataset.c); });
document.addEventListener('focusout', function(e){ if(e.target.closest && e.target.closest('.gsd')) gsPrev(GS.ink); });
document.addEventListener('click', function(e){ const d = e.target.closest ? e.target.closest('.gsd') : null; if(d) gsSet(d.dataset.c); });


/* ====================== INIT ====================== */
async function init(){
  const q = new URLSearchParams(location.search).get('b');
  if(q && /^\d+$/.test(q)){ curB = Number(q); tab = 'ack'; } else TERM.intro = true;
  render();                       // show the app shell immediately
  themeApply();
  await loadPublic();             // then load data in the background
  loadDefDays();
  if(curB && !form.staffId){ prefillStaff(); render(); }
  await sessRestore();            // still signed in if the app was left less than 60 minutes ago
  liveStart();
}
init();
