body[data-sec=slate]{--sec:#566579;--sec-2:#7a889b;--sec-lt:#3f4b5b;--sec-soft:#e2e7ed;--sec-tint:#f5f7f9;--sec-glow:rgba(86,101,121,.26)}

html,body{margin:0}
body{font-family:'Inter','Noto Sans Thai',system-ui,sans-serif;background:var(--grey-pale);color:var(--grey-dark);font-size:15px;line-height:1.55;min-height:100vh}
body::before{content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(640px 420px at 88% -4%,var(--sec-glow),transparent 70%),radial-gradient(520px 380px at -4% 46%,rgba(95,143,111,.3),transparent 72%),radial-gradient(460px 340px at 104% 86%,rgba(95,143,111,.22),transparent 72%)}
.mono{font-family:'JetBrains Mono',monospace}
button{font-family:inherit}

/* ---------- header ---------- */
.hd{position:relative;overflow:hidden;color:#fff;background:linear-gradient(180deg,rgba(32,140,124,0) 52%,rgba(32,140,124,.78) 100%),linear-gradient(115deg,#15263f 0%,#1a2e4a 22%,#1f5499 54%,#1f6c8e 78%,#247a6c 100%)}
.hd .gridbg{position:absolute;inset:0;opacity:.5;background-image:linear-gradient(rgba(255,255,255,.055) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.055) 1px,transparent 1px);background-size:34px 34px}
.hd .glow{position:absolute;border-radius:50%;filter:blur(46px);background:rgba(58,134,214,.55);pointer-events:none}
.hd .g1{width:260px;height:260px;left:-60px;top:-110px;animation:drift1 16s ease-in-out infinite alternate}
.hd .g2{width:300px;height:300px;right:-80px;bottom:-190px;background:rgba(59,191,176,.42);animation:drift2 20s ease-in-out infinite alternate}
@keyframes drift1{to{transform:translate(120px,40px)}}
@keyframes drift2{to{transform:translate(-140px,-30px)}}
.hd .hin{position:relative;max-width:1100px;margin:0 auto;padding:18px 16px 48px;display:flex;align-items:center;gap:12px}
.logo{width:44px;height:44px;border-radius:14px;flex:none;display:grid;place-items:center;color:#fff;
  background:radial-gradient(circle at 30% 20%,rgba(255,255,255,.5),transparent 48%),linear-gradient(135deg,var(--teal),var(--teal-lt));
  box-shadow:inset 0 1px 2px rgba(255,255,255,.6),inset 0 -4px 8px rgba(0,0,0,.18),0 8px 20px -4px rgba(42,157,143,.7)}
.hd h1{font-size:18px;font-weight:600;margin:0;line-height:1.25}
.hd .sub{font-size:12px;color:#c9d8ec}
.hd .ht{min-width:0}
#conn{margin-left:auto;font-size:12px;padding:4px 11px;border-radius:14px;background:rgba(255,255,255,.14);color:#fff;white-space:nowrap;border:1px solid rgba(255,255,255,.18)}
#conn.ok{background:rgba(95,143,111,.55)} #conn.err{background:rgba(185,72,60,.6)}
.langbtn{border:1px solid rgba(255,255,255,.25);background:linear-gradient(180deg,rgba(255,255,255,.2),rgba(255,255,255,.08));color:#fff;padding:7px 14px;border-radius:12px;font-size:14px;cursor:pointer;box-shadow:inset 0 1px 0 rgba(255,255,255,.25)}
.langbtn:hover{background:rgba(255,255,255,.25)}
@media (prefers-reduced-motion:reduce){.hd .glow{animation:none}*{scroll-behavior:auto!important}}

/* ---------- nav ---------- */
#nav{position:relative;z-index:30;max-width:1100px;margin:-28px auto 0;padding:0 16px}
.navin{display:inline-flex;gap:6px;padding:6px;border-radius:20px;background:linear-gradient(180deg,#fff,#f4f7fb);box-shadow:inset 0 1px 0 #fff,0 1px 2px rgba(26,46,74,.1),0 16px 34px -14px rgba(26,46,74,.35)}
.nt{border:0;background:transparent;display:flex;align-items:center;gap:9px;padding:10px 18px;border-radius:15px;cursor:pointer;color:var(--grey-mid);font-size:15px;font-weight:500;transition:.2s}
.nt .ni{display:grid;place-items:center;color:var(--c1)}
.nt:hover{background:rgba(26,46,74,.05)}
.nt.on{color:#fff;text-shadow:0 1px 1px rgba(0,0,0,.25);background:var(--c1);background:linear-gradient(135deg,var(--c1),color-mix(in srgb,var(--c1) 72%,#10223a));box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 8px 18px -6px var(--c1)}
.nt.on .ni{color:#fff}

/* ---------- layout ---------- */
.wrap{max-width:1100px;margin:0 auto;padding:18px 16px 48px}
.fade{animation:rise .4s ease both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.banner{display:flex;gap:16px;align-items:center;padding:18px 20px;border-radius:22px;margin-bottom:16px;
  background:linear-gradient(135deg,var(--sec-soft),#fff 92%);border:1px solid rgba(255,255,255,.9);box-shadow:inset 0 1px 0 #fff,0 14px 30px -16px var(--sec-glow)}
.orb{width:54px;height:54px;border-radius:50%;flex:none;display:grid;place-items:center;color:#fff;
  background:radial-gradient(circle at 30% 24%,rgba(255,255,255,.55),transparent 46%),linear-gradient(135deg,var(--sec),var(--sec-2) 62%,#4fa38a);
  box-shadow:inset 0 2px 3px rgba(255,255,255,.55),inset 0 -5px 9px rgba(0,0,0,.16),0 10px 20px -6px var(--sec-glow)}
.banner .bt{min-width:0}
.eyebrow{font-size:11.5px;font-weight:600;text-transform:uppercase;color:var(--sec-lt)}
html[lang=en] .eyebrow{letter-spacing:.08em}
.banner h2{margin:1px 0 2px;font-size:21px;line-height:1.25;color:var(--navy)}
.banner p{margin:0;color:var(--grey-mid);font-size:14px}

.card{position:relative;overflow:hidden;background:linear-gradient(180deg,#fff,var(--sec-tint));border-radius:20px;padding:22px;margin-bottom:16px;
  box-shadow:inset 0 1px 0 #fff,0 1px 2px rgba(26,46,74,.08),0 16px 34px -18px var(--sec-glow)}
.card::before{content:'';position:absolute;left:0;right:0;top:0;height:4px;background:linear-gradient(90deg,var(--sec),var(--sec-2) 42%,#5f8f6f 74%,#4fa38a)}
.card h2{font-size:16.5px;margin:0 0 12px;color:var(--navy);display:flex;align-items:center;gap:10px}
.card h2::before{content:'';flex:none;width:4px;height:17px;border-radius:3px;background:linear-gradient(var(--sec),var(--sec-2))}
.card h3{font-size:14px;margin:16px 0 8px;color:var(--navy)}
.center{text-align:center}
.muted{color:var(--grey-soft);font-size:13px}
.lbl{display:block;font-size:13px;font-weight:600;color:var(--grey-mid);margin:14px 0 6px}
.hint{color:var(--grey-soft);font-size:14px;padding:12px 14px;border-radius:14px;background:rgba(255,255,255,.7);border:1px dashed #c5d0de}

/* ---------- inputs ---------- */
select,input[type=text],input[type=password],input[type=date],input[type=datetime-local],input[type=url],textarea{width:100%;padding:12px 14px;border:1px solid #cdd7e3;border-radius:14px;font:inherit;font-size:16px;background:linear-gradient(180deg,#fff,#f8fafc);color:var(--grey-dark);box-shadow:inset 0 1px 2px rgba(26,46,74,.06)}
select:focus,input:focus,textarea:focus{outline:none;border-color:var(--sec);box-shadow:0 0 0 4px var(--sec-soft)}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--sec);vertical-align:-3px;margin-right:8px}
.pininput{text-align:center;font-size:28px;font-weight:600;letter-spacing:.55em;text-indent:.55em;padding:14px;max-width:320px;margin:0 auto;display:block}
.pw{width:100%;max-width:340px}

/* ---------- buttons ---------- */
.btn{border:0;border-radius:14px;padding:11px 18px;font:inherit;font-weight:600;font-size:15px;cursor:pointer;color:#fff;display:inline-flex;align-items:center;justify-content:center;gap:8px;
  background:var(--sec-lt);background:linear-gradient(180deg,var(--sec),var(--sec-lt));text-shadow:0 1px 1px rgba(0,0,0,.25);box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 8px 16px -6px var(--sec-glow),0 1px 2px rgba(26,46,74,.18);transition:transform .15s,box-shadow .15s,filter .15s}
.btn:hover{transform:translateY(-1px);filter:brightness(1.05)}
.btn:active{transform:translateY(1px);box-shadow:inset 0 2px 4px rgba(0,0,0,.18)}
.btn.ghost{background:linear-gradient(180deg,#fff,#f1f5f9);color:var(--sec-lt);text-shadow:none;box-shadow:inset 0 1px 0 #fff,0 0 0 1px var(--grey-light),0 4px 10px -6px rgba(26,46,74,.3)}
.btn.danger{background:linear-gradient(180deg,var(--red-2),var(--red))}
.btn.sm{padding:6px 12px;font-size:13px;border-radius:11px}
.btn.wide{width:100%;padding:16px 18px;margin-top:22px;font-size:16px;border-radius:16px}
.btn:disabled{background:linear-gradient(180deg,#e4eaf1,#d3dce7);color:#4a5568;text-shadow:none;box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 0 0 1px #c3cedb;cursor:not-allowed;transform:none;filter:none}
.btn svg{flex:none}
#siBtn:not(:disabled){background:linear-gradient(180deg,#3f6b50,#5f8f6f);box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 8px 16px -6px rgba(63,107,80,.5),0 1px 2px rgba(26,46,74,.18)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grow{flex:1;min-width:0}

/* ---------- chips, bars ---------- */
.chip{display:inline-block;font-size:12px;font-weight:600;padding:3px 11px;border-radius:12px;white-space:nowrap;box-shadow:inset 0 1px 0 rgba(255,255,255,.7)}
.chip.done{background:var(--green-soft);color:var(--green-dk)} .chip.progress{background:var(--blue-soft);color:var(--blue)} .chip.overdue{background:var(--red-soft);color:#a3392f} .chip.grey{background:var(--grey-light);color:var(--grey-mid)}
.bar{height:10px;background:#e1e8f0;border-radius:8px;overflow:hidden;box-shadow:inset 0 1px 2px rgba(26,46,74,.12)}
.bar>span{display:block;height:100%;border-radius:8px;background:linear-gradient(90deg,var(--sec),var(--sec-2))}
.bar.done>span{background:linear-gradient(90deg,var(--green),var(--green-2))}
.bar.overdue>span{background:linear-gradient(90deg,var(--red),var(--red-2))}
.bar.progress>span{background:linear-gradient(90deg,#2f78c4,#5b9bd8)}
.hbar{display:flex;align-items:center;gap:10px;margin:9px 0}
.hbar .nm{width:150px;font-size:13px;flex:none;line-height:1.3} .hbar .bar{flex:1;min-width:0} .hbar .v{width:92px;font-size:12px;text-align:right;color:var(--grey-soft);flex:none}

/* ---------- KPI tiles ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
@media(min-width:960px){.kpis.k7{grid-template-columns:repeat(7,minmax(0,1fr))}}
.kpi{position:relative;overflow:hidden;border-radius:18px;padding:14px 16px 14px 20px;background:linear-gradient(180deg,#fff,var(--sec-tint));
  box-shadow:inset 0 1px 0 #fff,0 1px 2px rgba(26,46,74,.08),0 14px 28px -16px var(--sec-glow)}
.kpi::after{content:'';position:absolute;left:0;top:14px;bottom:14px;width:4px;border-radius:0 4px 4px 0;background:linear-gradient(var(--k1,var(--sec)),var(--k2,var(--sec-2)))}
.kpi .n{font-size:28px;font-weight:600;line-height:1.15;color:var(--k3,var(--navy))}
.kpi .l{font-size:12.5px;color:var(--grey-soft)}
.kpi.done{--k1:#5f8f6f;--k2:#7fae8d;--k3:#3f6b50} .kpi.progress{--k1:#2f78c4;--k2:#5b9bd8;--k3:#1e4d8c} .kpi.overdue{--k1:#b9483c;--k2:#d46a5d;--k3:#a3392f}

/* ---------- tiles (division / name) ---------- */
.stp{display:flex;align-items:center;gap:10px;font-weight:600;color:var(--navy);margin:22px 0 10px;font-size:15px}
.stp:first-child{margin-top:0}
.sn{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:13px;flex:none;background:linear-gradient(135deg,var(--sec),var(--sec-lt));box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 4px 10px -3px var(--sec-glow)}
.tg{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px}
.tg.names{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
.tl{border:1px solid #d5dee9;border-radius:16px;padding:12px 8px;font-size:14.5px;font-weight:500;cursor:pointer;color:var(--grey-dark);text-align:center;line-height:1.3;min-height:52px;
  background:linear-gradient(180deg,#fff,#f1f5f9);box-shadow:inset 0 1px 0 #fff,0 4px 10px -6px rgba(26,46,74,.35);transition:.18s;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;word-break:break-word}
.tl small{font-size:11.5px;color:var(--grey-soft);font-weight:400}
.tl:hover{transform:translateY(-1px);border-color:var(--sec-2)}
.tl.on{color:#fff;border-color:transparent;text-shadow:0 1px 1px rgba(0,0,0,.25);background:linear-gradient(135deg,var(--sec),var(--sec-lt));box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 0 0 3px var(--sec-soft),0 12px 22px -8px var(--sec-glow)}
.tl.on small{color:rgba(255,255,255,.85)}

/* ---------- segmented ---------- */
.seg{display:inline-flex;max-width:100%;overflow-x:auto;scrollbar-width:none;background:#e3e9f1;border-radius:16px;padding:4px;gap:3px;box-shadow:inset 0 1px 3px rgba(26,46,74,.14)}
.seg::-webkit-scrollbar{display:none}
.seg button{border:0;background:transparent;padding:9px 15px;border-radius:12px;font-size:14px;font-weight:500;color:var(--grey-mid);cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:7px;transition:.18s;flex:none}
.seg button.on{background:linear-gradient(180deg,#fff,#f3f6fa);color:var(--sec-lt);box-shadow:inset 0 1px 0 #fff,0 4px 10px -3px var(--sec-glow),0 1px 2px rgba(26,46,74,.12)}
.seg.col button.on{background:var(--c1);background:linear-gradient(135deg,var(--c1),color-mix(in srgb,var(--c1) 72%,#10223a));color:#fff;text-shadow:0 1px 1px rgba(0,0,0,.25);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 6px 14px -4px var(--c1)}
.seg.col button .ni{display:grid;place-items:center}
.segrow{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:16px;align-items:center}

/* ---------- dark panel ---------- */
.dark{position:relative;overflow:hidden;color:#fff;border-radius:22px;padding:22px;background:linear-gradient(160deg,#14253d 0%,#1a2e4a 45%,#1e4d8c 120%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 2px 4px rgba(26,46,74,.2),0 24px 44px -20px rgba(26,46,74,.7)}
.dark::after{content:'';position:absolute;width:260px;height:260px;right:-90px;top:-100px;border-radius:50%;background:var(--sec-2);opacity:.35;filter:blur(50px);pointer-events:none}
.dark>*{position:relative;z-index:1}
.dark .eb{font-size:12px;color:#aebfd6;font-weight:500}
.dark .dt{font-size:17px;font-weight:600;line-height:1.35;margin:4px 0 8px}
.big{font-size:60px;font-weight:700;line-height:1.05;margin:6px 0 2px;color:#fff;background:linear-gradient(90deg,#fff 10%,var(--sec-2) 120%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.dark .ds{font-size:13.5px;color:#c3d0e2;margin-bottom:12px}
.comp{display:flex;height:11px;border-radius:8px;overflow:hidden;background:rgba(255,255,255,.14);box-shadow:inset 0 1px 2px rgba(0,0,0,.25)}
.comp span{display:block;height:100%}
.comp .c-done{background:linear-gradient(90deg,#5f8f6f,#8cbb9a)} .comp .c-prog{background:linear-gradient(90deg,#2f78c4,#6aa6e0)} .comp .c-over{background:linear-gradient(90deg,#b9483c,#df7d70)}
.legend{display:flex;gap:6px 14px;flex-wrap:wrap;margin-top:10px;font-size:12.5px;color:#c3d0e2}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
.spill{display:inline-block;padding:4px 12px;border-radius:14px;font-size:12.5px;font-weight:600;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.12)}
.spill.done{background:rgba(95,143,111,.5)} .spill.progress{background:rgba(47,120,196,.5)} .spill.overdue{background:rgba(185,72,60,.55)}
.pillrow{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 4px}
.dark .btn.ghost{background:rgba(255,255,255,.14);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 0 0 1px rgba(255,255,255,.18)}
.ackgrid,.ovgrid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:18px;align-items:start}
.ackgrid .side,.ovgrid .side{position:sticky;top:16px;grid-column:2;grid-row:1}
.ackgrid .main,.ovgrid .main{grid-column:1;grid-row:1;min-width:0}
.bcard{display:none}
.mini{position:fixed;left:12px;right:12px;bottom:calc(76px + env(safe-area-inset-bottom));z-index:40;display:none;align-items:center;gap:12px;color:#fff;border-radius:18px;padding:10px 14px;
  background:linear-gradient(135deg,#14253d,#1e4d8c);box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 14px 28px -10px rgba(26,46,74,.7)}
.mini .mn{font-size:12px;color:#c3d0e2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini .mp{font-size:20px;font-weight:700}
.mini .comp{flex:1;min-width:40px}
.mini .mt{min-width:0;flex:1}

/* ---------- items ---------- */
.bitem{padding:14px 0;border-top:1px solid #e5ebf2}
.bitem:first-of-type{border-top:0}
.resultbox{text-align:center;padding:8px 0}
.resultbox .orb{margin:0 auto 12px;width:68px;height:68px;--sec:#5f8f6f;--sec-2:#7fae8d;--sec-glow:rgba(95,143,111,.4)}
.msg{padding:12px 14px;border-radius:14px;margin-top:16px;font-size:14px}
.msg.error{background:var(--red-soft);color:#a3392f} .msg.info{background:var(--blue-soft);color:var(--blue)} .msg.ok{background:var(--green-soft);color:var(--green-dk)}
.spinner{width:30px;height:30px;border:3px solid #dbe3ec;border-top-color:var(--sec);border-radius:50%;animation:spin 1s linear infinite;margin:40px auto}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- tables ---------- */
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;color:var(--grey-soft);font-weight:600;padding:9px 8px;border-bottom:2px solid #dfe6ee;white-space:nowrap}
td{padding:9px 8px;border-bottom:1px solid #e8edf3;vertical-align:top}
tr:last-child td{border-bottom:0}
.tablewrap{overflow-x:auto}
.preview{border:1px dashed #b5c2d4;border-radius:14px;padding:16px;background:#fff;font-size:14px;max-height:520px;overflow:auto}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.cols>*{min-width:0}
.dg{display:inline-block;margin:0 12px 2px 0}

/* ---------- toasts + sheets ---------- */
#toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(22px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px;z-index:400;align-items:center;width:max-content;max-width:calc(100vw - 24px)}
.toast{background:linear-gradient(135deg,#1a2e4a,#24406a);color:#fff;padding:11px 18px;border-radius:14px;box-shadow:0 14px 28px -10px rgba(26,46,74,.6);font-size:14px;animation:rise .3s ease both}
.toast.error{background:linear-gradient(135deg,var(--red),var(--red-2))} .toast.success{background:linear-gradient(135deg,var(--green),var(--green-2))}
.overlay{position:fixed;inset:0;background:rgba(20,37,61,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:300;animation:fadein .2s ease}
@keyframes fadein{from{opacity:0}}
.modal{background:linear-gradient(180deg,#fff,#f6f9fc);border-radius:22px;padding:24px;max-width:480px;width:100%;max-height:90vh;overflow-y:auto;box-shadow:0 30px 60px -20px rgba(0,0,0,.5);animation:rise .25s ease both}
.modal h2{margin:0 0 10px;font-size:18px;color:var(--navy)}


/* ---------- v2: groups, charts, colour labels ---------- */
.grp{margin:0 0 6px}
.grp.g-blue{--sec:#1e4d8c;--sec-2:#2f78c4;--sec-lt:#173d70;--sec-soft:#d9e6f6;--sec-tint:#f2f7fd;--sec-glow:rgba(30,77,140,.26)}
.grp.g-teal{--sec:#2a9d8f;--sec-2:#3bbfb0;--sec-lt:#1f7a70;--sec-soft:#d6efec;--sec-tint:#f2fbf9;--sec-glow:rgba(42,157,143,.28)}
.grp.g-green{--sec:#5f8f6f;--sec-2:#7fae8d;--sec-lt:#46704f;--sec-soft:#dfece4;--sec-tint:#f4f9f5;--sec-glow:rgba(95,143,111,.26)}
.grp.g-peri{--sec:#5568b8;--sec-2:#7b8fd6;--sec-lt:#3f4f93;--sec-soft:#e1e6f7;--sec-tint:#f5f6fc;--sec-glow:rgba(85,104,184,.26)}
.grp.g-amber{--sec:#b9852f;--sec-2:#d6a85a;--sec-lt:#8a6420;--sec-soft:#f4e8d0;--sec-tint:#fcf8ef;--sec-glow:rgba(185,133,47,.26)}
.grp.g-slate{--sec:#566579;--sec-2:#7a889b;--sec-lt:#3f4b5b;--sec-soft:#e2e7ed;--sec-tint:#f5f7f9;--sec-glow:rgba(86,101,121,.24)}
.gh{display:flex;align-items:center;gap:13px;margin:30px 2px 14px}

@keyframes growx{from{transform:scaleX(0)}}
@keyframes ringin{from{stroke-dasharray:0 400}}
@keyframes popin{0%{transform:scale(.4);opacity:0}60%{transform:scale(1.12);opacity:1}100%{transform:scale(1)}}

#view.anim .bar>span,#view.anim .comp>span,#view.anim .rkrow .bar>span{transform-origin:left center;animation:growx .9s cubic-bezier(.2,.8,.2,1) both}
#view.anim .donut circle[stroke^=url]{animation:ringin 1.1s cubic-bezier(.2,.8,.2,1) both}

.resultbox .orb svg path,.resultbox .orb svg polyline{stroke-dasharray:34;stroke-dashoffset:34;animation:tick .5s .25s ease-out forwards}

/* ---------- OPS Terminal ---------- */
.thero{position:relative;overflow:hidden;border-radius:24px;padding:24px 24px 0;margin-bottom:16px;color:#fff;background:linear-gradient(165deg,#0f1f34 0%,#16304f 55%,#1b4a73 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 24px 44px -22px rgba(10,24,44,.75)}
.thero::before{content:'';position:absolute;inset:0;background:radial-gradient(520px 280px at 88% -10%,rgba(42,157,143,.45),transparent 70%),linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);background-size:auto,36px 36px,36px 36px;pointer-events:none}
.thero>*{position:relative}
.tht{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
.theye{font-size:12px;letter-spacing:.22em;color:#8fd3ca;font-weight:600}
.thero h2{margin:2px 0 4px;font-size:34px;line-height:1.1;letter-spacing:.03em;color:#fff;display:block} .thero h2::before{display:none}
.thd{font-size:14px;color:#b9c8dc}
.thck{text-align:right}
.thc{font-family:'JetBrains Mono',monospace;font-size:28px;font-weight:500;letter-spacing:.04em;color:#f2f6fb}
.thdt{font-size:12.5px;color:#b9c8dc}
.thsigns{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0 18px}
.thsign{display:inline-flex;align-items:center;gap:8px;padding:9px 15px;border:0;border-radius:10px;font:inherit;font-size:13.5px;font-weight:600;color:#fff;cursor:pointer;background:#2a9d8f;box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 6px 14px -6px rgba(0,0,0,.5);transition:.18s}
.thsign.b{background:#1e4d8c} .thsign.g{background:#5f8f6f} .thsign.s{background:#566579}
.thsign:hover{transform:translateY(-1px);filter:brightness(1.08)}
.thrun{position:relative;height:64px;margin:0 -24px;overflow:hidden;background:linear-gradient(180deg,#0e1a2b,#0a1422);border-top:2px solid #24405f}
.thrun::before{content:'';position:absolute;left:0;right:0;top:36px;height:4px;background:repeating-linear-gradient(90deg,#c8d6e6 0 26px,transparent 26px 58px);background-size:58px 4px;animation:rundash 2.4s linear infinite;opacity:.85}
.thrun::after{content:'';position:absolute;left:0;right:0;top:8px;height:3px;background:repeating-linear-gradient(90deg,#e3cf94 0 6px,transparent 6px 40px);opacity:.55}
@keyframes rundash{to{background-position:-58px 0}}
.thplane{position:absolute;top:12px;left:-8%;color:#e8eff8;transform:rotate(45deg);animation:planefly 22s linear infinite;filter:drop-shadow(0 4px 6px rgba(0,0,0,.5))}
@keyframes planefly{from{left:-8%}to{left:108%}}
/* boards */
.tb{--tw:14px;--th:22px;background:linear-gradient(180deg,#0f1c2e,#0b1625);border:1px solid #1d3452;border-radius:20px;padding:16px 18px 14px;margin-bottom:16px;color:#e8eff8;box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 22px 40px -24px rgba(10,24,44,.85)}
.tbh{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.tbh b{font-size:16px;letter-spacing:.16em;text-transform:uppercase;color:#f2f6fb}
html[lang=th] .tbh b{letter-spacing:.04em}
.tbi{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:#2a9d8f;color:#fff}
.tbn{font-size:12px;color:#8da1ba;margin-left:auto}
.tbl{border:1px solid #2b4262;background:#14263d;color:#9fd8d0;border-radius:9px;padding:5px 11px;font:inherit;font-size:12px;cursor:pointer}
.tbcols{display:flex;gap:18px;padding:0 6px 6px;border-bottom:1px solid #22395a}
.cl{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:#7f95b0;min-width:calc(var(--w) * (var(--tw) + 2px));flex:none}
.tbr{display:flex;gap:18px;align-items:center;padding:7px 6px;border-bottom:1px solid #182c47;border-radius:6px;transition:background .2s}
.tbr:last-child{border-bottom:0}
.tbr.go{cursor:pointer} .tbr.go:hover{background:rgba(42,157,143,.14)}
.tbr.empty{opacity:.55}
.tbgo{margin-left:auto;color:#5f8f9a;display:grid;place-items:center;opacity:0} .tbr.go .tbgo{opacity:1}
.cell{display:inline-flex;flex:none;min-width:calc(var(--w) * (var(--tw) + 2px))}
.cell i{position:relative;display:inline-block;width:var(--tw);height:var(--th);line-height:var(--th);margin:0 1px;border-radius:3px;text-align:center;font-style:normal;font-family:'JetBrains Mono',monospace;font-size:calc(var(--th) * .66);font-weight:500;color:#f2f6fb;background:linear-gradient(180deg,#1b3453 0,#1b3453 49%,#132843 51%,#132843 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.07)}
.cell i::after{content:'';position:absolute;left:0;right:0;top:50%;height:1px;background:rgba(5,12,22,.75)}
.cell.c-gate i{color:#e3cf94}
.cell.s-prog i{color:#7fd6cb} .cell.s-over i{color:#f0a79e} .cell.s-done i{color:#9bd0ac} .cell.s-soon i{color:#e3cf94}
.cell.plain{display:block;height:var(--th);line-height:var(--th);padding:0 8px;border-radius:3px;font-family:'JetBrains Mono',monospace;font-size:calc(var(--th) * .62);color:#f2f6fb;background:#1b3453;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:calc(var(--w) * (var(--tw) + 2px))}
.fa{animation:flapA .16s ease-in-out} .fb{animation:flapB .16s ease-in-out}
@keyframes flapA{0%{transform:rotateX(0)}50%{transform:rotateX(-82deg);filter:brightness(.6)}100%{transform:rotateX(0)}}
@keyframes flapB{0%{transform:rotateX(0)}50%{transform:rotateX(-82deg);filter:brightness(.6)}100%{transform:rotateX(0)}}
.tbtick{margin:-6px 0 16px;overflow:hidden;white-space:nowrap;border-radius:12px;padding:9px 0;background:#0b1625;border:1px solid #1d3452;color:#9fd8d0;font-family:'JetBrains Mono',monospace;font-size:12.5px;letter-spacing:.1em}
.tbtick span{display:inline-block;padding-left:100%;animation:tickmarq 46s linear infinite}
@keyframes tickmarq{to{transform:translateX(-100%)}}
/* gates */
.gates{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin-bottom:16px}
.gcard{display:flex;gap:14px;align-items:flex-start;margin-bottom:0}
.gcard.off{opacity:.62}
.gnum{width:54px;height:54px;border-radius:14px;flex:none;display:grid;place-items:center;font-family:'JetBrains Mono',monospace;font-weight:700;font-size:22px;color:#e3cf94;background:linear-gradient(180deg,#1b3453,#132843);box-shadow:inset 0 1px 0 rgba(255,255,255,.1),0 8px 16px -8px rgba(10,24,44,.7)}
.gn{font-weight:700;color:var(--navy);font-size:15.5px;line-height:1.3}
@media (max-width:1180px){.tb{--tw:12px;--th:20px}}
/* Tablet and narrow desktop windows use the compact board: the long cell moves to its own line, so the page never scrolls sideways. */
@media (max-width:1000px){
  .tb{--tw:11px;--th:19px}
  .tbcols{display:none}
  .tbr{flex-wrap:wrap;gap:5px 12px;padding:9px 4px}
  .cell.cm{order:-1;flex-basis:100%}
  .hm{display:none}
  .tbgo{display:none}
}
@media (max-width:640px){

  .thero h2{font-size:26px} .thc{font-size:20px} .thck{text-align:left}
  .tbn{display:none}
}

const SESS_KEY = 'ackSess', SESS_MS = 60 * 60 * 1000;
let sessAway = 0;
function sessSave(){ try { if(me) localStorage.setItem(SESS_KEY, JSON.stringify({ id: me.id, pin: me.pin, ts: Date.now() })); } catch(e) {} }
function sessClear(){ try { localStorage.removeItem(SESS_KEY); } catch(e) {} }
function sessRead(){
  try {
    const o = JSON.parse(localStorage.getItem(SESS_KEY) || 'null');
    if(!o || !o.id || !/^\d{4}$/.test(String(o.pin)) || !o.ts) return null;
    if(Date.now() - o.ts > SESS_MS || o.ts - Date.now() > 60000){ sessClear(); return null; }
    return o;
  } catch(e) { return null; }
}
function sessLeave(){ if(me){ sessAway = Date.now(); sessSave(); } }
function sessReturn(){
  if(me && sessAway && Date.now() - sessAway > SESS_MS){ sessAway = 0; sessClear(); meSignOut(); return; }
  sessAway = 0; if(me) sessSave();
}
async function sessRestore(){
  const o = sessRead(); if(!o || me) return;
  if(pubError || !staffList || !staffList.length) return;   // could not load the staff list: keep the saved session
  const sel = staffList.find(function(x){ return String(x.id) === String(o.id); });
  if(!sel || !sel.has_pin){ sessClear(); return; }
  const r = await rpc('ack_my_bulletins', { p_staff_id: sel.id, p_pin: String(o.pin) });
  if(r.error) return;                                   // offline: keep it, the person can sign in normally
  if(!r.data || !r.data.ok){ sessClear(); return; }
  if(me) return;
  head = null; headAuto = null;
  me = { id: sel.id, name: sel.name, division: sel.division, pin: String(o.pin), list: r.data.bulletins, roles: r.data.roles || {} };
  await loadExtra();
  await loadGates();
  if(isCT()) await loadAdmin(true);
  myFilter = 'pending'; sessSave(); render();
}

/* ====================== ADMIN COMPUTATION ====================== */
function computeAdmin(d, today){ return addPerf(computeAdminRaw(Object.assign({}, d, { bulletins: d.bulletins.filter(yearOk) }), today)); }
function computeAdminRaw(d, today){
  const staffById = {}; d.staff.forEach(function(s){ staffById[s.id] = s; });
  const ackAt = {}; d.acks.forEach(function(a){ ackAt[a.b + '_' + a.s] = a.at; });
  const reqByB = {}, divAt = {}; d.required.forEach(function(p){ (reqByB[p[0]] = reqByB[p[0]] || []).push(p[1]); divAt[p[0] + '_' + p[1]] = p[2]; });
  const divs = {};
  const bullets = d.bulletins.map(function(b){
    const reqIds = reqByB[b.id] || [];
    const ackedIds = reqIds.filter(function(s){ return ackAt[b.id + '_' + s]; });
    const pendingIds = reqIds.filter(function(s){ return !ackAt[b.id + '_' + s]; });
    return Object.assign({}, b, { reqIds: reqIds, ackedIds: ackedIds, pendingIds: pendingIds,
      required: reqIds.length, acked: ackedIds.length,
      status: bulletinStatus(reqIds.length, ackedIds.length, b.deadline, today, isSup(b)), daysLeft: daysBetween(today, b.deadline) });
  });
  const stats = {};
  d.staff.filter(function(s){ return s.active; }).forEach(function(s){
    stats[s.id] = Object.assign({}, s, { required: 0, acked: 0, pending: 0, overdue: 0, times: [], late: 0, onTime: 0, fast: 0, oldest: 0, pendingB: [], incidents: [], maxDelay: 0 });
  });
  const allTimes = []; let late = 0;
  const buckets = { h24: 0, d3: 0, d7: 0, over: 0 };
  const monthly = {};
  bullets.forEach(function(b){
    b.reqIds.forEach(function(sid){
      const dv = divAt[b.id + '_' + sid] || (staffById[sid] || {}).division || '-';
      const D = divs[dv] = divs[dv] || { division: dv, required: 0, acked: 0, onTime: 0, due: 0, pp: {} };
      const pp = D.pp[sid] = D.pp[sid] || { pending: 0, overdue: 0 };
      D.required++;
      const at0 = ackAt[b.id + '_' + sid], edl = effDeadline(b, sid);
      if(at0){ D.acked++; D.due++; if(bkkDate(at0) <= edl) D.onTime++; }
      else { pp.pending++; if(edl < today){ pp.overdue++; D.due++; } }
      const st = stats[sid]; if(!st) return;
      st.required++;
      const at = ackAt[b.id + '_' + sid];
      if(at){
        st.acked++;
        const days = (Date.parse(at) - Date.parse(b.created_at)) / 86400000;
        st.times.push(days); allTimes.push(days);
        if(days <= 1){ st.fast++; }
        if(days <= 1) buckets.h24++; else if(days <= 3) buckets.d3++; else if(days <= 7) buckets.d7++; else buckets.over++;
        if(bkkDate(at) > edl){
          late++; st.late++;
          const dl = daysBetween(edl, bkkDate(at)); if(dl > st.maxDelay) st.maxDelay = dl;
          st.incidents.push({ number: b.number, title: b.title, deadline: edl, kind: 'late', days: dl });
        } else st.onTime++;
        const m = bkkDate(at).slice(0, 7); monthly[m] = (monthly[m] || 0) + 1;
      } else {
        st.pending++;
        const od = edl < today, dd = od ? daysBetween(edl, today) : 0;
        if(od){ st.overdue++; if(dd > st.oldest) st.oldest = dd; if(dd > st.maxDelay) st.maxDelay = dd; st.incidents.push({ number: b.number, title: b.title, deadline: edl, kind: 'overdue', days: dd }); }
        st.pendingB.push({ id: b.id, number: b.number, title: b.title, deadline: edl, created_at: b.created_at, overdue: od, daysOver: dd, daysLeft: daysBetween(today, edl) });
      }
    });
  });
  const people = Object.keys(stats).map(function(k){
    const s = stats[k];
    s.rate = pct(s.acked, s.required);
    s.due = s.onTime + s.late + s.overdue; s.onTimeRate = s.due ? pct(s.onTime, s.due) : null;
    s.pendingB.sort(function(a, b){ return (b.daysOver - a.daysOver) || (a.deadline < b.deadline ? -1 : 1); });
    s.avg = s.times.length ? s.times.reduce(function(a, c){ return a + c; }, 0) / s.times.length : null;
    return s;
  });
  const live = bullets.filter(function(b){ return b.status !== 'superseded'; });
  const sumReq = live.reduce(function(a, b){ return a + b.required; }, 0);
  const sumAck = live.reduce(function(a, b){ return a + b.acked; }, 0);
  Object.keys(divs).forEach(function(k){ const D = divs[k], ids = Object.keys(D.pp);
    D.people = ids.length; D.withReq = ids.length; D.upToDate = ids.filter(function(i){ return !D.pp[i].pending; }).length; D.overdueN = ids.filter(function(i){ return D.pp[i].overdue > 0; }).length; });
  return {
    today: today, staffById: staffById, ackAt: ackAt, divAt: divAt, bullets: bullets, people: people,
    divisions: Object.keys(divs).sort(cmpDiv).map(function(k){ return divs[k]; }),
    totals: { bulletins: bullets.filter(function(b){ return b.status !== 'superseded'; }).length, done: bullets.filter(function(b){ return b.status === 'done'; }).length,
      progress: bullets.filter(function(b){ return b.status === 'progress'; }).length,
      overdue: bullets.filter(function(b){ return b.status === 'overdue'; }).length,
      rate: pct(sumAck, sumReq), sumAck: sumAck, sumReq: sumReq, staff: people.length, late: late,
      avg: allTimes.length ? allTimes.reduce(function(a, c){ return a + c; }, 0) / allTimes.length : null },
    buckets: buckets, monthly: monthly
  };
}
function addPerf(c){
  const T = c.totals, P = c.people;
  const on = P.reduce(function(a, p){ return a + p.onTime; }, 0), due = P.reduce(function(a, p){ return a + p.due; }, 0);
  const acked = P.reduce(function(a, p){ return a + p.acked; }, 0), fast = P.reduce(function(a, p){ return a + p.fast; }, 0);
  T.onTimeRate = due ? pct(on, due) : null; T.fastRate = acked ? pct(fast, acked) : null;
  T.withReq = P.filter(function(p){ return p.required > 0; }).length;
  T.upToDate = P.filter(function(p){ return p.required > 0 && p.pending === 0; }).length;
  T.withOverdue = P.filter(function(p){ return p.overdue > 0; }).length;
  T.oldest = P.reduce(function(a, p){ return Math.max(a, p.oldest); }, 0);
  return c;
}
function namesGrouped(ids, byId){
  const g = {};
  ids.forEach(function(id){ const s = byId[id]; if(!s) return; (g[s.division] = g[s.division] || []).push(s.name); });
  return Object.keys(g).sort(cmpDiv).map(function(d){ return { division: d, names: g[d].sort() }; });
}

  if(k !== 'loa') LOA.view = 'list';
  tab = k; render(); pulseAnim(); window.scrollTo(0, 0);
  if(k === 'loa' && me){ loadLoa().then(function(){ if(tab === 'loa') render(); }); }
  if(k === 'acting' && me){ loadActing().then(function(){ if(tab === 'acting') render(); }); }
  if(k === 'admin' && adTab === 'operators' && isCT()){ loadLoa().then(function(){ if(tab === 'admin') render(); }); }
  if((k === 'admin' || (k === 'overview' && ovTab === 'detailed')) && isCT() && !admin){ loadAdmin(true).then(render); }
}

function renderSignin(){

function siPin(inp, which){
  const v = inp.value.replace(/\D/g, '').slice(0, 4); inp.value = v;
  if(which === 1) signin.pin = v; else if(which === 3) signin.code = v; else signin.pin2 = v;
  updateSiBtn();
}
function siValid(){
  const sel = staffList.find(function(x){ return String(x.id) === String(signin.staffId); });
  if(!sel || signin.busy || !/^\d{4}$/.test(signin.pin)) return false;
  return sel.has_pin || (signin.pin === signin.pin2 && (!sel.needs_code || /^\d{4}$/.test(signin.code || '')));
}
function updateSiBtn(){ const b = $('siBtn'); if(b) b.disabled = !siValid(); }
async function siGo(){
  if(!siValid()) return;
  const sel = staffList.find(function(x){ return String(x.id) === String(signin.staffId); });
  signin.busy = true; signin.msg = null; renderSignin();
  if(!sel.has_pin){
    const r1 = await rpc('ack_set_pin', { p_staff_id: sel.id, p_pin: signin.pin, p_code: sel.needs_code ? signin.code : null });
    if(r1.error){ signin.busy = false; signin.msg = { kind: 'error', text: t('unavailable') }; renderSignin(); return; }
    if(!r1.data.ok){
      signin.busy = false;
      if(r1.data.error === 'already_set'){ sel.has_pin = true; signin.pin = ''; signin.pin2 = ''; signin.msg = { kind: 'error', text: t('err_already_set') }; }
      else if(r1.data.error === 'wrong_code'){ signin.code = ''; signin.msg = { kind: 'error', text: t('err_wrong_code') }; }
      else if(r1.data.error === 'code_expired') signin.msg = { kind: 'error', text: t('err_code_expired') };
      else if(r1.data.error === 'locked') signin.msg = { kind: 'error', text: t('err_locked') };
      else signin.msg = { kind: 'error', text: t('err_generic') };
      renderSignin(); return;
    }
    sel.has_pin = true; sel.needs_code = false;
  }
  const r = await rpc('ack_my_bulletins', { p_staff_id: sel.id, p_pin: signin.pin });
  signin.busy = false;
  if(r.error){ signin.msg = { kind: 'error', text: t('unavailable') }; renderSignin(); return; }
  if(!r.data.ok){
    signin.pin = ''; signin.pin2 = '';
    signin.msg = { kind: 'error', text: r.data.error === 'wrong_pin' ? t('err_wrong_pin') : (r.data.error === 'locked' ? t('err_locked') : t('err_generic')) };
    renderSignin(); return;
  }
  head = null; headAuto = null;
  me = { id: sel.id, name: sel.name, division: sel.division, pin: signin.pin, list: r.data.bulletins, roles: r.data.roles || {} };
  await loadExtra();
  await loadGates();
  if(isCT()) await loadAdmin(true);
  signin = { div: '', staffId: '', pin: '', pin2: '', msg: null, busy: false };
  try { localStorage.setItem('ackStaff', String(sel.id)); } catch(e) {}
  sessSave();
  myFilter = 'pending'; render();
}

function mineHTML(note){
  const today = bkkToday();

  const pend = list.filter(function(b){ return !b.acknowledged_at; }), done = list.filter(function(b){ return b.acknowledged_at; });
  const base = myFilter === 'pending' ? pend : (myFilter === 'done' ? done : list);
  LR.mine = function(){
    const st = lsGet('mine', 'newest'), q = st.q.toLowerCase();
    const shown = base.filter(function(b){ return !q || (b.number + ' ' + b.title).toLowerCase().indexOf(q) >= 0; }).sort(function(a, b){
      if(st.sort === 'oldest') return Date.parse(a.created_at) - Date.parse(b.created_at);
      if(st.sort === 'deadline') return a.deadline < b.deadline ? -1 : (a.deadline > b.deadline ? 1 : 0);
      return Date.parse(b.created_at) - Date.parse(a.created_at);
    });
    let o = '';
    if(!shown.length){ o += (!base.length && myFilter === 'pending') ? caughtUpHTML() : '<div class="hint" style="margin-top:12px">' + esc(!base.length ? t('my_none') : t('ls_none')) + '</div>'; }
    shown.forEach(function(b){ o += mineItem(b, today); });
    return o;
  };
  const seg = '<div class="seg wrapseg">' + [['pending', t('f_pending'), pend.length], ['done', t('f_done'), done.length], ['all', t('f_all'), list.length]].map(function(x){
    return '<button class="' + (myFilter === x[0] ? 'on' : '') + '" onclick="setMyFilter(\'' + x[0] + '\')">' + esc(x[1]) + ' (' + x[2] + ')</button>';
  }).join('') + '</div>';
  let h = (note ? '<div class="msg error" style="margin-top:0">' + esc(note) + '</div>' : '') +
    '<div class="card">' + (leaveChip(me.id) ? '<p class="muted" style="margin:0 0 10px">' + leaveChip(me.id) + '</p>' : '') + '<div class="segrow" style="margin-bottom:6px">' + seg + yearSegHTML() + '</div><div style="margin-top:8px">';
  h += batchBarHTML() + lsBar('mine', { ph: t('ls_filter'), def: 'newest', sortLabel: t('ls_sort'), sorts: [['newest', t('s_newest')], ['oldest', t('s_oldest')], ['deadline', t('s_deadline')]] }) + '<div id="mine_body">' + LR.mine() + '</div>';
  return h + '</div></div>';
}
function mineItem(b, today){
    const isDone = !!b.acknowledged_at, dl = b.eff_deadline || b.deadline;
    const st = isDone ? 'done' : bulletinStatus(1, 0, dl, today);
    const qp = qzPassed(b.id, me.id);
    let chips = '';
    if(b.superseded_by) chips += ' <span class="chip grey">' + esc(t('rev_superseded')) + '</span>';
    if(b.supersedes) chips += ' <span class="chip progress">' + esc(t('rev_revision')) + '</span>';
    if(b.quiz_required) chips += qp ? ' <span class="chip done">' + esc(t('quiz_chip')) + (b.quiz_best != null ? ' ' + b.quiz_best + '%' : '') + '</span>' : ' <span class="chip quiz">' + esc(t('quiz_chip')) + '</span>';
    const ext = dl !== b.deadline ? '<div class="muted">' + esc(t('lv_ext', { d: fmtShort(dl) })) + '</div>' : '';
    const canSel = !isDone && (!b.quiz_required || qp);
    return '<div class="bitem"><div class="row">' + (batch.on && !isDone ? '<input type="checkbox" ' + (canSel ? '' : 'disabled ') + (batch.sel[b.id] ? 'checked ' : '') + 'onchange="batchPick(' + Number(b.id) + ',this.checked)">' : '') +
      '<div class="grow">' + bno(b, true) + chips + '<br><b>' + esc(b.title) + '</b>' +
      '<div class="muted">' + esc(isDone ? t('acked_short', { d: fmtShort(b.acknowledged_at) }) : dueLine(dl, today)) + '</div>' + ext + '</div>' +
      chip(st) + (isDone ? '<button class="btn ghost sm" onclick="receiptFromList(' + Number(b.id) + ')">' + esc(t('rc_save')) + '</button>' : (batch.on ? '' : '<button class="btn sm" onclick="openMine(' + Number(b.id) + ')">' + esc(t('tab_ack')) + '</button>')) + '</div></div>';
}

async function doChangePin(){

  const b = $('cpBtn'); if(b) b.disabled = true;
  const r = await rpc('ack_change_pin', { p_staff_id: me.id, p_old: o, p_new: n });
  if(b) b.disabled = false;
  if(r.error){ say(t('unavailable')); return; }
  if(!r.data.ok){ say(r.data.error === 'wrong_pin' ? t('err_wrong_pin') : (r.data.error === 'locked' ? t('err_locked') : t('err_generic'))); return; }

async function onAckClick(){
  if(!formValid()) return;
  const b = pub.bulletins.find(function(x){ return x.id === curB; });
  const sel = staffList.find(function(s){ return String(s.id) === String(form.staffId); });
  if(!b || !sel) return;
  const quizFirst = needsQuiz(b, sel.id);
  const ok = quizFirst ? true : await confirmDialog(t('confirm_title'), esc(t('confirm_body', { bulletin: b.number, name: sel.name, division: sel.division })), t('confirm'), t('cancel'));
  if(!ok) return;
  form.busy = true; form.msg = null; renderAckForm();
  if(!sel.has_pin){
    const r1 = await rpc('ack_set_pin', { p_staff_id: sel.id, p_pin: form.pin, p_code: sel.needs_code ? form.code : null });
    if(r1.error){ form.busy = false; form.msg = { kind: 'error', text: t('unavailable') }; renderAckForm(); return; }
    if(!r1.data.ok){
      form.busy = false;
      if(r1.data.error === 'already_set'){ sel.has_pin = true; form.pin = ''; form.pin2 = ''; form.msg = { kind: 'error', text: t('err_already_set') }; }
      else if(r1.data.error === 'wrong_code'){ form.code = ''; form.msg = { kind: 'error', text: t('err_wrong_code') }; }
      else if(r1.data.error === 'code_expired') form.msg = { kind: 'error', text: t('err_code_expired') };
      else form.msg = { kind: 'error', text: t('err_generic') };
      renderAckForm(); return;
    }
    sel.has_pin = true; sel.needs_code = false;
  }
  if(quizFirst){ form.busy = false; renderAckForm(); await openQuiz(b, sel.id, form.pin); renderAckForm(); return; }
  const r = await rpc('ack_acknowledge', { p_bulletin_id: b.id, p_staff_id: sel.id, p_pin: form.pin });
  form.busy = false;
  if(r.error){ form.msg = { kind: 'error', text: t('unavailable') }; renderAckForm(); return; }
  const d = r.data;
  if(d.ok){
    try { localStorage.setItem('ackStaff', String(sel.id)); } catch(e) {}
    result = { kind: d.already ? 'already' : 'ok', at: d.acknowledged_at, late: d.late, name: sel.name, sid: sel.id, division: sel.division };
    renderAckForm(); renderMini();
    loadPublic();
    if(me && me.id === sel.id) loadMine();
    return;
  }
  form.pin = ''; form.pin2 = '';
  if(d.error === 'wrong_pin') form.msg = { kind: 'error', text: t('err_wrong_pin') };
  else if(d.error === 'locked') form.msg = { kind: 'error', text: t('err_locked') };
  else if(d.error === 'bulletin_not_found') form.msg = { kind: 'error', text: t('err_no_bulletin') };
  else if(d.error === 'quiz_required'){ form.msg = { kind: 'error', text: t('quiz_req_err') }; renderAckForm(); await openQuiz(b, sel.id, form.pin); return; }
  else form.msg = { kind: 'error', text: t('err_generic') };
  renderAckForm();
}

/* Division ranking: primary score = on-time rate (acknowledged by the deadline, or still overdue).
   Ties: higher acknowledgment rate, then fewer people with overdue items, then more items counted. */
function divRanking(c){
  const L = c.divisions.map(function(d){ return { d: d, ot: d.due ? d.onTime / d.due : null, ack: d.required ? d.acked / d.required : 0 }; });
  const key = function(x){ return x.ot === null ? -1 : x.ot; };
  L.sort(function(a, b){ return (key(b) - key(a)) || (b.ack - a.ack) || (a.d.overdueN - b.d.overdueN) || (b.d.due - a.d.due) || a.d.division.localeCompare(b.d.division); });
  L.forEach(function(x, i){
    const prev = L[i - 1];
    const same = prev && key(prev) === key(x) && prev.ack === x.ack && prev.d.overdueN === x.d.overdueN;
    x.rank = x.ot === null ? null : (same ? prev.rank : i + 1);
  });
  return L;
}
function rankBadge(r){ return r === null ? '<span class="rk rk0">-</span>' : '<span class="rk rk' + (r <= 3 ? r : 'n') + '">' + r + '</span>'; }
function divRankHTML(c){
  const L = divRanking(c); if(!L.length) return '';
  let h = '<div class="card">' + ch('chart', 'Division ranking') + '<p class="muted" style="margin-top:-4px">Ranked by on-time rate (acknowledged by the deadline). Ties are broken by acknowledgment rate, then by fewer people with overdue items.</p>';
  L.forEach(function(x){
    const d = x.d, ot = x.ot === null ? null : Math.round(x.ot * 100);
    h += '<div class="rkrow">' + rankBadge(x.rank) + '<span class="rkd">' + divTag(d.division) + '</span>' + divBar(ot === null ? 0 : ot, d.division) +

      '<span class="rkv2 muted">Acknowledged ' + pct(d.acked, d.required) + '% &middot; ' + (d.overdueN ? '<span style="color:var(--red);font-weight:600">' + d.overdueN + ' with overdue</span>' : 'none overdue') + '</span></div>';

  return h + '</div>';
}

/* ---------- Sort + filter for lists ---------- */
/* Tables marked class="sf": click a heading to sort, type in the box to filter, pick a Division / Status / PIN / Role value. */
const TS = {};
const SF_FILTER_COLS = ['Division', 'Status', 'PIN', 'Role', 'Action'];
function sfKey(txt, head){
  txt = String(txt).trim();
  if(txt === '' || txt === '-') return null;
  if(head === 'Division'){ const i = CFG.divOrder.indexOf(txt.split(' ')[0]); return i < 0 ? 999 : i; }
  let m = txt.match(/^(\d{1,2}) ([A-Z][a-z]{2}) (\d{2})(?: (\d{2}):(\d{2}))?/);
  if(m){ const d = Date.parse(m[1] + ' ' + m[2] + ' 20' + m[3] + ' ' + (m[4] || '00') + ':' + (m[5] || '00')); if(!isNaN(d)) return d; }
  m = txt.match(/^(\d+(?:\.\d+)?)\s*\/\s*(\d+)/); if(m) return Number(m[2]) ? Number(m[1]) / Number(m[2]) : 0;
  m = txt.match(/^(\d+(?:\.\d+)?)\s*(%|d|h)?(?![A-Za-z])/); if(m){ let v = Number(m[1]); if(m[2] === 'h') v = v / 24; return v; }
  return txt.toLowerCase();
}
function sfCmp(a, b){
  if(a === null && b === null) return 0; if(a === null) return 1; if(b === null) return -1;
  if(typeof a === 'number' && typeof b === 'number') return a - b;
  return String(a).localeCompare(String(b));
}
function sfApply(t){
  const st = TS[t.dataset.tid], body = t.tBodies[0], heads = Array.prototype.map.call(t.tHead.rows[0].cells, function(c){ return c.dataset.h || c.textContent.replace(/[▲▼]/g, '').trim(); });
  const rows = Array.prototype.slice.call(body.rows).filter(function(r){ return !(r.cells.length === 1 && r.cells[0].colSpan > 1); });
  const q = st.q.toLowerCase(); let shown = 0;
  rows.forEach(function(r){
    let ok = !q || r.textContent.toLowerCase().indexOf(q) >= 0;
    Object.keys(st.f).forEach(function(i){ if(st.f[i] && ok){ const c = r.cells[i]; ok = !!c && c.textContent.trim().indexOf(st.f[i]) === 0 || (!!c && c.textContent.trim() === st.f[i]); } });
    r.style.display = ok ? '' : 'none'; if(ok) shown++;
  });
  const idx = rows.map(function(r, i){ if(r.dataset.i === undefined) r.dataset.i = i; return Number(r.dataset.i); });
  const sorted = rows.slice().sort(function(a, b){
    if(st.k < 0) return Number(a.dataset.i) - Number(b.dataset.i);
    const ka = sfKey(a.cells[st.k] ? a.cells[st.k].textContent : '', heads[st.k]), kb = sfKey(b.cells[st.k] ? b.cells[st.k].textContent : '', heads[st.k]);
    if(ka === null || kb === null) return sfCmp(ka, kb);
    return sfCmp(ka, kb) * st.dir || (Number(a.dataset.i) - Number(b.dataset.i));
  });
  sorted.forEach(function(r){ body.appendChild(r); });
  Array.prototype.forEach.call(t.tHead.rows[0].cells, function(th, i){
    const lab = th.dataset.h || th.textContent.replace(/[▲▼]/g, '').trim(); th.dataset.h = lab;
    if(lab) th.textContent = lab + (st.k === i ? (st.dir > 0 ? ' ▲' : ' ▼') : '');
  });
  const cnt = t.closest('.tablewrap').previousElementSibling; const c = cnt && cnt.querySelector('.sfcnt'); if(c) c.textContent = shown === rows.length ? rows.length + ' rows' : shown + ' of ' + rows.length + ' rows';
}
function enhanceTables(){
  Array.prototype.forEach.call(document.querySelectorAll('#view table.sf'), function(t){
    const id = t.dataset.tid, st = TS[id] || (TS[id] = { k: -1, dir: 1, q: '', f: {} });
    const wrap = t.closest('.tablewrap'), heads = Array.prototype.map.call(t.tHead.rows[0].cells, function(c){ return c.textContent.trim(); });
    Array.prototype.forEach.call(t.tHead.rows[0].cells, function(th, i){
      if(!heads[i]) return; th.classList.add('sortable');
      th.onclick = function(){ if(st.k === i) st.dir = -st.dir; else { st.k = i; st.dir = 1; } sfApply(t); };
    });
    const rows = Array.prototype.slice.call(t.tBodies[0].rows).filter(function(r){ return !(r.cells.length === 1 && r.cells[0].colSpan > 1); });
    let bar = '<div class="sfbar"><input type="text" class="lsq" placeholder="Filter this list" value="' + esc(st.q) + '">';
    heads.forEach(function(hd, i){
      if(SF_FILTER_COLS.indexOf(hd) < 0) return;
      const vals = []; rows.forEach(function(r){ const v = r.cells[i] ? r.cells[i].textContent.trim() : ''; if(v && v !== '-' && vals.indexOf(v) < 0) vals.push(v); });
      if(vals.length < 2 || hd === 'Action') return;
      if(hd === 'Division') vals.sort(cmpDiv); else vals.sort();
      bar += '<select data-col="' + i + '"><option value="">' + esc('All ' + (hd === 'PIN' ? 'PIN states' : hd.toLowerCase() + (hd === 'Status' ? 'es' : 's'))) + '</option>' + vals.map(function(v){ return '<option' + (st.f[i] === v ? ' selected' : '') + '>' + esc(v) + '</option>'; }).join('') + '</select>';
    });

    wrap.insertAdjacentHTML('beforebegin', bar);
    const el = wrap.previousElementSibling;
    el.querySelector('input').oninput = function(){ st.q = this.value; sfApply(t); };
    Array.prototype.forEach.call(el.querySelectorAll('select'), function(sel){ sel.onchange = function(){ st.f[sel.dataset.col] = sel.value; sfApply(t); }; });

}

function setStSort(k){ stSort = { k: k, dir: stSort.k === k ? -stSort.dir : 1 }; render(); }
function roleOf(s){ return s.is_super ? 'Super Admin' : (s.is_ct ? 'CT Admin' : (s.is_manager ? 'OPS Manager' : 'Staff')); }
function roleChip(s){ return roleChip0(s) + (s.is_go ? ' <span class="chip go">GO</span>' : ''); }
function roleChip0(s){ return s.is_super ? '<span class="chip violet">Super Admin</span>' : (s.is_ct ? '<span class="chip blue">CT Admin</span>' : (s.is_manager ? '<span class="chip teal">OPS Manager</span>' : '<span class="chip grey">Staff</span>')); }
function staffCmp(a, b){
  const k = stSort.k, rr = function(x){ return x.is_super ? 0 : (x.is_ct ? 1 : (x.is_manager ? 2 : 3)); }, pr = function(x){ return x.has_pin ? 0 : (x.code_pending ? 1 : 2); };
  let v = 0;
  if(k === 'name') v = a.name.localeCompare(b.name);
  else if(k === 'division') v = cmpDiv(a.division, b.division);
  else if(k === 'role') v = rr(a) - rr(b);
  else if(k === 'pin') v = pr(a) - pr(b);
  else if(k === 'head') v = (a.head_of || '~').localeCompare(b.head_of || '~');

/* ---------- Acknowledgment log (CT) ---------- */
const LOGST = { ontime: ['On time', 'green', 0], late: ['Late', 'amber', 1], overdue: ['Overdue', 'red', 2], pending: ['Pending', 'blue', 3] };
function logRows(c){
  const rows = [];
  c.bullets.forEach(function(b){
    b.reqIds.forEach(function(sid){
      const s = c.staffById[sid] || { name: '?', division: '-', active: true };
      const at = c.ackAt[b.id + '_' + sid] || null;
      const div = (c.divAt && c.divAt[b.id + '_' + sid]) || s.division;
      let st, days = null;
      if(at){ const d = daysBetween(b.deadline, bkkDate(at)); if(d > 0){ st = 'late'; days = d; } else st = 'ontime'; }
      else { const dd = daysBetween(b.deadline, c.today); if(dd > 0){ st = 'overdue'; days = dd; } else { st = 'pending'; days = -dd; } }
      rows.push({ b: b, sid: sid, name: s.name, left: !s.active, division: div, at: at, st: st, days: days, turn: at ? (Date.parse(at) - Date.parse(b.created_at)) / 86400000 : null });
    });
  });
  return rows;
}
function lgStatusHTML(r){
  const L = LOGST[r.st];
  const extra = r.st === 'late' ? ' ' + r.days + ' d' : (r.st === 'overdue' ? ' ' + r.days + ' d' : (r.st === 'pending' ? ' (' + (r.days === 0 ? 'due today' : r.days + ' d left') + ')' : ''));
  return '<span class="chip ' + L[1] + '">' + L[0] + extra + '</span>';
}
function lgFiltered(){
  if(!comp) return [];
  const q = lg.q.toLowerCase();
  let rows = logRows(comp).filter(function(r){
    return (!lg.bulletin || String(r.b.id) === lg.bulletin) && (!lg.division || r.division === lg.division) && (!lg.status || r.st === lg.status) && (!q || r.name.toLowerCase().indexOf(q) >= 0);
  });
  const k = lg.sort, d = lg.dir;
  rows.sort(function(a, b){
    let v = 0;
    if(k === 'name') v = a.name.localeCompare(b.name);
    else if(k === 'division') v = cmpDiv(a.division, b.division);
    else if(k === 'bulletin') v = a.b.number.localeCompare(b.b.number);
    else if(k === 'issued') v = Date.parse(a.b.created_at) - Date.parse(b.b.created_at);
    else if(k === 'deadline') v = a.b.deadline < b.b.deadline ? -1 : (a.b.deadline > b.b.deadline ? 1 : 0);
    else if(k === 'ack') v = (a.at ? Date.parse(a.at) : Infinity) - (b.at ? Date.parse(b.at) : Infinity);
    else if(k === 'status') v = (LOGST[a.st][2] - LOGST[b.st][2]) || (b.days - a.days);
    if(!isFinite(v)) v = (a.at ? 0 : 1) - (b.at ? 0 : 1);
    return (v * d) || a.name.localeCompare(b.name);
  });
  return rows;
}
function lgSortTh(k, label){ return '<th class="sortable" onclick="lgSort(\'' + k + '\')">' + label + (lg.sort === k ? (lg.dir > 0 ? ' &#9650;' : ' &#9660;') : '') + '</th>'; }

function dcRows(){

function chunk(arr, n){ const o = []; for(let i = 0; i < arr.length; i += n) o.push(arr.slice(i, i + n)); return o; }
function rpChip(st, L){ return '<span class="rpc ' + st + '">' + esc(I[L]['st_' + st]) + '</span>'; }
function rpBar(p, cls){ return '<div class="rpbar ' + (cls || '') + '"><span style="width:' + Math.max(0, Math.min(100, p)) + '%"></span></div>'; }
function rpCtx(scope){ if(String(scope).indexOf('mg:') === 0){ const x = rpCtx(scope.slice(3)); x.mg = true; return x; } return scope === 'team' && head ? { c: head.comp, team: true, div: head.division } : { c: comp, team: false, div: '' }; }
function reportBlocks(L, scope){
  if(String(scope).indexOf('mg:') === 0) return mgmtBlocks(L, scope.slice(3));
  const cx = rpCtx(scope), c = cx.c, T = c.totals, X = R[L];
  const sig = (L === 'th' ? CFG.sigTh : CFG.sigEn);
  const blocks = [];
  // 1. header band + KPI row
  blocks.push('<section class="rpb nopad"><div class="rphead"><div class="o">' + esc(sig[0]) + ' &middot; ' + esc(sig[1]) + '</div><h1>' + esc(X.title) + '</h1><div class="d">' + (cx.team ? esc(X.team + ' ' + cx.div) + ' &middot; ' : '') + esc(X.asof) + ' ' + esc(fmtDateL(c.today, L)) + '</div></div>' +
    '<div class="rpkpis">' +
    '<div class="rpk"><div class="n">' + T.bulletins + '</div><div class="l">' + esc(X.k_b) + '</div></div>' +
    '<div class="rpk g"><div class="n">' + T.done + '</div><div class="l">' + esc(X.k_done) + '</div></div>' +
    '<div class="rpk b"><div class="n">' + T.progress + '</div><div class="l">' + esc(X.k_prog) + '</div></div>' +
    '<div class="rpk r"><div class="n">' + T.overdue + '</div><div class="l">' + esc(X.k_over) + '</div></div>' +
    '<div class="rpk t"><div class="n">' + T.rate + '%</div><div class="l">' + esc(X.k_rate) + '</div></div></div></section>');
  blocks.push('<section class="rpb"><div class="rph">' + esc(X.h_perf) + '</div><div class="rpkpis">' +
    '<div class="rpk g"><div class="n">' + rt(T.onTimeRate) + '</div><div class="l">' + esc(X.k_ot) + '</div></div>' +
    '<div class="rpk"><div class="n">' + rt(T.fastRate) + '</div><div class="l">' + esc(X.k_24) + '</div></div>' +
    '<div class="rpk g"><div class="n">' + T.upToDate + '/' + T.withReq + '</div><div class="l">' + esc(X.k_ok) + '</div></div>' +
    '<div class="rpk b"><div class="n">' + esc(fmtDur(T.avg)) + '</div><div class="l">' + esc(X.k_avg) + '</div></div>' +
    '<div class="rpk r"><div class="n">' + (T.oldest ? T.oldest + ' ' + esc(X.d_u) : '-') + '</div><div class="l">' + esc(X.k_old) + '</div></div></div></section>');
  // 2. bulletins table
  if(!c.bullets.length){
    blocks.push('<section class="rpb"><div class="rph">' + esc(X.h_b) + '</div><div>' + esc(X.none_b) + '</div></section>');
  } else {
    chunk(c.bullets, 5).forEach(function(part, i){
      let h = '<section class="rpb"><div class="rph">' + esc(X.h_b) + (i ? ' ' + esc(X.cont) : '') + '</div><table class="rpt"><thead><tr><th>' + esc(X.c_no) + '</th><th>' + esc(X.c_title) + '</th><th>' + esc(X.c_dl) + '</th><th>' + esc(X.c_prog) + '</th><th>' + esc(X.c_st) + '</th></tr></thead><tbody>';
      part.forEach(function(b){
        h += '<tr><td>' + esc(b.number) + '</td><td>' + esc(b.title) + '</td><td>' + esc(fmtDateL(b.deadline, L)) + '<br><span style="color:#5c6b80;font-size:10px">' + esc(dueText(b.deadline, c.today, L)) + '</span></td>' +
          '<td>' + rpBar(pct(b.acked, b.required), b.status) + '<div style="font-size:10.5px;color:#5c6b80;margin-top:3px">' + b.acked + ' / ' + b.required + ' (' + pct(b.acked, b.required) + '%)</div></td><td>' + rpChip(b.status, L) + '</td></tr>';
      });
      blocks.push(h + '</tbody></table></section>');
    });
  }
  // 3. divisions
  if(!cx.team && c.divisions.length){
    blocks.push('<section class="rpb"><div class="rph">' + esc(X.h_div) + '</div>' + divRanking(c).map(function(x){
      const d = x.d;
      return '<div class="rpd"><span class="nm"><b>' + (x.rank === null ? '-' : '#' + x.rank) + '</b> ' + esc(d.division) + '</span>' + rpBar(pct(d.acked, d.required)) + '<span class="v" style="width:150px">' + pct(d.acked, d.required) + '% &middot; ' + esc(X.k_ot) + ' ' + (x.ot === null ? '-' : Math.round(x.ot * 100) + '%') + '</span></div>';
    }).join('') + '</section>');
  }
  // 4. outstanding by person
  const per = {};
  c.bullets.forEach(function(b){ b.pendingIds.forEach(function(sid){ (per[sid] = per[sid] || []).push(b); }); });
  const ids = Object.keys(per).map(Number).filter(function(sid){ return c.staffById[sid]; }).sort(function(a, b){ const x = c.staffById[a], y = c.staffById[b]; return cmpDiv(x.division, y.division) || x.name.localeCompare(y.name); });
  if(ids.length){

      part.forEach(function(sid){

      });
      blocks.push(h + '</tbody></table></section>');
    });
  } else if(c.bullets.length){
    blocks.push('<section class="rpb"><div class="rph">' + esc(X.h_out) + '</div><div>' + esc(X.none) + '</div></section>');
  }
  // 5. note + signature block
  blocks.push('<section class="rpb"><p class="rpnote">' + esc(X.note) + '</p><div class="rpsig">' +
    ['prep', 'rev'].map(function(k){ return '<div><div class="t">' + esc(X[k]) + '</div><div class="ln">' + esc(X.sign) + '</div><div class="ln">' + esc(X.name) + '</div><div class="ln">' + esc(X.date) + '</div></div>'; }).join('') +
    '</div><div class="rporg">' + esc(sig[0]) + ' / ' + esc(sig[1]) + ' / ' + esc(sig[2]) + ' &middot; v' + APP_VERSION + '</div></section>');
  return blocks;
}

function loadScript(src){
  return new Promise(function(res, rej){
    const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = function(){ rej(new Error('Could not load ' + src)); };
    document.head.appendChild(s);
  });
}
async function loadPdfLibs(){
  if(window.html2canvas && window.jspdf) return;
  await Promise.all(LIBS.map(loadScript));
}
async function buildPDFBlob(L, scope){
  await loadPdfLibs();
  if(document.fonts && document.fonts.ready){ try { await document.fonts.ready; } catch(e) {} }
  const blocks = reportBlocks(L, scope), stage = $('pdfStage');
  const jsPDF = window.jspdf.jsPDF;
  const pdf = new jsPDF({ unit: 'mm', format: 'a4', orientation: 'p' });
  const PW = 210, PH = 297, BOT = 10;
  let y = 0, first = true;
  for(let i = 0; i < blocks.length; i++){
    stage.innerHTML = blocks[i];
    const el = stage.firstElementChild;
    const canvas = await window.html2canvas(el, { scale: 2, backgroundColor: '#ffffff', useCORS: true, logging: false, width: 794, windowWidth: 794 });
    const h = canvas.height * PW / canvas.width;
    if(!first && y + h > PH - BOT){ pdf.addPage(); y = 0; }
    pdf.addImage(canvas.toDataURL('image/jpeg', 0.92), 'JPEG', 0, y, PW, h);
    y += h; first = false;
  }
  stage.innerHTML = '';
  const n = pdf.getNumberOfPages();
  for(let p = 1; p <= n; p++){ pdf.setPage(p); pdf.setFontSize(8); pdf.setTextColor(120); pdf.text('v' + APP_VERSION + '   ' + p + ' / ' + n, PW / 2, PH - 5, { align: 'center' }); }
  return pdf.output('blob');
}
function setPdfBusy(on){ pdfBusy = on; Array.prototype.forEach.call(document.querySelectorAll('.pdfb'), function(b){ b.disabled = on; }); }
async function reportPDF(scope, mode, L){
  L = L || lang;
  const cx = rpCtx(scope); if(!cx.c || pdfBusy) return;
  setPdfBusy(true); toast('Preparing PDF...', '');
  let blob = null;
  try { blob = await buildPDFBlob(L, scope); }
  catch(e){ toast('Could not create the PDF (' + (e && e.message ? e.message : 'error') + ')', 'error'); }
  setPdfBusy(false);
  if(!blob) return;
  const name = (cx.mg ? 'OPS-Bulletin-Management-Report-' + mgTag() + '-' : 'OPS-Bulletin-Report-') + (cx.team ? 'Team-' + safeTag(cx.div) : 'CT') + '-' + cx.c.today + '.pdf';
  if(mode === 'download'){ saveBlob(blob, name); toast('PDF downloaded', 'success'); return; }
  const subject = (cx.mg ? RM[L].title : R[L].title) + (cx.team ? ' - ' + R[L].team + ' ' + cx.div : '') + ' - ' + fmtDateL(cx.c.today, L);
  const bodyTxt = L === 'th' ? 'เรียน ผู้เกี่ยวข้อง\n\nขอส่งรายงานการรับทราบ OPS Bulletin ตามไฟล์ PDF ที่แนบ' : 'Dear all,\n\nPlease find attached the OPS Bulletin acknowledgment report (PDF).';
  const isApple = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const file = new File([blob], name, { type: 'application/pdf' });
  if(isApple && navigator.canShare && navigator.canShare({ files: [file] })){
    try { await navigator.share({ files: [file], title: subject, text: bodyTxt }); return; }
    catch(e){ if(e && e.name === 'AbortError') return; }
  }
  saveBlob(blob, name);
  toast('PDF downloaded. Attach it to the email that opens next.', 'success');
  setTimeout(function(){ location.href = 'mailto:?subject=' + encodeURIComponent(subject) + '&body=' + encodeURIComponent(bodyTxt); }, 600);
}

/* ---------- leave windows: the deadline moves later by the leave days inside the bulletin period ---------- */
let LEAVES = [], _edc = {};
function setLeaves(list){ LEAVES = (list || []).filter(function(l){ return !l.cancelled; }); _edc = {}; }
function effDeadline(b, sid){
  const key = b.id + '_' + sid; if(_edc[key]) return _edc[key];
  let ex = 0;
  const ls = LEAVES.filter(function(l){ return l.s === sid; });
  if(ls.length){
    const start = bkkDate(b.created_at), days = {};
    ls.forEach(function(l){
      const a = l.from > start ? l.from : start, z = l.to < b.deadline ? l.to : b.deadline;
      for(let d = a, n = 0; d <= z && n < 800; d = addDaysStr(d, 1), n++) days[d] = 1;
    });
    ex = Object.keys(days).length;
  }
  return (_edc[key] = ex ? addDaysStr(b.deadline, ex) : b.deadline);
}

/* ---------- QR code per bulletin ---------- */
function qrLink(id){ return appBase() + '?b=' + id; }
function qrMatrix(url){ const q = qrcode(0, 'M'); q.addData(url); q.make(); return q; }
function qrSvg(url, px){
  const q = qrMatrix(url), n = q.getModuleCount(), m = 3, size = n + m * 2; let d = '';
  for(let r = 0; r < n; r++) for(let c = 0; c < n; c++) if(q.isDark(r, c)) d += 'M' + (c + m) + ' ' + (r + m) + 'h1v1h-1z';
  return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' + size + ' ' + size + '" width="' + px + '" height="' + px + '" shape-rendering="crispEdges"><rect width="' + size + '" height="' + size + '" fill="#fff"/><path d="' + d + '" fill="#10223a"/></svg>';
}
function qrCanvas(url, px){
  const q = qrMatrix(url), n = q.getModuleCount(), m = 3, size = n + m * 2, cell = Math.floor(px / size), c = document.createElement('canvas');
  c.width = c.height = cell * size; const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.fillStyle = '#10223a';
  for(let r = 0; r < n; r++) for(let k = 0; k < n; k++) if(q.isDark(r, k)) g.fillRect((k + m) * cell, (r + m) * cell, cell, cell);
  return c;
}

}

/* ====================== V3: INSIGHTS (response time, understanding checks, recognition, Monday brief) ====================== */
function mean(a){ return a.length ? a.reduce(function(x, y){ return x + y; }, 0) / a.length : null; }
function median(a){ if(!a.length) return null; const s = a.slice().sort(function(x, y){ return x - y; }), m = Math.floor(s.length / 2); return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2; }
function hrs(days){ return days === null || days === undefined ? '-' : (days < 1 ? (days * 24).toFixed(1) + ' h' : days.toFixed(1) + ' d'); }

/* ---------- response-time analytics ---------- */
function respData(c){
  const all = [], byDiv = {}, byB = [], hours = new Array(24).fill(0), dow = new Array(7).fill(0);
  c.bullets.forEach(function(b){
    const bt = [];
    b.ackedIds.forEach(function(sid){
      const at = c.ackAt[b.id + '_' + sid], days = (Date.parse(at) - Date.parse(b.created_at)) / 86400000;
      if(!(days >= 0)) return;
      all.push(days); bt.push(days);
      const dv = c.divAt[b.id + '_' + sid] || '-'; (byDiv[dv] = byDiv[dv] || []).push(days);
      hours[Number(new Date(at).toLocaleString('en-GB', { timeZone: 'Asia/Bangkok', hour: '2-digit', hour12: false })) % 24]++;
      dow[new Date(bkkDate(at) + 'T00:00:00Z').getUTCDay()]++;
    });
    byB.push({ b: b, n: bt.length, avg: mean(bt), med: median(bt) });
  });
  return { all: all, byDiv: byDiv, byB: byB, hours: hours, dow: dow };
}
function respCardHTML(c){
  const d = respData(c);
  if(!d.all.length) return '<div class="card">' + ch('clock', 'Response-time analytics') + '<div class="hint">No acknowledgments in this period yet.</div></div>';

  let h = '<div class="card">' + ch('clock', 'Response-time analytics') + '<p class="muted" style="margin-top:-4px">How quickly people acknowledge, counted from the moment a bulletin is added. ' + d.all.length + ' acknowledgments.</p>' +
    '<div class="kpis">' + kpi(hrs(median(d.all)), 'Median time', 'progress', 'clock') + kpi(hrs(mean(d.all)), 'Average time', '', 'clock') + kpi(within(1) + '%', 'Within 24 hours', 'done', 'check') + kpi(within(3) + '%', 'Within 3 days', 'done', 'check') + kpi(within(7) + '%', 'Within 7 days', '', 'check') + '</div>';

    const a = d.byDiv[k]; return '<tr><td>' + divTag(k) + '</td><td>' + a.length + '</td><td>' + hrs(median(a)) + '</td><td>' + hrs(mean(a)) + '</td><td>' + pct(a.filter(function(v){ return v <= 1; }).length, a.length) + '%</td></tr>';

  h += '<h3>Time of day (Bangkok time)</h3>' + colChart(d.hours.map(function(v, i){ return { v: v, l: i % 3 === 0 ? String(i).padStart(2, '0') : '' }; }), '#1e4d8c', '#6aa6e0');

    return '<tr><td>' + bno(x.b, false) + '</td><td>' + x.n + ' / ' + x.b.required + '</td><td>' + hrs(x.med) + '</td><td>' + hrs(x.avg) + '</td></tr>'; }).join('') + '</tbody></table></div></div>';
  return h;

/* ---------- reminder stages (merged into the existing CT and Head email templates) ---------- */
const STAGES = [['all', 'Standard'], ['before3', '3 days before'], ['due', 'Due today'], ['late3', '3 days late'], ['late7', '7 days late']];
function stageFilter(st){
  if(st === 'before3') return function(b){ return b.daysLeft >= 1 && b.daysLeft <= 3; };
  if(st === 'due') return function(b){ return b.daysLeft === 0; };
  if(st === 'late3') return function(b){ return b.daysLeft <= -3 && b.daysLeft >= -6; };
  if(st === 'late7') return function(b){ return b.daysLeft <= -7; };
  return null;
}
const STAGE_TAG = {
  en: { before3: '[Reminder - due within 3 days]', due: '[Reminder - due today]', late3: '[Reminder - 3+ days overdue]', late7: '[Urgent reminder - 7+ days overdue]' },
  th: { before3: '[เตือน - ครบกำหนดภายใน 3 วัน]', due: '[เตือน - ครบกำหนดวันนี้]', late3: '[เตือน - เกินกำหนด 3 วันขึ้นไป]', late7: '[เตือนเร่งด่วน - เกินกำหนด 7 วันขึ้นไป]' }
};
function stageSubject(subject, opt){
  const st = opt.stage; if(!st || st === 'all') return subject;
  const tag = opt.language === 'th' ? STAGE_TAG.th[st] : (opt.language === 'en' ? STAGE_TAG.en[st] : STAGE_TAG.en[st] + ' / ' + STAGE_TAG.th[st]);
  return subject.replace(/^\[[^\]]*\]/, tag);
}
function stageLine(L, st, team, p){
  if(!st || st === 'all') return '';
  const T = {
    en: { before3: 'Reminder (3 days before the deadline): the bulletins below are due within the next 3 days.', due: 'Reminder (due today): the bulletins below are due for acknowledgment today.', late3: 'Follow-up (3 or more days overdue): the bulletins below are 3 or more days past the deadline.', late7: 'Final reminder (7 or more days overdue): the bulletins below are 7 or more days past the deadline. Please acknowledge them as soon as possible.' },
    th: { before3: 'แจ้งเตือนล่วงหน้า 3 วัน: Bulletin ตามรายการด้านล่างจะครบกำหนดรับทราบภายใน 3 วัน', due: 'แจ้งเตือนครบกำหนด: Bulletin ตามรายการด้านล่างครบกำหนดรับทราบในวันนี้', late3: 'ติดตามเกินกำหนด 3 วันขึ้นไป: Bulletin ตามรายการด้านล่างเกินกำหนดรับทราบตั้งแต่ 3 วันขึ้นไป', late7: 'ติดตามครั้งสุดท้าย (เกินกำหนด 7 วันขึ้นไป): Bulletin ตามรายการด้านล่างเกินกำหนดรับทราบตั้งแต่ 7 วันขึ้นไป โปรดดำเนินการโดยเร็วที่สุด' }
  };
  return p('<b>' + esc(T[L][st]) + '</b>');
}
function leaveNames(c, D){
  const o = {};
  Object.keys(c.staffById).forEach(function(k){ const s = c.staffById[k]; o[k] = Object.assign({}, s, { name: s.name + (onLeaveToday(s.id) ? (D ? ' (อยู่ระหว่างลา)' : ' (on leave)') : '') }); });
  return o;
}

  const today = bkkToday();
  const L = me.list.map(function(b){
    const dl = b.eff_deadline || b.deadline, done = !!b.acknowledged_at;
    const st = done ? 'done' : (b.superseded_by ? 'superseded' : bulletinStatus(1, 0, dl, today));
    return { b: b, st: st, dl: dl };
  });
  const open = L.filter(function(x){ return x.st === 'overdue' || x.st === 'progress'; }).sort(function(a, b){ return a.dl < b.dl ? -1 : (a.dl > b.dl ? 1 : 0); });
  const done = L.filter(function(x){ return x.st === 'done'; }).sort(function(a, b){ return a.b.acknowledged_at < b.b.acknowledged_at ? 1 : -1; });
  const sup = L.filter(function(x){ return x.st === 'superseded'; });
  return open.concat(done, sup);
}

function termLeft(dl, today){
  try {
    const a = Date.parse(String(dl).slice(0, 10) + 'T00:00:00Z'), b = Date.parse(String(today).slice(0, 10) + 'T00:00:00Z'), d = Math.round((a - b) / 864e5);
    if(isNaN(d)) return '';
    if(d === 0) return 'TODAY';
    if(d === 1) return '1 DAY';
    if(d > 1) return (d > 99 ? '99+' : d) + ' DAYS';
    return '-' + (d < -99 ? '99+' : Math.abs(d)) + (d === -1 ? ' DAY' : ' DAYS');
  } catch(e){ return ''; }
}

}

  ov.addEventListener('click', function(e){ if(e.target === ov) closeModal(); });
  const res = md.querySelector('#qsRes');
  let y0 = null, dy = 0, t0 = 0, drag = false;
  md.addEventListener('touchstart', function(e){
    if(res && res.contains(e.target) && res.scrollTop > 0){ y0 = null; return; }
    y0 = e.touches[0].clientY; t0 = Date.now(); dy = 0; drag = false;
  }, { passive: true });
  md.addEventListener('touchmove', function(e){
    if(y0 === null) return;
    dy = e.touches[0].clientY - y0;
    if(!drag){
      if(dy > 10){ drag = true; md.style.animation = 'none'; md.style.transition = 'none'; const i = $('qsIn'); if(i) i.blur(); }
      else if(dy < -10){ y0 = null; return; }
    }
    if(drag){ md.style.transform = 'translateY(' + Math.max(0, dy) + 'px)'; if(e.cancelable) e.preventDefault(); }
  }, { passive: false });
  const end = function(){
    if(y0 === null || !drag){ y0 = null; return; }
    const v = dy / Math.max(1, Date.now() - t0); y0 = null; drag = false;
    md.style.transition = 'transform .2s ease';
    if(dy > 90 || v > .6){ md.style.transform = 'translateY(100%)'; setTimeout(closeModal, 190); }
    else md.style.transform = 'translateY(0)';
  };
  md.addEventListener('touchend', end); md.addEventListener('touchcancel', end);
}

/* Same call as rpc(), but a missing function (SQL update 8 not run yet) must not turn the connection badge red. */
async function softRpc(name, args){
  const timeout = new Promise(function(_, rej){ setTimeout(function(){ rej(new Error('timeout')); }, 12000); });
  try {
    const r = await Promise.race([db.rpc(name, args || {}), timeout]);
    if(r.error) return { error: r.error, missing: /Could not find the function|PGRST202|does not exist/i.test((r.error.message || '') + (r.error.code || '')) };
    return { data: r.data };
  } catch(e){ return { error: e }; }
}

/* ---- touch: press, slide, release (a magnifying bubble follows the finger) ---- */
function loaAzShow(b){
  const s = $('azs'); if(!b || !s) return;

  if(!bub){ bub = document.createElement('div'); bub.id = 'azb'; bub.className = 'azb'; bub.setAttribute('aria-hidden', 'true'); document.body.appendChild(bub); }
  const r = b.getBoundingClientRect(), sr = s.getBoundingClientRect(), cx = r.left + r.width / 2, cl = Math.min(Math.max(cx, 46), window.innerWidth - 46);
  const below = sr.top - 100 < 8;                       // a strip at the top of the screen: the bubble goes underneath

function loaAzEnd(){

/* ---- mouse: hover magnifies like the Mac dock, click jumps ---- */
function loaAzHover(e){

    if(!b.offsetWidth) return;

    b.style.transform = 'translateY(' + (-2 * k) + 'px) scale(' + (1 + 0.55 * k) + ')'; b.classList.remove('hot');

  }

}

  await loadActing();
